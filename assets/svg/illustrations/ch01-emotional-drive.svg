<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#FAF7F0"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    医美消费的情感驱动机制
  </text>
  
  <!-- 情感驱动循环图 -->
  <circle cx="400" cy="200" r="80" fill="#FFCDD2" stroke="#E57373" stroke-width="3"/>
  <text x="400" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#C62828">
    情感驱动
  </text>
  <text x="400" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#C62828">
    核心动力
  </text>
  
  <!-- 四个主要情感因素 -->
  <!-- 自我不满 -->
  <rect x="80" y="120" width="140" height="80" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2" rx="10"/>
  <text x="150" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6A1B9A">
    自我不满
  </text>
  <text x="150" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6A1B9A">
    • 外貌焦虑
  </text>
  <text x="150" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6A1B9A">
    • 身体意象障碍
  </text>
  <text x="150" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6A1B9A">
    • 完美主义倾向
  </text>
  
  <!-- 社会比较 -->
  <rect x="580" y="120" width="140" height="80" fill="#C8E6C9" stroke="#81C784" stroke-width="2" rx="10"/>
  <text x="650" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">
    社会比较
  </text>
  <text x="650" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 向上比较
  </text>
  <text x="650" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 标准内化
  </text>
  <text x="650" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 群体压力
  </text>
  
  <!-- 年龄焦虑 -->
  <rect x="80" y="320" width="140" height="80" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" rx="10"/>
  <text x="150" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100">
    年龄焦虑
  </text>
  <text x="150" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 衰老恐惧
  </text>
  <text x="150" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 职场竞争
  </text>
  <text x="150" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 婚恋压力
  </text>
  
  <!-- 认同需求 -->
  <rect x="580" y="320" width="140" height="80" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="2" rx="10"/>
  <text x="650" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0277BD">
    认同需求
  </text>
  <text x="650" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 社会认同
  </text>
  <text x="650" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 自我价值
  </text>
  <text x="650" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 归属感
  </text>
  
  <!-- 连接线 -->
  <line x1="220" y1="160" x2="320" y2="180" stroke="#D4A574" stroke-width="2"/>
  <line x1="580" y1="160" x2="480" y2="180" stroke="#D4A574" stroke-width="2"/>
  <line x1="220" y1="360" x2="320" y2="240" stroke="#D4A574" stroke-width="2"/>
  <line x1="580" y1="360" x2="480" y2="240" stroke="#D4A574" stroke-width="2"/>
  
  <!-- 心理偏见循环 -->
  <rect x="250" y="440" width="300" height="100" fill="#F3E5F5" stroke="#CE93D8" stroke-width="2" rx="10"/>
  <text x="400" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#6A1B9A">
    心理偏见影响循环
  </text>
  
  <!-- 偏见类型 -->
  <circle cx="320" cy="510" r="20" fill="#CE93D8" stroke="#9C27B0" stroke-width="1"/>
  <text x="320" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A148C">
    乐观偏见
  </text>
  
  <circle cx="400" cy="510" r="20" fill="#CE93D8" stroke="#9C27B0" stroke-width="1"/>
  <text x="400" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A148C">
    从众心理
  </text>
  
  <circle cx="480" cy="510" r="20" fill="#CE93D8" stroke="#9C27B0" stroke-width="1"/>
  <text x="480" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A148C">
    沉没成本
  </text>
  
  <!-- 循环箭头 -->
  <path d="M 340 510 Q 400 480 460 510" stroke="#9C27B0" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 460 510 Q 400 540 340 510" stroke="#9C27B0" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9C27B0"/>
    </marker>
  </defs>
  
  <!-- 情感强度指标 -->
  <rect x="50" y="250" width="100" height="60" fill="#FFF8E1" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="100" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E65100">
    情感强度
  </text>
  <text x="100" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    高焦虑: 65%
  </text>
  <text x="100" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    中焦虑: 25%
  </text>
  
  <!-- 决策影响 -->
  <rect x="650" y="250" width="100" height="60" fill="#E8F5E8" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="700" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2E7D32">
    决策影响
  </text>
  <text x="700" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    非理性决策
  </text>
  <text x="700" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    风险低估
  </text>
  
  <!-- 底部说明 -->
  <text x="400" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    图1.5：医美消费的情感驱动机制及心理偏见循环
  </text>
</svg>