<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#FAF7F0"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    消费者决策心理账户机制
  </text>
  
  <!-- 心理账户定义 -->
  <rect x="150" y="80" width="500" height="60" fill="#C8E6C9" stroke="#81C784" stroke-width="3" rx="10"/>
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">
    心理账户定义
  </text>
  <text x="400" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2E7D32">
    人们在心理上对资金进行分类和管理的过程，60%消费者将医美视为"自我投资"而非简单消费
  </text>
  
  <!-- 心理账户特征 -->
  <rect x="50" y="160" width="700" height="120" fill="#E8F5E8" stroke="#81C784" stroke-width="2" rx="10"/>
  <text x="400" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">
    医美消费心理账户特征
  </text>
  
  <!-- 三个特征 -->
  <rect x="80" y="200" width="200" height="70" fill="#C8E6C9" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="180" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2E7D32">
    自我投资归类
  </text>
  <text x="180" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    • 归入投资账户非消费账户
  </text>
  <text x="180" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    • 价格敏感度相对较低
  </text>
  <text x="180" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    • 长期收益导向
  </text>
  
  <rect x="300" y="200" width="200" height="70" fill="#C8E6C9" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="400" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2E7D32">
    情感关联强烈
  </text>
  <text x="400" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    • 关系身体形象和自我认同
  </text>
  <text x="400" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    • 情感投入与消费金额正相关
  </text>
  <text x="400" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    • 情感需求驱动支付意愿
  </text>
  
  <rect x="520" y="200" width="200" height="70" fill="#C8E6C9" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="620" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2E7D32">
    跨期选择特征
  </text>
  <text x="620" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    • 当前成本vs未来收益权衡
  </text>
  <text x="620" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    • 时间偏好率影响决策
  </text>
  <text x="620" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    • 未来收益导向消费模式
  </text>
  
  <!-- 运作机制 -->
  <rect x="50" y="300" width="700" height="140" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" rx="10"/>
  <text x="400" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E65100">
    心理账户运作机制
  </text>
  
  <!-- 三个机制 -->
  <rect x="80" y="340" width="200" height="90" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="180" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E65100">
    预算分配机制
  </text>
  <text x="180" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • 心理预算设定
  </text>
  <text x="180" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • 占可支配收入5-15%
  </text>
  <text x="180" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • 收入消费习惯相关
  </text>
  <text x="180" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • 不同收入段相对稳定
  </text>
  
  <rect x="300" y="340" width="200" height="90" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="400" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E65100">
    成本收益评估
  </text>
  <text x="400" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • 多维度成本考量
  </text>
  <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • 收益估计偏高
  </text>
  <text x="400" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • 成本估计偏低
  </text>
  <text x="400" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • 评估偏差导致非理性决策
  </text>
  
  <rect x="520" y="340" width="200" height="90" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="620" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E65100">
    支付方式影响
  </text>
  <text x="620" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • 分期付款降低痛苦感
  </text>
  <text x="620" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • 信用卡消费金额更高
  </text>
  <text x="620" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • 预付卡支付意愿更强
  </text>
  <text x="620" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • 现金支付决策更谨慎
  </text>
  
  <!-- 常见偏差 -->
  <rect x="100" y="460" width="600" height="100" fill="#FFCDD2" stroke="#E57373" stroke-width="2" rx="10"/>
  <text x="400" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#C62828">
    常见心理账户偏差
  </text>
  
  <!-- 三个偏差 -->
  <rect x="130" y="500" width="160" height="50" fill="#FFEBEE" stroke="#E57373" stroke-width="1" rx="5"/>
  <text x="210" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C62828">
    沉没成本效应
  </text>
  <text x="210" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
    已投入成本影响后续决策
  </text>
  <text x="210" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
    持续消费倾向增强
  </text>
  
  <rect x="320" y="500" width="160" height="50" fill="#FFEBEE" stroke="#E57373" stroke-width="1" rx="5"/>
  <text x="400" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C62828">
    账户不可替代性
  </text>
  <text x="400" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
    不愿跨账户转移资金
  </text>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
    心理账户刚性特征
  </text>
  
  <rect x="510" y="500" width="160" height="50" fill="#FFEBEE" stroke="#E57373" stroke-width="1" rx="5"/>
  <text x="590" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C62828">
    支付痛苦差异
  </text>
  <text x="590" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
    支付方式影响痛苦感
  </text>
  <text x="590" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
    预付方式降低支付门槛
  </text>
  
  <!-- 底部说明 -->
  <text x="400" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    图3.3：医美消费心理账户特征、运作机制及常见偏差分析
  </text>
</svg>