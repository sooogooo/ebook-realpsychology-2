<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#FAF7F0"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    医美消费的社会影响网络
  </text>
  
  <!-- 中心节点 -->
  <circle cx="400" cy="300" r="60" fill="#E8D5C4" stroke="#D4A574" stroke-width="3"/>
  <text x="400" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8B4513">
    医美消费
  </text>
  <text x="400" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8B4513">
    社会影响
  </text>
  
  <!-- 社交媒体影响 -->
  <ellipse cx="200" cy="150" rx="80" ry="50" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="2"/>
  <text x="200" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0277BD">
    社交媒体
  </text>
  <text x="200" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 朋友圈分享
  </text>
  <text x="200" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 小红书种草
  </text>
  
  <!-- 同伴影响 -->
  <ellipse cx="600" cy="150" rx="80" ry="50" fill="#C8E6C9" stroke="#81C784" stroke-width="2"/>
  <text x="600" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">
    同伴影响
  </text>
  <text x="600" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 朋友推荐
  </text>
  <text x="600" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 群体跟风
  </text>
  
  <!-- 媒体宣传 -->
  <ellipse cx="150" cy="350" rx="80" ry="50" fill="#FFCDD2" stroke="#E57373" stroke-width="2"/>
  <text x="150" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C62828">
    媒体宣传
  </text>
  <text x="150" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 广告营销
  </text>
  <text x="150" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 明星效应
  </text>
  
  <!-- 文化标准 -->
  <ellipse cx="650" cy="350" rx="80" ry="50" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2"/>
  <text x="650" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6A1B9A">
    文化标准
  </text>
  <text x="650" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6A1B9A">
    • 审美趋势
  </text>
  <text x="650" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6A1B9A">
    • 时尚潮流
  </text>
  
  <!-- 家庭影响 -->
  <ellipse cx="300" cy="480" rx="80" ry="50" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2"/>
  <text x="300" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100">
    家庭影响
  </text>
  <text x="300" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 家人意见
  </text>
  <text x="300" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 家庭观念
  </text>
  
  <!-- 职场影响 -->
  <ellipse cx="500" cy="480" rx="80" ry="50" fill="#F3E5F5" stroke="#CE93D8" stroke-width="2"/>
  <text x="500" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6A1B9A">
    职场影响
  </text>
  <text x="500" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6A1B9A">
    • 职业形象
  </text>
  <text x="500" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6A1B9A">
    • 竞争压力
  </text>
  
  <!-- 连接线 -->
  <line x1="320" y1="270" x2="250" y2="190" stroke="#D4A574" stroke-width="2"/>
  <line x1="480" y1="270" x2="550" y2="190" stroke="#D4A574" stroke-width="2"/>
  <line x1="350" y1="330" x2="220" y2="350" stroke="#D4A574" stroke-width="2"/>
  <line x1="450" y1="330" x2="580" y2="350" stroke="#D4A574" stroke-width="2"/>
  <line x1="370" y1="350" x2="340" y2="430" stroke="#D4A574" stroke-width="2"/>
  <line x1="430" y1="350" x2="460" y2="430" stroke="#D4A574" stroke-width="2"/>
  
  <!-- 影响强度指标 -->
  <rect x="50" y="240" width="100" height="60" fill="#FFF8E1" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="100" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E65100">
    影响强度
  </text>
  <text x="100" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    社交媒体: 70%
  </text>
  <text x="100" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    同伴影响: 65%
  </text>
  
  <!-- 正负影响 -->
  <rect x="650" y="240" width="100" height="60" fill="#E8F5E8" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="700" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2E7D32">
    影响性质
  </text>
  <text x="700" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    积极: 信息透明
  </text>
  <text x="700" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    消极: 盲目跟风
  </text>
  
  <!-- 底部说明 -->
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    图1.4：医美消费的社会影响网络及作用机制
  </text>
</svg>