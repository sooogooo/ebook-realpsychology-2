<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#FAF7F0"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    外貌焦虑自我评估量表
  </text>
  
  <!-- 工具说明 -->
  <rect x="100" y="80" width="600" height="60" fill="#E8F5E8" stroke="#81C784" stroke-width="2" rx="10"/>
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">
    实用工具3.1
  </text>
  <text x="400" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2E7D32">
    帮助个体评估外貌焦虑程度，识别潜在身体意象问题，为医美消费决策提供心理参考
  </text>
  
  <!-- 四个评估维度 -->
  <rect x="50" y="160" width="700" height="280" fill="#F3E5F5" stroke="#CE93D8" stroke-width="2" rx="10"/>
  <text x="400" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#6A1B9A">
    评估维度与项目
  </text>
  
  <!-- 第一部分：外貌关注程度 -->
  <rect x="80" y="200" width="140" height="110" fill="#E1BEE7" stroke="#BA68C8" stroke-width="1" rx="5"/>
  <text x="150" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#6A1B9A">
    外貌关注程度
  </text>
  <text x="150" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    1. 担心外貌
  </text>
  <text x="150" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    2. 思考外貌问题
  </text>
  <text x="150" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    3. 避免他人看到
  </text>
  <text x="150" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    4. 经常照镜子
  </text>
  <text x="150" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    5. 花时间金钱改善
  </text>
  <text x="150" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#6A1B9A">
    (5-25分)
  </text>
  
  <!-- 第二部分：社会比较倾向 -->
  <rect x="240" y="200" width="140" height="110" fill="#E1BEE7" stroke="#BA68C8" stroke-width="1" rx="5"/>
  <text x="310" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#6A1B9A">
    社会比较倾向
  </text>
  <text x="310" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    1. 与他人比较外貌
  </text>
  <text x="310" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    2. 看到美丽者自卑
  </text>
  <text x="310" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    3. 社交媒体压力
  </text>
  <text x="310" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    4. 羡慕他人外貌
  </text>
  <text x="310" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    5. 难达审美标准
  </text>
  <text x="310" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#6A1B9A">
    (5-25分)
  </text>
  
  <!-- 第三部分：情感影响 -->
  <rect x="400" y="200" width="140" height="110" fill="#E1BEE7" stroke="#BA68C8" stroke-width="1" rx="5"/>
  <text x="470" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#6A1B9A">
    情感影响
  </text>
  <text x="470" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    1. 外貌导致抑郁
  </text>
  <text x="470" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    2. 避免社交活动
  </text>
  <text x="470" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    3. 担心他人评判
  </text>
  <text x="470" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    4. 影响自信心
  </text>
  <text x="470" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    5. 外貌焦虑情绪
  </text>
  <text x="470" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#6A1B9A">
    (5-25分)
  </text>
  
  <!-- 第四部分：行为表现 -->
  <rect x="560" y="200" width="140" height="110" fill="#E1BEE7" stroke="#BA68C8" stroke-width="1" rx="5"/>
  <text x="630" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#6A1B9A">
    行为表现
  </text>
  <text x="630" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    1. 化妆掩盖缺陷
  </text>
  <text x="630" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    2. 特定角度拍照
  </text>
  <text x="630" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    3. 避免某些活动
  </text>
  <text x="630" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    4. 反复询问看法
  </text>
  <text x="630" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    5. 过度关注评价
  </text>
  <text x="630" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#6A1B9A">
    (5-25分)
  </text>
  
  <!-- 评分标准 -->
  <rect x="80" y="320" width="620" height="100" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" rx="10"/>
  <text x="400" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E65100">
    评分标准与结果解释
  </text>
  
  <!-- 评分说明 -->
  <text x="100" y="365" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    总分：各部分得分相加（20-100分）
  </text>
  
  <!-- 结果解释 -->
  <rect x="100" y="375" width="120" height="35" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="160" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#E65100">
    20-39分
  </text>
  <text x="160" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    焦虑程度较低
  </text>
  
  <rect x="240" y="375" width="120" height="35" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="300" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#E65100">
    40-59分
  </text>
  <text x="300" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    焦虑程度中等
  </text>
  
  <rect x="380" y="375" width="120" height="35" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="440" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#E65100">
    60-79分
  </text>
  <text x="440" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    焦虑程度较高
  </text>
  
  <rect x="520" y="375" width="120" height="35" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="580" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#E65100">
    80-100分
  </text>
  <text x="580" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    焦虑程度严重
  </text>
  
  <!-- 使用建议 -->
  <rect x="100" y="440" width="600" height="80" fill="#C8E6C9" stroke="#81C784" stroke-width="2" rx="10"/>
  <text x="400" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">
    使用建议
  </text>
  
  <!-- 建议要点 -->
  <rect x="130" y="475" width="130" height="35" fill="#E8F5E8" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="195" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#2E7D32">
    定期评估
  </text>
  <text x="195" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2E7D32">
    监测焦虑变化
  </text>
  
  <rect x="280" y="475" width="130" height="35" fill="#E8F5E8" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="345" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#2E7D32">
    专业帮助
  </text>
  <text x="345" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2E7D32">
    超过60分咨询专家
  </text>
  
  <rect x="430" y="475" width="130" height="35" fill="#E8F5E8" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="495" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#2E7D32">
    决策参考
  </text>
  <text x="495" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2E7D32">
    医美决策依据
  </text>
  
  <rect x="580" y="475" width="100" height="35" fill="#E8F5E8" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="630" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#2E7D32">
    综合评估
  </text>
  <text x="630" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2E7D32">
    结合其他因素
  </text>
  
  <!-- 底部说明 -->
  <text x="400" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    图3.5：外貌焦虑自我评估量表结构及使用指南
  </text>
</svg>