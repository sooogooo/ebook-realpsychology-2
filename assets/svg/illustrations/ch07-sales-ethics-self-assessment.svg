  <!-- 使用建议 -->
  <rect x="530" y="395" width="170" height="95" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="615" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E65100">
