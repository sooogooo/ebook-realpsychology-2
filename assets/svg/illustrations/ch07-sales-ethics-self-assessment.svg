  </text>
  <text x="615" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    4. 将评估结果纳入
  </text>
  <text x="615" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
