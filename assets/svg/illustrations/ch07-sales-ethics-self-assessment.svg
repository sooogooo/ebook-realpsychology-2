  </text>
  <text x="615" y="529" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    5. 建立伦理改进
  </text>
  <text x="615" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
