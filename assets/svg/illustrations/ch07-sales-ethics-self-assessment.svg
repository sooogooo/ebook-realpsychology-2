  </text>
  <text x="615" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    1. 定期进行自评
  </text>
  <text x="615" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
