  </text>
  <text x="310" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    销售伦理水平一般
  </text>
  <text x="310" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    需要改进
  </text>
  <text x="310" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#E65100">
    较差 (12-23分)
  </text>
  <text x="310" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
