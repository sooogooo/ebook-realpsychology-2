  </text>
  <text x="170" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    社会压力控制: ___
  </text>
  <text x="170" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    建议客观性: ___
  </text>
  <text x="170" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    利益冲突披露: ___
  </text>
  <text x="170" y="529" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    长期利益考量: ___
  </text>
  <text x="170" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    专业资质真实: ___
  </text>
  <text x="170" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    技术局限说明: ___
  </text>
  <text x="170" y="568" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    案例真实性: ___
  </text>
  <text x="170" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#E65100">
