  </text>
  <text x="615" y="477" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    3. 与团队成员分享
  </text>
  <text x="615" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
