  </text>
  <text x="450" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    是改进重点
  </text>
  <text x="450" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
