<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#FAF7F0"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    医美消费伦理框架
  </text>
  
  <!-- 伦理框架核心 -->
  <rect x="200" y="100" width="400" height="400" fill="#F8F8F8" stroke="#D4A574" stroke-width="3" rx="20"/>
  
  <!-- 四个伦理原则 -->
  <!-- 尊重自主原则 -->
  <rect x="230" y="130" width="150" height="120" fill="#E8F5E8" stroke="#81C784" stroke-width="2" rx="10"/>
  <text x="305" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">
    尊重自主
  </text>
  <text x="305" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 知情同意
  </text>
  <text x="305" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 选择自由
  </text>
  <text x="305" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 隐私保护
  </text>
  <text x="305" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 文化敏感
  </text>
  <text x="305" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 价值观尊重
  </text>
  
  <!-- 不伤害原则 -->
  <rect x="420" y="130" width="150" height="120" fill="#FFCDD2" stroke="#E57373" stroke-width="2" rx="10"/>
  <text x="495" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C62828">
    不伤害
  </text>
  <text x="495" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 身体安全
  </text>
  <text x="495" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 心理健康
  </text>
  <text x="495" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 风险最小化
  </text>
  <text x="495" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 并发症预防
  </text>
  <text x="495" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 长期影响
  </text>
  
  <!-- 行善原则 -->
  <rect x="230" y="280" width="150" height="120" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="2" rx="10"/>
  <text x="305" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0277BD">
    行善
  </text>
  <text x="305" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 最佳利益
  </text>
  <text x="305" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 效果最大化
  </text>
  <text x="305" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 质量保证
  </text>
  <text x="305" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 专业服务
  </text>
  <text x="305" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 持续关怀
  </text>
  
  <!-- 公正原则 -->
  <rect x="420" y="280" width="150" height="120" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" rx="10"/>
  <text x="495" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100">
    公正
  </text>
  <text x="495" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 资源分配
  </text>
  <text x="495" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 价格公平
  </text>
  <text x="495" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 机会均等
  </text>
  <text x="495" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 歧视避免
  </text>
  <text x="495" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 弱势保护
  </text>
  
  <!-- 中心交叉点 -->
  <circle cx="400" cy="270" r="30" fill="#E8D5C4" stroke="#D4A574" stroke-width="2"/>
  <text x="400" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8B4513">
    伦理
  </text>
  <text x="400" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8B4513">
    平衡
  </text>
  
  <!-- 连接线 -->
  <line x1="360" y1="250" x2="380" y2="260" stroke="#D4A574" stroke-width="1"/>
  <line x1="440" y1="250" x2="420" y2="260" stroke="#D4A574" stroke-width="1"/>
  <line x1="360" y1="290" x2="380" y2="280" stroke="#D4A574" stroke-width="1"/>
  <line x1="440" y1="290" x2="420" y2="280" stroke="#D4A574" stroke-width="1"/>
  
  <!-- 实践指导 -->
  <rect x="50" y="200" width="120" height="100" fill="#F3E5F5" stroke="#CE93D8" stroke-width="2" rx="10"/>
  <text x="110" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6A1B9A">
    实践指导
  </text>
  <text x="110" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6A1B9A">
    • 专业标准
  </text>
  <text x="110" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6A1B9A">
    • 伦理审查
  </text>
  <text x="110" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6A1B9A">
    • 监督机制
  </text>
  <text x="110" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6A1B9A">
    • 纠纷处理
  </text>
  
  <!-- 伦理挑战 -->
  <rect x="630" y="200" width="120" height="100" fill="#FFEBEE" stroke="#F44336" stroke-width="2" rx="10"/>
  <text x="690" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C62828">
    伦理挑战
  </text>
  <text x="690" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 利益冲突
  </text>
  <text x="690" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 信息不对称
  </text>
  <text x="690" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 期望管理
  </text>
  <text x="690" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 文化差异
  </text>
  
  <!-- 底部说明 -->
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    图1.10：医美消费的伦理框架及四大核心原则
  </text>
</svg>