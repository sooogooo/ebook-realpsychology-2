  </text>
  
  <!-- 时间点1-4 -->
  <rect x="100" y="200" width="140" height="50" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="170" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0277BD">
