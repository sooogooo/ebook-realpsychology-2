  </text>
  <text x="150" y="544" text-anchor="start" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    社会认同
  </text>
  <text x="150" y="557" text-anchor="start" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    整体满意度
  </text>
  
  <!-- 虚线表格分隔 -->
  <line x1="230" y1="480" x2="230" y2="525" stroke="#FFB74D" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="290" y1="480" x2="290" y2="525" stroke="#FFB74D" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="370" y1="480" x2="370" y2="525" stroke="#FFB74D" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="450" y1="480" x2="450" y2="525" stroke="#FFB74D" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="530" y1="480" x2="530" y2="525" stroke="#FFB74D" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- 分析功能 -->
  <rect x="100" y="560" width="600" height="25" fill="#C8E6C9" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="400" y="577" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2E7D32">
