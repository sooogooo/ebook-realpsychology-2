<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#FAF7F0"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    医美技术发展心理影响机制
  </text>
  
  <!-- 技术发展趋势 -->
  <rect x="100" y="80" width="600" height="80" fill="#E8F5E8" stroke="#81C784" stroke-width="2" rx="10"/>
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">
    医美技术四大发展趋势
  </text>
  <text x="400" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2E7D32">
    微创化 | 精准化 | 数字化 | 个性化
  </text>
  <text x="400" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    从开放手术到无创治疗，从标准化到定制化，技术革新改变着医美的物理特性和心理认知
  </text>
  
  <!-- 心理影响机制 -->
  <rect x="50" y="180" width="700" height="320" fill="#F3E5F5" stroke="#CE93D8" stroke-width="3" rx="15"/>
  <text x="400" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#6A1B9A">
    技术发展的三维心理影响机制
  </text>
  
  <!-- 认知层面影响 -->
  <rect x="80" y="230" width="200" height="120" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2" rx="10"/>
  <text x="180" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    认知层面影响
  </text>
  <text x="180" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6A1B9A">
    信息处理模式转变
  </text>
  <text x="180" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 从被动接受到主动寻求
  </text>
  <text x="180" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 信息素养要求提高
  </text>
  <text x="180" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 风险感知模式变化
  </text>
  <text x="180" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 安全性提高 vs 不确定性增加
  </text>
  <text x="180" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#6A1B9A">
    批判思维需求增强
  </text>
  
  <!-- 情感层面影响 -->
  <rect x="300" y="230" width="200" height="120" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2" rx="10"/>
  <text x="400" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    情感层面影响
  </text>
  <text x="400" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6A1B9A">
    外貌焦虑与身体意象变化
  </text>
  <text x="400" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 可及性提高可能加剧焦虑
  </text>
  <text x="400" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 普及化可能降低焦虑强度
  </text>
  <text x="400" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 期望管理挑战增加
  </text>
  <text x="400" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 可视化体验影响期望
  </text>
  <text x="400" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#6A1B9A">
    情感调节能力要求
  </text>
  
  <!-- 行为层面影响 -->
  <rect x="520" y="230" width="200" height="120" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2" rx="10"/>
  <text x="620" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    行为层面影响
  </text>
  <text x="620" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6A1B9A">
    消费模式与频率变化
  </text>
  <text x="620" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 从重大决策到日常消费
  </text>
  <text x="620" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 消费频率显著增加
  </text>
  <text x="620" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 消费金额结构变化
  </text>
  <text x="620" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 财务管理挑战增加
  </text>
  <text x="620" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#6A1B9A">
    行为适应能力需求
  </text>
  
  <!-- 技术接受过程 -->
  <rect x="80" y="370" width="640" height="110" fill="#E1F5FE" stroke="#4FC3F7" stroke-width="2" rx="10"/>
  <text x="400" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0277BD">
    技术接受四阶段心理过程
  </text>
  
  <!-- 四个阶段 -->
  <rect x="110" y="410" width="120" height="60" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="170" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0277BD">
    认知阶段
  </text>
  <text x="170" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    了解新技术信息
  </text>
  <text x="170" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    形成初步认知态度
  </text>
  <text x="170" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    信息可获得性影响
  </text>
  
  <rect x="250" y="410" width="120" height="60" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="310" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0277BD">
    评估阶段
  </text>
  <text x="310" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    权衡利弊得失
  </text>
  <text x="310" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    评估适用性和价值
  </text>
  <text x="310" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    风险承受能力影响
  </text>
  
  <rect x="390" y="410" width="120" height="60" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="450" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0277BD">
    尝试阶段
  </text>
  <text x="450" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    初步实践体验
  </text>
  <text x="450" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    效果和过程体验
  </text>
  <text x="450" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    体验影响接受程度
  </text>
  
  <rect x="530" y="410" width="120" height="60" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="590" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0277BD">
    整合阶段
  </text>
  <text x="590" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    融入日常生活
  </text>
  <text x="590" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    影响自我认同
  </text>
  <text x="590" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    心理社会适应过程
  </text>
  
  <rect x="670" y="410" width="50" height="60" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="695" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0277BD">
    影响
  </text>
  <text x="695" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    信息来源
  </text>
  <text x="695" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    个人需求
  </text>
  <text x="695" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    经济条件
  </text>
  
  <!-- 适应挑战 -->
  <rect x="100" y="500" width="600" height="80" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" rx="10"/>
  <text x="400" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E65100">
    技术发展的五大适应挑战
  </text>
  
  <!-- 五大挑战 -->
  <rect x="130" y="535" width="100" height="35" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="180" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100">
    信息过载
  </text>
  <text x="180" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    海量信息处理困难
  </text>
  
  <rect x="250" y="535" width="100" height="35" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="300" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100">
    决策疲劳
  </text>
  <text x="300" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    持续认知努力负担
  </text>
  
  <rect x="370" y="535" width="100" height="35" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="420" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100">
    期望管理
  </text>
  <text x="420" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    宣传与现实的差距
  </text>
  
  <rect x="490" y="535" width="100" height="35" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="540" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100">
    身份认同
  </text>
  <text x="540" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    自然衰老接受度
  </text>
  
  <rect x="610" y="535" width="80" height="35" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="650" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100">
    消费控制
  </text>
  <text x="650" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    频率与金额管理
  </text>
  
  <!-- 底部说明 -->
  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    图8.1：医美技术发展趋势、心理影响机制及适应挑战分析框架
  </text>
</svg>