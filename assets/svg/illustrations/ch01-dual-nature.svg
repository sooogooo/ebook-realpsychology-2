<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#FAF7F0"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    医美消费的双重性特征
  </text>
  
  <!-- 中央分割线 -->
  <line x1="400" y1="80" x2="400" y2="520" stroke="#D4A574" stroke-width="3"/>
  
  <!-- 左侧：医疗属性 -->
  <rect x="50" y="100" width="300" height="400" fill="#E8F5E8" stroke="#81C784" stroke-width="2" rx="10"/>
  <text x="200" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2E7D32">
    医疗属性
  </text>
  
  <!-- 医疗属性特征 -->
  <circle cx="120" cy="180" r="8" fill="#4CAF50"/>
  <text x="140" y="185" font-family="Arial, sans-serif" font-size="14" fill="#2E7D32">
    专业医学知识
  </text>
  
  <circle cx="120" cy="220" r="8" fill="#4CAF50"/>
  <text x="140" y="225" font-family="Arial, sans-serif" font-size="14" fill="#2E7D32">
    生理结构干预
  </text>
  
  <circle cx="120" cy="260" r="8" fill="#4CAF50"/>
  <text x="140" y="265" font-family="Arial, sans-serif" font-size="14" fill="#2E7D32">
    健康风险评估
  </text>
  
  <circle cx="120" cy="300" r="8" fill="#4CAF50"/>
  <text x="140" y="305" font-family="Arial, sans-serif" font-size="14" fill="#2E7D32">
    医疗规范监管
  </text>
  
  <circle cx="120" cy="340" r="8" fill="#4CAF50"/>
  <text x="140" y="345" font-family="Arial, sans-serif" font-size="14" fill="#2E7D32">
    专业伦理要求
  </text>
  
  <!-- 医疗属性图标 -->
  <rect x="80" y="380" width="240" height="80" fill="#C8E6C9" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="200" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">
    🏥 医疗特征
  </text>
  <text x="200" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2E7D32">
    安全性优先
  </text>
  <text x="200" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2E7D32">
    专业性保障
  </text>
  
  <!-- 右侧：美容属性 -->
  <rect x="450" y="100" width="300" height="400" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" rx="10"/>
  <text x="600" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#E65100">
    美容属性
  </text>
  
  <!-- 美容属性特征 -->
  <circle cx="520" cy="180" r="8" fill="#FF9800"/>
  <text x="540" y="185" font-family="Arial, sans-serif" font-size="14" fill="#E65100">
    外貌改善需求
  </text>
  
  <circle cx="520" cy="220" r="8" fill="#FF9800"/>
  <text x="540" y="225" font-family="Arial, sans-serif" font-size="14" fill="#E65100">
    审美标准影响
  </text>
  
  <circle cx="520" cy="260" r="8" fill="#FF9800"/>
  <text x="540" y="265" font-family="Arial, sans-serif" font-size="14" fill="#E65100">
    社会认同追求
  </text>
  
  <circle cx="520" cy="300" r="8" fill="#FF9800"/>
  <text x="540" y="305" font-family="Arial, sans-serif" font-size="14" fill="#E65100">
    时尚潮流驱动
  </text>
  
  <circle cx="520" cy="340" r="8" fill="#FF9800"/>
  <text x="540" y="345" font-family="Arial, sans-serif" font-size="14" fill="#E65100">
    心理满足需求
  </text>
  
  <!-- 美容属性图标 -->
  <rect x="480" y="380" width="240" height="80" fill="#FFE0B2" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="600" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E65100">
    💄 美容特征
  </text>
  <text x="600" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E65100">
    美观性优先
  </text>
  <text x="600" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E65100">
    个性化表达
  </text>
  
  <!-- 中央交汇区域 -->
  <ellipse cx="400" cy="300" rx="60" ry="40" fill="#F8E8D8" stroke="#D4A574" stroke-width="2"/>
  <text x="400" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8B4513">
    双重性
  </text>
  <text x="400" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8B4513">
    复杂决策
  </text>
  
  <!-- 底部说明 -->
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    图1.2：医美消费的双重性特征及其影响
  </text>
</svg>