<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#FAF7F0"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    医美消费风险感知与评估机制
  </text>
  
  <!-- 四种风险类型框架 -->
  <rect x="50" y="80" width="700" height="200" fill="#FFEBEE" stroke="#E57373" stroke-width="3" rx="15"/>
  <text x="400" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#C62828">
    医美消费四大风险类型
  </text>
  
  <!-- 生理风险 -->
  <rect x="80" y="130" width="150" height="130" fill="#FFCDD2" stroke="#E57373" stroke-width="2" rx="10"/>
  <text x="155" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C62828">
    生理风险
  </text>
  <text x="155" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 手术并发症
  </text>
  <text x="155" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 感染疤痕
  </text>
  <text x="155" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 效果不理想
  </text>
  <text x="155" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 过敏反应
  </text>
  <text x="155" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#C62828">
    40%过度担忧
  </text>
  <text x="155" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#C62828">
    30%认识不足
  </text>
  
  <!-- 心理风险 -->
  <rect x="250" y="130" width="150" height="130" fill="#FFCDD2" stroke="#E57373" stroke-width="2" rx="10"/>
  <text x="325" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C62828">
    心理风险
  </text>
  <text x="325" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 术后后悔
  </text>
  <text x="325" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 焦虑抑郁
  </text>
  <text x="325" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 自我认同问题
  </text>
  <text x="325" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 期望不匹配
  </text>
  <text x="325" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#C62828">
    25%消费者经历
  </text>
  <text x="325" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#C62828">
    内在动机风险低
  </text>
  
  <!-- 财务风险 -->
  <rect x="420" y="130" width="150" height="130" fill="#FFCDD2" stroke="#E57373" stroke-width="2" rx="10"/>
  <text x="495" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C62828">
    财务风险
  </text>
  <text x="495" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 高昂费用
  </text>
  <text x="495" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 后续维护成本
  </text>
  <text x="495" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 修复费用
  </text>
  <text x="495" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 经济压力
  </text>
  <text x="495" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#C62828">
    35%面临压力
  </text>
  <text x="495" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#C62828">
    收入负相关
  </text>
  
  <!-- 社会风险 -->
  <rect x="590" y="130" width="150" height="130" fill="#FFCDD2" stroke="#E57373" stroke-width="2" rx="10"/>
  <text x="665" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C62828">
    社会风险
  </text>
  <text x="665" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 他人评价
  </text>
  <text x="665" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 社会认同
  </text>
  <text x="665" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 关系变化
  </text>
  <text x="665" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 文化差异
  </text>
  <text x="665" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#C62828">
    20%经历问题
  </text>
  <text x="665" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#C62828">
    亚洲感知更高
  </text>
  
  <!-- 风险评估偏差 -->
  <rect x="80" y="300" width="640" height="120" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" rx="10"/>
  <text x="400" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E65100">
    常见风险评估偏差
  </text>
  
  <!-- 三种偏差 -->
  <rect x="110" y="340" width="180" height="65" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="200" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E65100">
    乐观偏见
  </text>
  <text x="200" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    75%消费者存在
  </text>
  <text x="200" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    低估风险概率
  </text>
  <text x="200" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    高估效果实现
  </text>
  
  <rect x="310" y="340" width="180" height="65" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="400" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E65100">
    控制错觉
  </text>
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    65%消费者存在
  </text>
  <text x="400" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    高估控制能力
  </text>
  <text x="400" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    仔细选择=完全避免
  </text>
  
  <rect x="510" y="340" width="180" height="65" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="600" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E65100">
    情感影响偏差
  </text>
  <text x="600" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    情绪状态影响
  </text>
  <text x="600" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    焦虑兴奋时降低
  </text>
  <text x="600" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    非理性决策增加
  </text>
  
  <!-- 风险沟通框架 -->
  <rect x="80" y="440" width="640" height="120" fill="#E1F5FE" stroke="#4FC3F7" stroke-width="2" rx="10"/>
  <text x="400" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0277BD">
    风险沟通四环节框架
  </text>
  
  <!-- 四个环节 -->
  <rect x="110" y="480" width="130" height="65" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="175" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0277BD">
    风险识别
  </text>
  <text x="175" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277BD">
    全面了解风险
  </text>
  <text x="175" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277BD">
    类型与可能性
  </text>
  <text x="175" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277BD">
    建立风险意识
  </text>
  
  <rect x="260" y="480" width="130" height="65" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="325" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0277BD">
    风险评估
  </text>
  <text x="325" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277BD">
    概率影响评估
  </text>
  <text x="325" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277BD">
    个人承受能力
  </text>
  <text x="325" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277BD">
    客观理性分析
  </text>
  
  <rect x="410" y="480" width="130" height="65" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="475" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0277BD">
    风险管理
  </text>
  <text x="475" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277BD">
    制定应对策略
  </text>
  <text x="475" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277BD">
    预防措施准备
  </text>
  <text x="475" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277BD">
    应急方案制定
  </text>
  
  <rect x="560" y="480" width="130" height="65" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="625" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0277BD">
    风险监控
  </text>
  <text x="625" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277BD">
    持续监测风险
  </text>
  <text x="625" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277BD">
    及时发现问题
  </text>
  <text x="625" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277BD">
    快速处理应对
  </text>
  
  <!-- 流程箭头 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <path d="M 240 512 L 260 512" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 390 512 L 410 512" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 540 512 L 560 512" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 底部说明 -->
  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    图4.2：医美消费风险类型、评估偏差及系统化沟通管理框架
  </text>
</svg>