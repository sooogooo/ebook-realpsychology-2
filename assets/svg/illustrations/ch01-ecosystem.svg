<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#FAF7F0"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    多方共赢的医美生态系统
  </text>
  
  <!-- 生态系统核心 -->
  <ellipse cx="400" cy="300" rx="120" ry="80" fill="#E8D5C4" stroke="#D4A574" stroke-width="3"/>
  <text x="400" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B4513">
    多方共赢
  </text>
  <text x="400" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8B4513">
    生态系统
  </text>
  
  <!-- 四个关键要素 -->
  <!-- 透明信息环境 -->
  <rect x="80" y="120" width="160" height="100" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="2" rx="10"/>
  <text x="160" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0277BD">
    透明信息环境
  </text>
  <text x="160" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 标准化披露
  </text>
  <text x="160" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 第三方评价
  </text>
  <text x="160" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 消费者教育
  </text>
  <text x="160" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 信息共享平台
  </text>
  
  <!-- 合理利益分配 -->
  <rect x="560" y="120" width="160" height="100" fill="#C8E6C9" stroke="#81C784" stroke-width="2" rx="10"/>
  <text x="640" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">
    合理利益分配
  </text>
  <text x="640" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 公平价格机制
  </text>
  <text x="640" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 科学薪酬体系
  </text>
  <text x="640" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 长期回报机制
  </text>
  <text x="640" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 社会责任机制
  </text>
  
  <!-- 质量监管体系 -->
  <rect x="80" y="380" width="160" height="100" fill="#FFCDD2" stroke="#E57373" stroke-width="2" rx="10"/>
  <text x="160" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C62828">
    质量监管体系
  </text>
  <text x="160" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 法律法规完善
  </text>
  <text x="160" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 行业自律规范
  </text>
  <text x="160" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 机构内部管理
  </text>
  <text x="160" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 社会监督机制
  </text>
  
  <!-- 持续创新机制 -->
  <rect x="560" y="380" width="160" height="100" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" rx="10"/>
  <text x="640" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100">
    持续创新机制
  </text>
  <text x="640" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 研发投入支持
  </text>
  <text x="640" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 人才培养机制
  </text>
  <text x="640" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 知识共享平台
  </text>
  <text x="640" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 试错容错机制
  </text>
  
  <!-- 连接线 -->
  <line x1="240" y1="170" x2="280" y2="250" stroke="#D4A574" stroke-width="2"/>
  <line x1="560" y1="170" x2="520" y2="250" stroke="#D4A574" stroke-width="2"/>
  <line x1="240" y1="430" x2="280" y2="350" stroke="#D4A574" stroke-width="2"/>
  <line x1="560" y1="430" x2="520" y2="350" stroke="#D4A574" stroke-width="2"/>
  
  <!-- 利益相关者 -->
  <circle cx="400" cy="150" r="30" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2"/>
  <text x="400" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    消费者
  </text>
  
  <circle cx="400" cy="450" r="30" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2"/>
  <text x="400" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    医生
  </text>
  
  <circle cx="300" cy="300" r="30" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2"/>
  <text x="300" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    销售人员
  </text>
  
  <circle cx="500" cy="300" r="30" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2"/>
  <text x="500" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    投资者
  </text>
  
  <!-- 内部连接线 -->
  <line x1="400" y1="180" x2="400" y2="220" stroke="#BA68C8" stroke-width="1"/>
  <line x1="400" y1="380" x2="400" y2="420" stroke="#BA68C8" stroke-width="1"/>
  <line x1="330" y1="300" x2="280" y2="300" stroke="#BA68C8" stroke-width="1"/>
  <line x1="470" y1="300" x2="520" y2="300" stroke="#BA68C8" stroke-width="1"/>
  
  <!-- 实施效果 -->
  <rect x="280" y="520" width="240" height="50" fill="#F3E5F5" stroke="#CE93D8" stroke-width="2" rx="10"/>
  <text x="400" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6A1B9A">
    实施效果
  </text>
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6A1B9A">
    健康发展 • 共同利益 • 可持续增长
  </text>
  
  <!-- 底部说明 -->
  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    图1.6：多方共赢的医美生态系统构建框架
  </text>
</svg>