<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#FAF7F0"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    医美消费的未来发展趋势
  </text>
  
  <!-- 时间轴 -->
  <line x1="100" y1="500" x2="700" y2="500" stroke="#D4A574" stroke-width="3"/>
  
  <!-- 时间节点 -->
  <circle cx="200" cy="500" r="8" fill="#4CAF50"/>
  <text x="200" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2E7D32">2025</text>
  
  <circle cx="350" cy="500" r="8" fill="#2196F3"/>
  <text x="350" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1976D2">2030</text>
  
  <circle cx="500" cy="500" r="8" fill="#FF9800"/>
  <text x="500" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E65100">2035</text>
  
  <circle cx="650" cy="500" r="8" fill="#9C27B0"/>
  <text x="650" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6A1B9A">2040</text>
  
  <!-- 发展趋势图 -->
  <!-- 技术发展趋势 -->
  <rect x="100" y="100" width="600" height="120" fill="#E8F5E8" stroke="#81C784" stroke-width="2" rx="10"/>
  <text x="400" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">
    技术发展趋势
  </text>
  
  <!-- 技术节点 -->
  <circle cx="200" cy="160" r="15" fill="#4CAF50"/>
  <text x="200" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">AI辅助</text>
  
  <circle cx="350" cy="160" r="15" fill="#2196F3"/>
  <text x="350" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">精准医疗</text>
  
  <circle cx="500" cy="160" r="15" fill="#FF9800"/>
  <text x="500" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">生物技术</text>
  
  <circle cx="650" cy="160" r="15" fill="#9C27B0"/>
  <text x="650" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">智能集成</text>
  
  <!-- 连接线 -->
  <line x1="215" y1="160" x2="335" y2="160" stroke="#4CAF50" stroke-width="2"/>
  <line x1="365" y1="160" x2="485" y2="160" stroke="#2196F3" stroke-width="2"/>
  <line x1="515" y1="160" x2="635" y2="160" stroke="#FF9800" stroke-width="2"/>
  
  <!-- 消费趋势 -->
  <rect x="100" y="250" width="600" height="120" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" rx="10"/>
  <text x="400" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E65100">
    消费趋势
  </text>
  
  <!-- 消费节点 -->
  <circle cx="200" cy="310" r="15" fill="#FF5722"/>
  <text x="200" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">个性化</text>
  
  <circle cx="350" cy="310" r="15" fill="#FF9800"/>
  <text x="350" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">男性化</text>
  
  <circle cx="500" cy="310" r="15" fill="#FFC107"/>
  <text x="500" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">年轻化</text>
  
  <circle cx="650" cy="310" r="15" fill="#FFEB3B"/>
  <text x="650" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">普惠化</text>
  
  <!-- 连接线 -->
  <line x1="215" y1="310" x2="335" y2="310" stroke="#FF5722" stroke-width="2"/>
  <line x1="365" y1="310" x2="485" y2="310" stroke="#FF9800" stroke-width="2"/>
  <line x1="515" y1="310" x2="635" y2="310" stroke="#FFC107" stroke-width="2"/>
  
  <!-- 监管趋势 -->
  <rect x="100" y="400" width="600" height="80" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2" rx="10"/>
  <text x="400" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#6A1B9A">
    监管趋势
  </text>
  
  <!-- 监管发展 -->
  <rect x="150" y="440" width="100" height="30" fill="#CE93D8" stroke="#9C27B0" stroke-width="1" rx="5"/>
  <text x="200" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4A148C">标准化</text>
  
  <rect x="300" y="440" width="100" height="30" fill="#CE93D8" stroke="#9C27B0" stroke-width="1" rx="5"/>
  <text x="350" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4A148C">智能化</text>
  
  <rect x="450" y="440" width="100" height="30" fill="#CE93D8" stroke="#9C27B0" stroke-width="1" rx="5"/>
  <text x="500" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4A148C">全球化</text>
  
  <rect x="600" y="440" width="100" height="30" fill="#CE93D8" stroke="#9C27B0" stroke-width="1" rx="5"/>
  <text x="650" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4A148C">伦理化</text>
  
  <!-- 垂直连接线 -->
  <line x1="200" y1="220" x2="200" y2="250" stroke="#D4A574" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="350" y1="220" x2="350" y2="250" stroke="#D4A574" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="500" y1="220" x2="500" y2="250" stroke="#D4A574" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="650" y1="220" x2="650" y2="250" stroke="#D4A574" stroke-width="1" stroke-dasharray="5,5"/>
  
  <line x1="200" y1="370" x2="200" y2="400" stroke="#D4A574" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="350" y1="370" x2="350" y2="400" stroke="#D4A574" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="500" y1="370" x2="500" y2="400" stroke="#D4A574" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="650" y1="370" x2="650" y2="400" stroke="#D4A574" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- 侧边说明 -->
  <rect x="50" y="300" width="80" height="80" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1" rx="5"/>
  <text x="90" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    驱动因素
  </text>
  <text x="90" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6A1B9A">
    科技进步
  </text>
  <text x="90" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6A1B9A">
    需求变化
  </text>
  <text x="90" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6A1B9A">
    社会发展
  </text>
  
  <!-- 底部说明 -->
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    图1.11：医美消费的未来发展趋势及时间轴预测
  </text>
</svg>