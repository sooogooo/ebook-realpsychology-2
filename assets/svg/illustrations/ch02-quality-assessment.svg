<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#FAF7F0"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    医美研究质量评估流程
  </text>
  
  <!-- 流程开始 -->
  <rect x="325" y="80" width="150" height="40" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="2" rx="20"/>
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0277BD">
    开始评估
  </text>
  
  <!-- 箭头 -->
  <path d="M 400 120 L 400 140" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 基本信息收集 -->
  <rect x="275" y="140" width="250" height="60" fill="#FFCDD2" stroke="#E57373" stroke-width="2" rx="10"/>
  <text x="400" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C62828">
    基本信息收集
  </text>
  <text x="400" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    研究标题 • 作者/机构 • 发表时间 • 发表来源
  </text>
  <text x="400" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    资金来源 • 利益冲突披露
  </text>
  
  <!-- 箭头 -->
  <path d="M 400 200 L 400 220" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 研究设计评估 -->
  <rect x="200" y="220" width="400" height="100" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" rx="10"/>
  <text x="400" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100">
    研究设计评估 (每项1-5分)
  </text>
  
  <!-- 评估项目 -->
  <rect x="220" y="250" width="80" height="30" fill="#E8F5E8" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="260" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    问题明确性
  </text>
  
  <rect x="310" y="250" width="80" height="30" fill="#E8F5E8" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="350" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    方法适当性
  </text>
  
  <rect x="400" y="250" width="80" height="30" fill="#E8F5E8" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="440" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    样本代表性
  </text>
  
  <rect x="490" y="250" width="80" height="30" fill="#E8F5E8" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="530" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    数据可靠性
  </text>
  
  <rect x="220" y="285" width="80" height="30" fill="#E8F5E8" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="260" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    分析严谨性
  </text>
  
  <!-- 分数计算 -->
  <rect x="310" y="285" width="170" height="30" fill="#FFF8E1" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="395" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    研究设计总分：_______ (25分以上优秀)
  </text>
  
  <!-- 箭头 -->
  <path d="M 400 320 L 400 340" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 偏见风险评估 -->
  <rect x="200" y="340" width="400" height="80" fill="#F3E5F5" stroke="#CE93D8" stroke-width="2" rx="10"/>
  <text x="400" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6A1B9A">
    偏见风险评估 (每项1-5分，风险1=很高，5=很低)
  </text>
  
  <!-- 偏见类型 -->
  <rect x="220" y="370" width="90" height="30" fill="#FFEBEE" stroke="#F44336" stroke-width="1" rx="5"/>
  <text x="265" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    确认偏见
  </text>
  
  <rect x="320" y="370" width="90" height="30" fill="#FFEBEE" stroke="#F44336" stroke-width="1" rx="5"/>
  <text x="365" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    商业利益影响
  </text>
  
  <rect x="420" y="370" width="90" height="30" fill="#FFEBEE" stroke="#F44336" stroke-width="1" rx="5"/>
  <text x="465" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    样本偏见
  </text>
  
  <rect x="520" y="370" width="60" height="30" fill="#FFEBEE" stroke="#F44336" stroke-width="1" rx="5"/>
  <text x="550" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    测量偏见
  </text>
  
  <!-- 箭头 -->
  <path d="M 400 420 L 400 440" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 证据层级评估 -->
  <rect x="200" y="440" width="400" height="60" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2" rx="10"/>
  <text x="400" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6A1B9A">
    证据层级评估
  </text>
  <text x="400" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6A1B9A">
    系统综述→随机对照试验→队列研究→病例对照→横断面→病例报告→专家意见→个人经验
  </text>
  <text x="400" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6A1B9A">
    (高层级→低层级)
  </text>
  
  <!-- 箭头 -->
  <path d="M 400 500 L 400 520" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 综合评估结果 -->
  <rect x="225" y="520" width="350" height="40" fill="#C8E6C9" stroke="#81C784" stroke-width="2" rx="10"/>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">
    综合评估：□高质量 □中等质量 □低质量 □不可靠
  </text>
  
  <!-- 侧边说明 -->
  <rect x="50" y="250" width="120" height="120" fill="#FFF8E1" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="110" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E65100">
    实用价值评估
  </text>
  <text x="110" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • 内部效度
  </text>
  <text x="110" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • 外部效度
  </text>
  <text x="110" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • 临床意义
  </text>
  <text x="110" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • 创新性
  </text>
  <text x="110" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    (15分以上高价值)
  </text>
  
  <rect x="630" y="250" width="120" height="120" fill="#FFEBEE" stroke="#F44336" stroke-width="1" rx="5"/>
  <text x="690" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C62828">
    质量标准
  </text>
  <text x="690" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 科学性
  </text>
  <text x="690" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 客观性
  </text>
  <text x="690" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 可靠性
  </text>
  <text x="690" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 适用性
  </text>
  <text x="690" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 透明度
  </text>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- 底部说明 -->
  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    图2.4：医美研究质量评估流程及关键评估维度
  </text>
</svg>