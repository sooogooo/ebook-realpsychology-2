  </text>
  
  <rect x="600" y="200" width="60" height="65" fill="#E1BEE7" stroke="#BA68C8" stroke-width="1" rx="5"/>
  <text x="630" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#6A1B9A">
