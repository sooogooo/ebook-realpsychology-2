  </text>
  
  <rect x="310" y="475" width="160" height="55" fill="#C8E6C9" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="390" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">
