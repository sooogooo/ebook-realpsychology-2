  </text>
  <text x="710" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#C62828">
    □ 过度推销
  </text>
  <text x="710" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#C62828">
    □ 忽视需求
  </text>
  <text x="710" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#C62828">
    □ 不必要服务
  </text>
  <text x="710" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#C62828">
    □ 隐藏激励
  </text>
  
  <!-- 应对策略 -->
