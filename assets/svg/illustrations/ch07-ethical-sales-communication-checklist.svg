  <text x="400" y="577" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0277BD">
    使用建议：每次重要销售沟通前使用 | 定期反思改进 | 分享最佳实践 | 根据反馈优化技巧
  </text>
  
  <!-- 底部说明 -->
  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
