  <rect x="680" y="340" width="60" height="65" fill="#FFCDD2" stroke="#E57373" stroke-width="1" rx="5"/>
  <text x="710" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C62828">
