  </text>
  <text x="610" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#C62828">
    □ 利用情绪弱点
  </text>
  <text x="610" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#C62828">
    □ 阻碍第二意见
