  </text>
  
  <rect x="560" y="440" width="130" height="65" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1" rx="5"/>
  <text x="625" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#6A1B9A">
    术后长期
  </text>
  <text x="625" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6A1B9A">
