  </text>
  
  <!-- 流程箭头 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <path d="M 240 472 L 260 472" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 390 472 L 410 472" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 540 472 L 560 472" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 底部说明 -->
  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    图4.3：术后满意度多维度构成、关键影响因素及时间动态变化分析
  </text>
