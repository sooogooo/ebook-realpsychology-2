  </text>
  <text x="325" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    外向性满意度高
  </text>
  
  <rect x="410" y="300" width="130" height="65" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
