<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#FAF7F0"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    定量研究方法在医美心理学中的应用
  </text>
  
  <!-- 定量研究定义 -->
  <rect x="50" y="80" width="700" height="60" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="2" rx="10"/>
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0277BD">
    定量研究方法
  </text>
  <text x="400" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0277BD">
    通过数值化数据来描述和解释现象，强调客观性、可测量性和统计显著性
  </text>
  
  <!-- 主要方法网格 -->
  <!-- 问卷调查 -->
  <rect x="50" y="160" width="200" height="120" fill="#E1F5FE" stroke="#4FC3F7" stroke-width="2" rx="10"/>
  <text x="150" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0277BD">
    问卷调查
  </text>
  <text x="150" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 大规模数据收集
  </text>
  <text x="150" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 标准化测量工具
  </text>
  <text x="150" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 态度、认知、行为数据
  </text>
  <text x="150" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 便于统计分析
  </text>
  <text x="150" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 成本效益高
  </text>
  
  <!-- 实验研究 -->
  <rect x="300" y="160" width="200" height="120" fill="#E1F5FE" stroke="#4FC3F7" stroke-width="2" rx="10"/>
  <text x="400" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0277BD">
    实验研究
  </text>
  <text x="400" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 控制变量检验因果
  </text>
  <text x="400" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 随机分组
  </text>
  <text x="400" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 实验组vs对照组
  </text>
  <text x="400" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 干预效果评估
  </text>
  <text x="400" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 内部效度高
  </text>
  
  <!-- 统计分析 -->
  <rect x="550" y="160" width="200" height="120" fill="#E1F5FE" stroke="#4FC3F7" stroke-width="2" rx="10"/>
  <text x="650" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0277BD">
    统计分析
  </text>
  <text x="650" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 描述性统计
  </text>
  <text x="650" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 推论性统计
  </text>
  <text x="650" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 相关性分析
  </text>
  <text x="650" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 回归分析
  </text>
  <text x="650" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 假设检验
  </text>
  
  <!-- 数据收集流程 -->
  <rect x="100" y="300" width="600" height="80" fill="#E8F5E8" stroke="#81C784" stroke-width="2" rx="10"/>
  <text x="400" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">
    数据收集流程
  </text>
  <text x="400" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2E7D32">
    研究设计 → 样本选择 → 工具开发 → 数据收集 → 数据清理 → 统计分析 → 结果解释
  </text>
  <text x="400" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2E7D32">
    (每一步都需要严格的质量控制和伦理审查)
  </text>
  
  <!-- 在医美心理学中的应用 -->
  <rect x="50" y="400" width="700" height="100" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" rx="10"/>
  <text x="400" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E65100">
    在医美心理学中的应用实例
  </text>
  
  <!-- 应用实例 -->
  <rect x="80" y="440" width="150" height="50" fill="#FFF8E1" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="155" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E65100">
    消费者满意度调查
  </text>
  <text x="155" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    1000+样本，量化评估
  </text>
  <text x="155" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    动机、期望、满意度
  </text>
  
  <rect x="250" y="440" width="150" height="50" fill="#FFF8E1" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="325" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E65100">
    效果评估实验
  </text>
  <text x="325" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    随机对照设计
  </text>
  <text x="325" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    客观指标测量
  </text>
  
  <rect x="420" y="440" width="150" height="50" fill="#FFF8E1" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="495" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E65100">
    风险因素分析
  </text>
  <text x="495" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    大样本统计分析
  </text>
  <text x="495" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    预测模型构建
  </text>
  
  <rect x="590" y="440" width="150" height="50" fill="#FFF8E1" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="665" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E65100">
    市场趋势研究
  </text>
  <text x="665" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    时间序列分析
  </text>
  <text x="665" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    消费行为预测
  </text>
  
  <!-- 优势与局限 -->
  <rect x="150" y="520" width="200" height="60" fill="#F3E5F5" stroke="#CE93D8" stroke-width="2" rx="10"/>
  <text x="250" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6A1B9A">
    优势
  </text>
  <text x="250" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6A1B9A">
    客观性 • 可重复性 • 普遍性 • 统计验证
  </text>
  <text x="250" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6A1B9A">
    适合大规模研究
  </text>
  
  <rect x="450" y="520" width="200" height="60" fill="#FFEBEE" stroke="#F44336" stroke-width="2" rx="10"/>
  <text x="550" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C62828">
    局限
  </text>
  <text x="550" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    深度不足 • 情境缺失 • 机械化 • 成本较高
  </text>
  <text x="550" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    难以捕捉复杂性
  </text>
  
  <!-- 底部说明 -->
  <text x="400" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    图2.7：定量研究方法的主要类型、流程及在医美心理学中的应用
  </text>
</svg>