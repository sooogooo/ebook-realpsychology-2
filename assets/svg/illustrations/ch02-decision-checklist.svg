<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#FAF7F0"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    基于证据的决策检查流程
  </text>
  
  <!-- 决策前检查 -->
  <rect x="50" y="80" width="200" height="150" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="2" rx="10"/>
  <text x="150" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0277BD">
    决策前检查
  </text>
  
  <!-- 信息收集 -->
  <rect x="70" y="115" width="160" height="35" fill="#E1F5FE" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="150" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0277BD">
    信息收集
  </text>
  <text x="150" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277BD">
    □多种来源 □区分事实与观点 □多方观点 □时效性
  </text>
  
  <!-- 证据评估 -->
  <rect x="70" y="155" width="160" height="35" fill="#E1F5FE" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="150" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0277BD">
    证据评估
  </text>
  <text x="150" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277BD">
    □证据层级 □方法学质量 □利益冲突 □结果一致性
  </text>
  
  <!-- 风险收益分析 -->
  <rect x="70" y="195" width="160" height="35" fill="#E1F5FE" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="150" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0277BD">
    风险收益分析
  </text>
  <text x="150" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277BD">
    □收益评估 □风险评估 □长短影响 □替代方案
  </text>
  
  <!-- 决策中检查 -->
  <rect x="300" y="80" width="200" height="150" fill="#FFCDD2" stroke="#E57373" stroke-width="2" rx="10"/>
  <text x="400" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#C62828">
    决策中检查
  </text>
  
  <!-- 专业咨询 -->
  <rect x="320" y="115" width="160" height="35" fill="#FFEBEE" stroke="#E57373" stroke-width="1" rx="5"/>
  <text x="400" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C62828">
    专业咨询
  </text>
  <text x="400" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
    □专业人士 □第二意见 □资质确认 □客观性评估
  </text>
  
  <!-- 期望管理 -->
  <rect x="320" y="155" width="160" height="35" fill="#FFEBEE" stroke="#E57373" stroke-width="1" rx="5"/>
  <text x="400" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C62828">
    期望管理
  </text>
  <text x="400" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
    □合理期望 □了解副作用 □应对预案 □评估标准
  </text>
  
  <!-- 决策后检查 -->
  <rect x="550" y="80" width="200" height="150" fill="#C8E6C9" stroke="#81C784" stroke-width="2" rx="10"/>
  <text x="650" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">
    决策后检查
  </text>
  
  <!-- 结果评估 -->
  <rect x="570" y="115" width="160" height="35" fill="#E8F5E8" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="650" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">
    结果评估
  </text>
  <text x="650" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">
    □评估机制 □评估时间点 □主客观指标 □调整方案
  </text>
  
  <!-- 经验总结 -->
  <rect x="570" y="155" width="160" height="35" fill="#E8F5E8" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="650" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">
    经验总结
  </text>
  <text x="650" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">
    □决策记录 □经验教训 □经验分享 □知识更新
  </text>
  
  <!-- 流程箭头 -->
  <path d="M 250 155 L 300 155" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 500 155 L 550 155" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 应用对象说明 -->
  <rect x="50" y="280" width="700" height="120" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" rx="15"/>
  <text x="400" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E65100">
    不同利益相关者的应用重点
  </text>
  
  <!-- 消费者 -->
  <rect x="80" y="320" width="140" height="60" fill="#E1BEE7" stroke="#BA68C8" stroke-width="1" rx="5"/>
  <text x="150" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    消费者
  </text>
  <text x="150" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6A1B9A">
    • 决策前检查
  </text>
  <text x="150" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6A1B9A">
    • 风险收益分析
  </text>
  
  <!-- 医生 -->
  <rect x="240" y="320" width="140" height="60" fill="#E1BEE7" stroke="#BA68C8" stroke-width="1" rx="5"/>
  <text x="310" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    医生
  </text>
  <text x="310" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6A1B9A">
    • 专业建议
  </text>
  <text x="310" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6A1B9A">
    • 期望管理
  </text>
  
  <!-- 销售人员 -->
  <rect x="400" y="320" width="140" height="60" fill="#E1BEE7" stroke="#BA68C8" stroke-width="1" rx="5"/>
  <text x="470" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    销售人员
  </text>
  <text x="470" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6A1B9A">
    • 证据原则
  </text>
  <text x="470" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6A1B9A">
    • 避免过度承诺
  </text>
  
  <!-- 投资者 -->
  <rect x="560" y="320" width="140" height="60" fill="#E1BEE7" stroke="#BA68C8" stroke-width="1" rx="5"/>
  <text x="630" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    投资者
  </text>
  <text x="630" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6A1B9A">
    • 严格流程
  </text>
  <text x="630" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6A1B9A">
    • 风险评估
  </text>
  
  <!-- 核心原则 -->
  <rect x="150" y="440" width="500" height="50" fill="#F3E5F5" stroke="#CE93D8" stroke-width="2" rx="10"/>
  <text x="400" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6A1B9A">
    核心原则
  </text>
  <text x="400" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6A1B9A">
    科学性 • 客观性 • 全面性 • 时效性 • 适用性 • 持续改进
  </text>
  
  <!-- 价值体现 -->
  <rect x="200" y="510" width="400" height="40" fill="#E8F5E8" stroke="#81C784" stroke-width="2" rx="10"/>
  <text x="400" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">
    价值：提高决策质量 • 降低风险 • 增强信任 • 促进可持续发展
  </text>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- 底部说明 -->
  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    图2.5：基于证据的决策检查流程及不同利益相关者的应用重点
  </text>
</svg>