<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#FAF7F0"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    伦理销售实践指南
  </text>
  
  <!-- 核心要素 -->
  <rect x="100" y="80" width="600" height="60" fill="#E8F5E8" stroke="#81C784" stroke-width="2" rx="10"/>
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">
    伦理销售五大核心要素
  </text>
  <text x="400" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2E7D32">
    以消费者为中心 | 信息透明 | 尊重自主性 | 专业诚信 | 长期导向
  </text>
  
  <!-- 四个阶段实践 -->
  <rect x="50" y="160" width="700" height="320" fill="#F3E5F5" stroke="#CE93D8" stroke-width="3" rx="15"/>
  <text x="400" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#6A1B9A">
    伦理销售四阶段具体实践
  </text>
  
  <!-- 初次咨询阶段 -->
  <rect x="80" y="210" width="150" height="120" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2" rx="10"/>
  <text x="155" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    初次咨询阶段
  </text>
  <text x="155" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6A1B9A">
    建立信任基础
  </text>
  <text x="155" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 全面需求评估
  </text>
  <text x="155" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 提供基本信息
  </text>
  <text x="155" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 详细介绍项目
  </text>
  <text x="155" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 鼓励提问解答
  </text>
  <text x="155" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 不催促立即决定
  </text>
  
  <!-- 方案设计阶段 -->
  <rect x="250" y="210" width="150" height="120" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2" rx="10"/>
  <text x="325" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    方案设计阶段
  </text>
  <text x="325" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6A1B9A">
    个性化方案制定
  </text>
  <text x="325" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 基于具体情况设计
  </text>
  <text x="325" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 提供多种选择
  </text>
  <text x="325" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 说明优缺点
  </text>
  <text x="325" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 推荐最适合方案
  </text>
  <text x="325" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 明确局限性
  </text>
  
  <!-- 决策支持阶段 -->
  <rect x="420" y="210" width="150" height="120" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2" rx="10"/>
  <text x="495" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    决策支持阶段
  </text>
  <text x="495" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6A1B9A">
    无压力决策环境
  </text>
  <text x="495" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 给予充分时间
  </text>
  <text x="495" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 提供书面信息
  </text>
  <text x="495" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 鼓励第二意见
  </text>
  <text x="495" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 提供决策工具
  </text>
  <text x="495" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 尊重犹豫担忧
  </text>
  
  <!-- 术后服务阶段 -->
  <rect x="590" y="210" width="130" height="120" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2" rx="10"/>
  <text x="655" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    术后服务阶段
  </text>
  <text x="655" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6A1B9A">
    长期关系维护
  </text>
  <text x="655" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 完整术后指导
  </text>
  <text x="655" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 定期随访机制
  </text>
  <text x="655" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 处理问题并发症
  </text>
  <text x="655" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 不推销额外项目
  </text>
  <text x="655" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    • 关注长期满意度
  </text>
  
  <!-- 沟通技巧 -->
  <rect x="80" y="350" width="640" height="110" fill="#E1F5FE" stroke="#4FC3F7" stroke-width="2" rx="10"/>
  <text x="400" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0277BD">
    伦理销售沟通六大技巧
  </text>
  
  <!-- 六大技巧 -->
  <rect x="110" y="390" width="90" height="55" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="155" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0277BD">
    积极倾听
  </text>
  <text x="155" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    全神贯注听取
  </text>
  <text x="155" y="431" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    不急于推销
  </text>
  <text x="155" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    建立信任关系
  </text>
  
  <rect x="220" y="390" width="90" height="55" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="265" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0277BD">
    开放式提问
  </text>
  <text x="265" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    深入了解需求
  </text>
  <text x="265" y="431" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    获得丰富信息
  </text>
  <text x="265" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    避免是/否问题
  </text>
  
  <rect x="330" y="390" width="90" height="55" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="375" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0277BD">
    同理心表达
  </text>
  <text x="375" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    理解消费者感受
  </text>
  <text x="375" y="431" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    建立情感连接
  </text>
  <text x="375" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    减少防御心理
  </text>
  
  <rect x="440" y="390" width="90" height="55" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="485" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0277BD">
    清晰解释
  </text>
  <text x="485" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    简单易懂语言
  </text>
  <text x="485" y="431" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    避免专业术语
  </text>
  <text x="485" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    确保信息完整
  </text>
  
  <rect x="550" y="390" width="90" height="55" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="595" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0277BD">
    确认理解
  </text>
  <text x="595" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    定期确认理解
  </text>
  <text x="595" y="431" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    避免信息误解
  </text>
  <text x="595" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    鼓励继续提问
  </text>
  
  <rect x="660" y="390" width="60" height="55" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="690" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0277BD">
    耐心
  </text>
  <text x="690" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    充分时间考虑
  </text>
  <text x="690" y="431" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    不催促决定
  </text>
  <text x="690" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    尊重消费者节奏
  </text>
  
  <!-- 挑战应对 -->
  <rect x="100" y="480" width="600" height="90" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" rx="10"/>
  <text x="400" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E65100">
    常见挑战及应对策略
  </text>
  
  <!-- 四大挑战 -->
  <rect x="130" y="515" width="120" height="45" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="190" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#E65100">
    业绩压力冲突
  </text>
  <text x="190" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    长期关系纳入考核 | 强调长期价值
  </text>
  <text x="190" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    寻求管理层支持
  </text>
  
  <rect x="270" y="515" width="120" height="45" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="330" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#E65100">
    不切实际期望
  </text>
  <text x="330" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    温和管理期望 | 提供真实案例
  </text>
  <text x="330" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    解释技术局限性
  </text>
  
  <rect x="410" y="515" width="120" height="45" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="470" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#E65100">
    竞争环境坚持
  </text>
  <text x="470" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    强调差异化优势 | 建立信任品牌
  </text>
  <text x="470" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    加入伦理认证计划
  </text>
  
  <rect x="550" y="515" width="120" height="45" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="610" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#E65100">
    信息过载沟通
  </text>
  <text x="610" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    结构化信息呈现 | 视觉辅助工具
  </text>
  <text x="610" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    提供书面材料
  </text>
  
  <!-- 底部说明 -->
  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    图7.4：伦理销售实践指南、沟通技巧及挑战应对策略
  </text>
</svg>