<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#FAF7F0"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    技术适应能力评估量表
  </text>
  
  <!-- 工具说明 -->
  <rect x="100" y="80" width="600" height="60" fill="#E8F5E8" stroke="#81C784" stroke-width="2" rx="10"/>
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">
    实用工具8.1
  </text>
  <text x="400" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2E7D32">
    帮助消费者评估自己对医美新技术的适应能力，识别适应过程中的优势和不足，制定针对性的改进计划
  </text>
  
  <!-- 四个评估维度 -->
  <rect x="50" y="160" width="700" height="320" fill="#F3E5F5" stroke="#CE93D8" stroke-width="3" rx="15"/>
  <text x="400" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#6A1B9A">
    技术适应能力四大评估维度
  </text>
  
  <!-- 认知适应能力 -->
  <rect x="80" y="210" width="150" height="130" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2" rx="10"/>
  <text x="155" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    认知适应能力
  </text>
  <text x="155" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6A1B9A">
    (每项1-5分)
  </text>
  <text x="155" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    1. 信息筛选能力
  </text>
  <text x="155" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    2. 技术理解能力
  </text>
  <text x="155" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    3. 批判性思维
  </text>
  <text x="155" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    4. 学习能力
  </text>
  <text x="155" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#6A1B9A">
    小计: ___ 分
  </text>
  <text x="155" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    可靠信息识别、技术原理掌握
  </text>
  
  <!-- 情感适应能力 -->
  <rect x="250" y="210" width="150" height="130" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2" rx="10"/>
  <text x="325" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    情感适应能力
  </text>
  <text x="325" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6A1B9A">
    (每项1-5分)
  </text>
  <text x="325" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    5. 情绪识别能力
  </text>
  <text x="325" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    6. 情绪调节能力
  </text>
  <text x="325" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    7. 期望管理能力
  </text>
  <text x="325" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    8. 压力承受能力
  </text>
  <text x="325" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#6A1B9A">
    小计: ___ 分
  </text>
  <text x="325" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    焦虑管理、情绪稳定性
  </text>
  
  <!-- 行为适应能力 -->
  <rect x="420" y="210" width="150" height="130" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2" rx="10"/>
  <text x="495" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    行为适应能力
  </text>
  <text x="495" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6A1B9A">
    (每项1-5分)
  </text>
  <text x="495" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    9. 消费控制能力
  </text>
  <text x="495" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    10. 使用频率管理
  </text>
  <text x="495" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    11. 社交适应能力
  </text>
  <text x="495" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    12. 生活方式整合
  </text>
  <text x="495" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#6A1B9A">
    小计: ___ 分
  </text>
  <text x="495" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    消费行为控制、生活平衡
  </text>
  
  <!-- 社会支持能力 -->
  <rect x="590" y="210" width="130" height="130" fill="#E1BEE7" stroke="#BA68C8" stroke-width="2" rx="10"/>
  <text x="655" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    社会支持能力
  </text>
  <text x="655" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6A1B9A">
    (每项1-5分)
  </text>
  <text x="655" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    13. 专业支持寻求
  </text>
  <text x="655" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    14. 同伴支持建立
  </text>
  <text x="655" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    15. 家庭沟通能力
  </text>
  <text x="655" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    16. 社区参与度
  </text>
  <text x="655" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#6A1B9A">
    小计: ___ 分
  </text>
  <text x="655" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6A1B9A">
    支持网络构建、资源利用
  </text>
  
  <!-- 综合评估 -->
  <rect x="80" y="360" width="640" height="110" fill="#E1F5FE" stroke="#4FC3F7" stroke-width="2" rx="10"/>
  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0277BD">
    综合评估与适应等级
  </text>
  
  <!-- 评分汇总 -->
  <rect x="110" y="395" width="140" height="65" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="180" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0277BD">
    评分汇总
  </text>
  <text x="180" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    认知适应能力: ___
  </text>
  <text x="180" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    情感适应能力: ___
  </text>
  <text x="180" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    行为适应能力: ___
  </text>
  <text x="180" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    社会支持能力: ___
  </text>
  <text x="180" y="477" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0277BD">
    总分: ___ 分 (16-80分)
  </text>
  
  <!-- 适应等级 -->
  <rect x="270" y="395" width="140" height="65" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="340" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0277BD">
    适应等级
  </text>
  <text x="340" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0277BD">
    优秀 (64-80分)
  </text>
  <text x="340" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    技术适应能力很强
  </text>
  <text x="340" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0277BD">
    良好 (48-63分)
  </text>
  <text x="340" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    适应能力较好，有提升空间
  </text>
  <text x="340" y="477" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0277BD">
    一般 (32-47分)
  </text>
  <text x="340" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    适应能力一般，需要改进
  </text>
  <text x="340" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0277BD">
    较差 (16-31分)
  </text>
  <text x="340" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    适应能力较差，需要系统提升
  </text>
  
  <!-- 优势不足分析 -->
  <rect x="430" y="395" width="130" height="65" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="495" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0277BD">
    优势与不足
  </text>
  <text x="495" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    **优势领域**：
  </text>
  <text x="495" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    认知、情感、行为、社会支持
  </text>
  <text x="495" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    **需要改进领域**：
  </text>
  <text x="495" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    重点提升薄弱环节
  </text>
  <text x="495" y="477" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    均衡发展各项能力
  </text>
  
  <!-- 改进计划 -->
  <rect x="580" y="395" width="130" height="65" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="645" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0277BD">
    改进计划
  </text>
  <text x="645" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    **短期目标** (1-3个月)
  </text>
  <text x="645" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    重点提升1-2项能力
  </text>
  <text x="645" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    **中期目标** (3-6个月)
  </text>
  <text x="645" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    均衡发展各项能力
  </text>
  <text x="645" y="477" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    **长期目标** (6-12个月)
  </text>
  <text x="645" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    建立完整适应体系
  </text>
  
  <!-- 使用建议 -->
  <rect x="100" y="490" width="600" height="80" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" rx="10"/>
  <text x="400" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E65100">
    使用建议与预期效果
  </text>
  
  <!-- 使用建议 -->
  <rect x="130" y="525" width="180" height="35" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="220" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100">
    定期自评跟踪变化
  </text>
  <text x="220" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    建议3-6个月评估一次
  </text>
  
  <rect x="330" y="525" width="180" height="35" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="420" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100">
    针对性改进计划
  </text>
  <text x="420" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    根据评估结果制定方案
  </text>
  
  <rect x="530" y="525" width="150" height="35" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="605" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100">
    专业指导支持
  </text>
  <text x="605" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    寻求专业人士帮助
  </text>
  
  <!-- 底部说明 -->
  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    图8.6：技术适应能力评估量表结构、评估维度及使用指南
  </text>
</svg>