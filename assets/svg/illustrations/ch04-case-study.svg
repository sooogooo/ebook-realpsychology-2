  </text>
  
  <!-- 四个偏差表现 -->
  <rect x="130" y="375" width="120" height="55" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="190" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100">
