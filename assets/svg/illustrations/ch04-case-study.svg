<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#FAF7F0"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    案例分析4.1：信息过载与决策偏差
  </text>
  
  <!-- 案例背景 -->
  <rect x="100" y="80" width="600" height="60" fill="#E8F5E8" stroke="#81C784" stroke-width="2" rx="10"/>
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">
    案例背景
  </text>
  <text x="400" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2E7D32">
    张小姐，28岁，互联网公司产品经理，年收入30万元，考虑双眼皮手术半年，面临信息处理困境
  </text>
  
  <!-- 问题发展阶段 -->
  <rect x="50" y="160" width="700" height="160" fill="#FFEBEE" stroke="#E57373" stroke-width="2" rx="10"/>
  <text x="400" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#C62828">
    问题发展阶段
  </text>
  
  <!-- 初始信息获取 -->
  <rect x="80" y="200" width="130" height="105" fill="#FFCDD2" stroke="#E57373" stroke-width="1" rx="5"/>
  <text x="145" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C62828">
    初始信息获取
  </text>
  <text x="145" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
    • 朋友圈触发
  </text>
  <text x="145" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
    • 社交媒体搜索
  </text>
  <text x="145" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
    • 随机偶然性
  </text>
  <text x="145" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
    • 缺乏系统性
  </text>
  <text x="145" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#C62828">
    同学成功案例触发
  </text>
  
  <!-- 信息过载困境 -->
  <rect x="230" y="200" width="130" height="105" fill="#FFCDD2" stroke="#E57373" stroke-width="1" rx="5"/>
  <text x="295" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C62828">
    信息过载困境
  </text>
  <text x="295" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
