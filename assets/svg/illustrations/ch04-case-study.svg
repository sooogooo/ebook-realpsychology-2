  </text>
  <text x="610" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    高估效果实现
  </text>
  <text x="610" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    风险准备不足
  </text>
  
  <!-- 转折与解决 -->
  <rect x="100" y="460" width="600" height="100" fill="#E1F5FE" stroke="#4FC3F7" stroke-width="2" rx="10"/>
  <text x="400" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0277BD">
