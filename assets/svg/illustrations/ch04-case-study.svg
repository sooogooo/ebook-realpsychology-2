  </text>
  <text x="295" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
    • 质量参差不齐
  </text>
  <text x="295" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
    • 65%消费者困惑
  </text>
  <text x="295" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
    • 决策焦虑增加
  </text>
  <text x="295" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#C62828">
    越查越困惑状态
  </text>
  
  <!-- 质量识别困难 -->
  <rect x="380" y="200" width="130" height="105" fill="#FFCDD2" stroke="#E57373" stroke-width="1" rx="5"/>
  <text x="445" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C62828">
