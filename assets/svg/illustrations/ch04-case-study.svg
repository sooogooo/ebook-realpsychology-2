  <text x="330" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    难以调整印象
  </text>
  
  <rect x="410" y="375" width="120" height="55" fill="#FFECB3" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="470" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100">
    从众心理
  </text>
  <text x="470" y="403" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
