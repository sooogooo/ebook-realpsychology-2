  </text>
  
  <!-- 流程箭头 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <path d="M 210 252 L 230 252" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 360 252 L 380 252" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 510 252 L 530 252" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 具体偏差表现 -->
  <rect x="100" y="340" width="600" height="100" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" rx="10"/>
  <text x="400" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E65100">
