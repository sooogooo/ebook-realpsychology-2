  </text>
  <text x="195" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    详细解释风险
  </text>
  <text x="195" y="549" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    建立合理期望
  </text>
  
  <rect x="280" y="495" width="130" height="55" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="345" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0277BD">
    结构化工具
  </text>
  <text x="345" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    决策矩阵比较
  </text>
  <text x="345" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    系统分析因素
  </text>
  <text x="345" y="549" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    克服认知偏差
  </text>
  
  <rect x="430" y="495" width="130" height="55" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="495" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0277BD">
    社会支持重评
  </text>
  <text x="495" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    区分内外需求
  </text>
  <text x="495" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    建立内在动机
  </text>
  <text x="495" y="549" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
    理性决策基础
  </text>
  
  <rect x="580" y="495" width="120" height="55" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1" rx="5"/>
  <text x="640" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0277BD">
    最终决策
  </text>
  <text x="640" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0277BD">
