  </text>
  <text x="330" y="403" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    首家报价8000元
  </text>
  <text x="330" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
