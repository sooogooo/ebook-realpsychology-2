  </text>
  <text x="470" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
    担心被评判
  </text>
  <text x="470" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E65100">
