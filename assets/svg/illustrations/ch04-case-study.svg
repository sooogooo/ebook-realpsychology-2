  </text>
  <text x="445" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#C62828">
    依赖不可靠来源
  </text>
  
  <!-- 偏差形成 -->
  <rect x="530" y="200" width="130" height="105" fill="#FFCDD2" stroke="#E57373" stroke-width="1" rx="5"/>
  <text x="595" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C62828">
    偏差形成
  </text>
  <text x="595" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
