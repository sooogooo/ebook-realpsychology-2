<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#FAF7F0"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    医美研究证据层级金字塔
  </text>
  
  <!-- 金字塔层级 -->
  <!-- 第1层：系统综述/元分析 -->
  <polygon points="400,100 250,140 550,140" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="3"/>
  <text x="400" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0277BD">
    系统综述/元分析
  </text>
  <text x="400" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    (最高层级证据)
  </text>
  
  <!-- 第2层：随机对照试验 -->
  <polygon points="400,140 250,180 550,180" fill="#C8E6C9" stroke="#81C784" stroke-width="3"/>
  <text x="400" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">
    随机对照试验
  </text>
  <text x="400" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    (高质量证据)
  </text>
  
  <!-- 第3层：队列研究 -->
  <polygon points="400,180 250,220 550,220" fill="#FFF3E0" stroke="#FFB74D" stroke-width="3"/>
  <text x="400" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100">
    队列研究
  </text>
  <text x="400" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    (中等质量证据)
  </text>
  
  <!-- 第4层：病例对照研究 -->
  <polygon points="400,220 250,260 550,260" fill="#FFCDD2" stroke="#E57373" stroke-width="3"/>
  <text x="400" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C62828">
    病例对照研究
  </text>
  <text x="400" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    (中等质量证据)
  </text>
  
  <!-- 第5层：横断面研究 -->
  <polygon points="400,260 250,300 550,300" fill="#E1BEE7" stroke="#BA68C8" stroke-width="3"/>
  <text x="400" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6A1B9A">
    横断面研究
  </text>
  <text x="400" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6A1B9A">
    (低质量证据)
  </text>
  
  <!-- 第6层：病例报告 -->
  <polygon points="400,300 250,340 550,340" fill="#F3E5F5" stroke="#CE93D8" stroke-width="3"/>
  <text x="400" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6A1B9A">
    病例报告
  </text>
  <text x="400" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6A1B9A">
    (很低质量证据)
  </text>
  
  <!-- 第7层：专家意见 -->
  <polygon points="400,340 250,380 550,380" fill="#FFEBEE" stroke="#F44336" stroke-width="3"/>
  <text x="400" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C62828">
    专家意见
  </text>
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    (低质量证据)
  </text>
  
  <!-- 第8层：个人经验/观点 -->
  <polygon points="400,380 250,420 550,420" fill="#FFF8E1" stroke="#FFB74D" stroke-width="3"/>
  <text x="400" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100">
    个人经验/观点
  </text>
  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    (最低层级证据)
  </text>
  
  <!-- 左侧说明：证据特点 -->
  <rect x="50" y="180" width="150" height="200" fill="#F8F8F8" stroke="#D4A574" stroke-width="2" rx="10"/>
  <text x="125" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8B4513">
    证据特点
  </text>
  
  <text x="125" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    ↑ 高层级
  </text>
  <text x="125" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    • 科学性强
  </text>
  <text x="125" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    • 偏见控制好
  </text>
  <text x="125" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    • 推广性高
  </text>
  <text x="125" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    ↓ 低层级
  </text>
  <text x="125" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    • 科学性弱
  </text>
  <text x="125" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    • 偏见风险高
  </text>
  <text x="125" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    • 推广性低
  </text>
  
  <!-- 右侧说明：评估标准 -->
  <rect x="600" y="180" width="150" height="200" fill="#F8F8F8" stroke="#D4A574" stroke-width="2" rx="10"/>
  <text x="675" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8B4513">
    评估标准
  </text>
  
  <text x="675" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    • 研究设计质量
  </text>
  <text x="675" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    • 样本代表性
  </text>
  <text x="675" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    • 数据可靠性
  </text>
  <text x="675" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    • 统计方法
  </text>
  <text x="675" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    • 偏见控制
  </text>
  <text x="675" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    • 结果一致性
  </text>
  <text x="675" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    • 适用性
  </text>
  <text x="675" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    • 时效性
  </text>
  
  <!-- 底部应用说明 -->
  <rect x="100" y="440" width="600" height="100" fill="#E8F5E8" stroke="#81C784" stroke-width="2" rx="10"/>
  <text x="400" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">
    在医美决策中的应用
  </text>
  
  <!-- 应用建议 -->
  <rect x="130" y="480" width="120" height="50" fill="#C8E6C9" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="190" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">
    优先高层级证据
  </text>
  <text x="190" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">
    系统综述指导决策
  </text>
  <text x="190" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">
    随机对照验证效果
  </text>
  
  <rect x="270" y="480" width="120" height="50" fill="#C8E6C9" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="330" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">
    综合多重证据
  </text>
  <text x="330" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">
    多层级证据对比
  </text>
  <text x="330" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">
    寻找一致性结论
  </text>
  
  <rect x="410" y="480" width="120" height="50" fill="#C8E6C9" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="470" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">
    批判性评估
  </text>
  <text x="470" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">
    识别研究局限
  </text>
  <text x="470" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">
    评估适用条件
  </text>
  
  <rect x="550" y="480" width="120" height="50" fill="#C8E6C9" stroke="#81C784" stroke-width="1" rx="5"/>
  <text x="610" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">
    动态更新
  </text>
  <text x="610" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">
    跟踪最新研究
  </text>
  <text x="610" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">
    及时调整认知
  </text>
  
  <!-- 底部说明 -->
  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    图2.10：医美研究证据层级金字塔及评估应用标准
  </text>
</svg>