<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#FAF7F0"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    医美心理学研究的四维方法论体系
  </text>
  
  <!-- 中心连接点 -->
  <circle cx="400" cy="300" r="50" fill="#E8D5C4" stroke="#D4A574" stroke-width="3"/>
  <text x="400" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8B4513">
    医美心理
  </text>
  <text x="400" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8B4513">
    学研究
  </text>
  
  <!-- 定量研究方法 -->
  <rect x="50" y="100" width="200" height="120" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="2" rx="10"/>
  <text x="150" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0277BD">
    定量研究方法
  </text>
  <text x="150" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 问卷调查
  </text>
  <text x="150" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 实验研究
  </text>
  <text x="150" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 统计分析
  </text>
  <text x="150" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 数值化数据
  </text>
  <text x="150" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277BD">
    • 因果关系检验
  </text>
  
  <!-- 定性研究方法 -->
  <rect x="550" y="100" width="200" height="120" fill="#FFCDD2" stroke="#E57373" stroke-width="2" rx="10"/>
  <text x="650" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#C62828">
    定性研究方法
  </text>
  <text x="650" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 深度访谈
  </text>
  <text x="650" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 焦点小组
  </text>
  <text x="650" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 案例分析
  </text>
  <text x="650" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 深入描述
  </text>
  <text x="650" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">
    • 意义理解
  </text>
  
  <!-- 混合研究方法 -->
  <rect x="50" y="380" width="200" height="120" fill="#C8E6C9" stroke="#81C784" stroke-width="2" rx="10"/>
  <text x="150" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">
    混合研究方法
  </text>
  <text x="150" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 序列设计
  </text>
  <text x="150" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 并行设计
  </text>
  <text x="150" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 转换设计
  </text>
  <text x="150" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 优势互补
  </text>
  <text x="150" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    • 全面视角
  </text>
  
  <!-- 行动研究方法 -->
  <rect x="550" y="380" width="200" height="120" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" rx="10"/>
  <text x="650" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E65100">
    行动研究方法
  </text>
  <text x="650" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 参与式行动研究
  </text>
  <text x="650" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 实践者行动研究
  </text>
  <text x="650" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 组织行动研究
  </text>
  <text x="650" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 实践-反思-改进
  </text>
  <text x="650" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    • 问题解决导向
  </text>
  
  <!-- 连接线 -->
  <line x1="250" y1="160" x2="350" y2="270" stroke="#D4A574" stroke-width="2"/>
  <line x1="550" y1="160" x2="450" y2="270" stroke="#D4A574" stroke-width="2"/>
  <line x1="250" y1="440" x2="350" y2="330" stroke="#D4A574" stroke-width="2"/>
  <line x1="550" y1="440" x2="450" y2="330" stroke="#D4A574" stroke-width="2"/>
  
  <!-- 方法特点说明 -->
  <rect x="300" y="240" width="200" height="30" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1" rx="5"/>
  <text x="400" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    多元化 • 系统化 • 实用性
  </text>
  
  <!-- 研究挑战说明 -->
  <rect x="300" y="330" width="200" height="30" fill="#FFF8E1" stroke="#FFB74D" stroke-width="1" rx="5"/>
  <text x="400" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E65100">
    复杂性 • 特殊性 • 实用性
  </text>
  
  <!-- 应用对象 -->
  <rect x="50" y="250" width="120" height="80" fill="#E1BEE7" stroke="#BA68C8" stroke-width="1" rx="5"/>
  <text x="110" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
    研究对象
  </text>
  <text x="110" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6A1B9A">
    • 消费者
  </text>
  <text x="110" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6A1B9A">
    • 医生
  </text>
  <text x="110" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6A1B9A">
    • 销售人员
  </text>
  
  <!-- 研究环境 -->
  <rect x="630" y="250" width="120" height="80" fill="#FFEBEE" stroke="#F44336" stroke-width="1" rx="5"/>
  <text x="690" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C62828">
    研究环境
  </text>
  <text x="690" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 私密性
  </text>
  <text x="690" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 敏感性
  </text>
  <text x="690" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C62828">
    • 伦理规范
  </text>
  
  <!-- 底部说明 -->
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    图2.1：医美心理学研究的四维方法论体系及各方法特点
  </text>
</svg>