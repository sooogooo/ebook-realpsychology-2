name: Build and Deploy Medical Aesthetics Psychology Website

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18'
  CACHE_VERSION: v1
  DOMAINS: 'medical-aesthetics-psychology.com,www.medical-aesthetics-psychology.com'

jobs:
  # Build and Test Job
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Get full history for accurate versioning

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Lint code
      run: npm run lint || echo "Linting skipped (no lint script configured)"

    - name: Run tests
      run: npm run test || echo "Tests skipped (no test script configured)"

    - name: Validate HTML
      run: npm run test:validation || echo "HTML validation skipped"

    - name: Build website
      run: npm run build:production
      env:
        NODE_ENV: production
        BASE_URL: ${{ steps.deploy.outputs.url }}

    - name: Compress assets
      run: npm run compress

    - name: Run Lighthouse CI
      run: npm run test:lighthouse
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

    - name: Generate performance report
      run: npm run analyze

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: website-dist
        path: dist/
        retention-days: 30

    - name: Upload bundle analyzer report
      uses: actions/upload-artifact@v4
      with:
        name: bundle-report
        path: dist/bundle-report.html
        retention-days: 7

  # Deploy to Preview Environment
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: website-dist
        path: dist/

    - name: Deploy to Netlify Preview
      uses: netlify/actions/cli@master
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      with:
        args: deploy --dir=dist --alias=pr-${{ github.event.number }}-medical-aesthetics-psychology

    - name: Comment PR with preview link
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const prNumber = context.issue.number;
          const previewUrl = `https://pr-${prNumber}-medical-aesthetics-psychology.netlify.app`;

          github.rest.issues.createComment({
            owner,
            repo,
            issue_number: prNumber,
            body: `## 🚀 Preview Available\n\nYour preview is ready at: ${previewUrl}\n\n**Performance Report**: [View Bundle Analysis](https://github.com/${owner}/${repo}/actions/runs/${{ github.run_id }})`
          });

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production

    strategy:
      matrix:
        platform: [netlify, vercel, cloudflare-pages]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: website-dist
        path: dist/

    - name: Deploy to Netlify
      if: matrix.platform == 'netlify'
      uses: netlify/actions/cli@master
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      with:
        args: deploy --prod --dir=dist

    - name: Deploy to Vercel
      if: matrix.platform == 'vercel'
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'
        working-directory: .

    - name: Deploy to Cloudflare Pages
      if: matrix.platform == 'cloudflare-pages'
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: medical-aesthetics-psychology
        directory: dist
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy to GitHub Pages
      if: matrix.platform == 'github-pages'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        cname: medical-aesthetics-psychology.com

    - name: Deploy to AWS S3 + CloudFront
      if: matrix.platform == 'aws'
      uses: jakejarvis/s3-sync-action@master
      with:
        args: --follow-symlinks --delete --exclude '.DS_Store' --exclude '*.log'
      env:
        AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        SOURCE_DIR: 'dist'

    - name: Invalidate CloudFront cache
      if: matrix.platform == 'aws'
      uses: awact/cloudfront-action@master
      env:
        DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        PATHS: '/*'
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # Chinese Platform Deployment
  deploy-chinese-platforms:
    name: Deploy to Chinese Platforms
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production

    strategy:
      matrix:
        platform: [aliyun-oss, tencent-cos]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: website-dist
        path: dist/

    - name: Deploy to Aliyun OSS
      if: matrix.platform == 'aliyun-oss'
      run: |
        chmod +x deploy/chinese-platforms/aliyun-oss.sh
        ./deploy/chinese-platforms/aliyun-oss.sh
      env:
        ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
        ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}

    - name: Deploy to Tencent COS
      if: matrix.platform == 'tencent-cos'
      run: |
        chmod +x deploy/chinese-platforms/tencent-cos.sh
        ./deploy/chinese-platforms/tencent-cos.sh
      env:
        TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
        TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
        TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}

  # Performance Monitoring
  performance-monitoring:
    name: Performance Monitoring
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run WebPageTest
      run: |
        curl -X POST "https://www.webpagetest.org/runtest.php" \
          -d "url=https://medical-aesthetics-psychology.com" \
          -d "k=${{ secrets.WEBPAGETEST_API_KEY }}" \
          -d "location=Dulles:Chrome" \
          -d "runs=3" \
          -d "f=json"

    - name: Check uptime
      run: |
        for url in ${{ env.DOMAINS }}; do
          curl -f "https://$url" || echo "Failed to reach $url"
        done

    - name: Send Slack notification
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: "🎉 Medical Aesthetics Psychology website deployed successfully!"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Send Slack notification on failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: "❌ Deployment failed for Medical Aesthetics Psychology website!"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Security Scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run npm audit
      run: npm audit --audit-level=moderate

    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

    - name: Upload SARIF file to GitHub
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'snyk.sarif'

  # Analytics and Reporting
  analytics-report:
    name: Analytics Report
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Generate deployment report
      run: |
        echo "# Deployment Report - $(date)" > deployment-report.md
        echo "" >> deployment-report.md
        echo "## Build Information" >> deployment-report.md
        echo "- **Commit**: ${{ github.sha }}" >> deployment-report.md
        echo "- **Branch**: ${{ github.ref_name }}" >> deployment-report.md
        echo "- **Trigger**: ${{ github.event_name }}" >> deployment-report.md
        echo "- **Build Time**: $(date)" >> deployment-report.md
        echo "" >> deployment-report.md
        echo "## Performance Metrics" >> deployment-report.md
        echo "- **Bundle Size**: $(du -sh dist/ | cut -f1)" >> deployment-report.md
        echo "- **Total Files**: $(find dist -type f | wc -l)" >> deployment-report.md
        echo "- **HTML Pages**: $(find dist -name '*.html' | wc -l)" >> deployment-report.md
        echo "- **Images**: $(find dist -name '*.{png,jpg,jpeg,svg,webp,avif}' | wc -l)" >> deployment-report.md

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body_path: deployment-report.md
        draft: false
        prerelease: false