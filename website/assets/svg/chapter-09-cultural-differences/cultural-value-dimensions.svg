<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 文化价值维度图表 -->
  <defs>
    <!-- 个人主义集体主义渐变 -->
    <linearGradient id="individualism-collectivism-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 权力距离渐变 -->
    <linearGradient id="power-distance-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 不确定性规避渐变 -->
    <linearGradient id="uncertainty-avoidance-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <!-- 长期导向渐变 -->
    <linearGradient id="long-term-orientation-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 放纵克制渐变 -->
    <linearGradient id="indulgence-restraint-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    文化价值维度图表
  </text>
  
  <!-- 雷达图中心 -->
  <g transform="translate(400, 300)">
    <!-- 雷达图网格 -->
    <g stroke="#ddd" stroke-width="1" fill="none">
      <!-- 同心圆 -->
      <circle r="40" opacity="0.5"/>
      <circle r="80" opacity="0.5"/>
      <circle r="120" opacity="0.5"/>
      <circle r="160" opacity="0.5"/>
      
      <!-- 维度轴线 -->
      <line x1="0" y1="0" x2="0" y2="-160"/>
      <line x1="0" y1="0" x2="152" y2="-49"/>
      <line x1="0" y1="0" x2="94" y2="129"/>
      <line x1="0" y1="0" x2="-94" y2="129"/>
      <line x1="0" y1="0" x2="-152" y2="-49"/>
    </g>
    
    <!-- 维度标签 -->
    <text x="0" y="-175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">个人主义</text>
    <text x="0" y="-190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">集体主义</text>
    
    <text x="170" y="-45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">权力距离</text>
    
    <text x="110" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">不确定性</text>
    <text x="110" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">规避</text>
    
    <text x="-110" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2ecc71">长期导向</text>
    
    <text x="-170" y="-45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9b59b6">放纵克制</text>
    
    <!-- 美国文化轮廓 -->
    <g fill="rgba(52, 152, 219, 0.3)" stroke="#3498db" stroke-width="2">
      <polygon points="0,-144 137,-44 56,77 -66,103 -117,-38" data-interactive="true" data-tooltip="美国文化维度特征" data-onclick="details"/>
    </g>
    
    <!-- 中国文化轮廓 -->
    <g fill="rgba(231, 76, 60, 0.3)" stroke="#e74c3c" stroke-width="2">
      <polygon points="0,-80 106,-34 103,141 -85,117 -141,-45" data-interactive="true" data-tooltip="中国文化维度特征" data-onclick="details"/>
    </g>
    
    <!-- 日本文化轮廓 -->
    <g fill="rgba(46, 204, 113, 0.3)" stroke="#2ecc71" stroke-width="2">
      <polygon points="0,-96 114,-37 77,106 -94,126 -129,-41" data-interactive="true" data-tooltip="日本文化维度特征" data-onclick="details"/>
    </g>
    
    <!-- 德国文化轮廓 -->
    <g fill="rgba(243, 156, 18, 0.3)" stroke="#f39c12" stroke-width="2">
      <polygon points="0,-112 91,-29 85,116 -71,98 -114,-37" data-interactive="true" data-tooltip="德国文化维度特征" data-onclick="details"/>
    </g>
    
    <!-- 数据点 -->
    <!-- 美国数据点 -->
    <circle cx="0" cy="-144" r="4" fill="#3498db"/>
    <circle cx="137" cy="-44" r="4" fill="#3498db"/>
    <circle cx="56" cy="77" r="4" fill="#3498db"/>
    <circle cx="-66" cy="103" r="4" fill="#3498db"/>
    <circle cx="-117" cy="-38" r="4" fill="#3498db"/>
    
    <!-- 中国数据点 -->
    <circle cx="0" cy="-80" r="4" fill="#e74c3c"/>
    <circle cx="106" cy="-34" r="4" fill="#e74c3c"/>
    <circle cx="103" cy="141" r="4" fill="#e74c3c"/>
    <circle cx="-85" cy="117" r="4" fill="#e74c3c"/>
    <circle cx="-141" cy="-45" r="4" fill="#e74c3c"/>
    
    <!-- 评分刻度 -->
    <text x="10" y="-40" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">40</text>
    <text x="10" y="-80" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">80</text>
    <text x="10" y="-120" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">120</text>
    <text x="10" y="-160" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">160</text>
  </g>
  
  <!-- 维度说明 -->
  <g transform="translate(50, 100)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">维度说明：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">个人主义vs集体主义：社会关系中的个人与集体重要性</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">权力距离：社会对权力不平等的接受程度</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">不确定性规避：对不确定性的容忍程度</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">长期导向vs短期导向：时间观念和未来规划</text>
    </g>
    
    <g transform="translate(0, 105)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">放纵vs克制：对欲望满足的控制程度</text>
    </g>
  </g>
  
  <!-- 文化对比 -->
  <g transform="translate(50, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">文化对比：</text>
    
    <g transform="translate(0, 25)">
      <rect x="0" y="-8" width="15" height="15" fill="rgba(52, 152, 219, 0.3)" stroke="#3498db" stroke-width="1"/>
      <text x="20" y="5" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">美国：高度个人主义，低权力距离</text>
    </g>
    
    <g transform="translate(200, 25)">
      <rect x="0" y="-8" width="15" height="15" fill="rgba(231, 76, 60, 0.3)" stroke="#e74c3c" stroke-width="1"/>
      <text x="20" y="5" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">中国：集体主义，高权力距离</text>
    </g>
    
    <g transform="translate(0, 45)">
      <rect x="0" y="-8" width="15" height="15" fill="rgba(46, 204, 113, 0.3)" stroke="#2ecc71" stroke-width="1"/>
      <text x="20" y="5" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">日本：中等个人主义，高长期导向</text>
    </g>
    
    <g transform="translate(200, 45)">
      <rect x="0" y="-8" width="15" height="15" fill="rgba(243, 156, 18, 0.3)" stroke="#f39c12" stroke-width="1"/>
      <text x="20" y="5" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">德国：中等个人主义，低权力距离</text>
    </g>
  </g>
  
  <!-- 数据来源 -->
  <g transform="translate(600, 480)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">数据来源：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">基于Hofstede文化维度理论</text>
    <text y="35" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">数据范围：0-120分</text>
  </g>
  
  <!-- 雷达图动画 -->
  <circle cx="400" cy="300" r="165" fill="none" stroke="#667eea" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="165;180;165" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各文化区域查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>