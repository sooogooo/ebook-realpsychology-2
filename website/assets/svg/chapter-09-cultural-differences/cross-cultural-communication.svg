<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 跨文化交流模式 -->
  <defs>
    <!-- 高语境文化渐变 -->
    <linearGradient id="high-context-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 低语境文化渐变 -->
    <linearGradient id="low-context-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 直接沟通渐变 -->
    <linearGradient id="direct-communication-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 间接沟通渐变 -->
    <linearGradient id="indirect-communication-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    跨文化交流模式
  </text>
  
  <!-- 交流模式中心 -->
  <g transform="translate(400, 150)">
    <text x="0" y="-50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">沟通模式分类</text>
    
    <!-- 高语境文化 -->
    <g transform="translate(-120, 0)">
      <rect x="-60" y="-30" width="120" height="60" rx="30" fill="url(#high-context-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="高语境文化：隐含意义丰富" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">高语境</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">文化</text>
    </g>
    
    <!-- 低语境文化 -->
    <g transform="translate(120, 0)">
      <rect x="-60" y="-30" width="120" height="60" rx="30" fill="url(#low-context-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="低语境文化：明确直接表达" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">低语境</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">文化</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -60 0 L 60 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- 沟通方式对比 -->
  <g transform="translate(100, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">沟通方式对比：</text>
    
    <!-- 直接沟通 -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="300" height="80" rx="10" fill="rgba(46, 204, 113, 0.1)" stroke="#2ecc71" stroke-width="2"/>
      <text x="10" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2ecc71">直接沟通</text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• 明确表达意见和需求</text>
      <text x="10" y="55" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• 直截了当，不绕弯子</text>
      <text x="10" y="70" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• 注重效率和结果</text>
    </g>
    
    <!-- 间接沟通 -->
    <g transform="translate(350, 30)">
      <rect x="0" y="0" width="300" height="80" rx="10" fill="rgba(243, 156, 18, 0.1)" stroke="#f39c12" stroke-width="2"/>
      <text x="10" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">间接沟通</text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="10" fill="#f39c12">• 委婉表达，避免冲突</text>
      <text x="10" y="55" font-family="Arial, sans-serif" font-size="10" fill="#f39c12">• 注重语境和非语言信息</text>
      <text x="10" y="70" font-family="Arial, sans-serif" font-size="10" fill="#f39c12">• 重视关系和谐</text>
    </g>
  </g>
  
  <!-- 文化沟通特征 -->
  <g transform="translate(100, 420)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">文化沟通特征：</text>
    
    <!-- 高语境文化特征 -->
    <g transform="translate(0, 25)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">高语境：中国、日本、韩国、阿拉伯国家</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">特点：隐含意义丰富，重视语境，关系导向</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">沟通：委婉含蓄，注重面子，避免冲突</text>
    </g>
    
    <!-- 低语境文化特征 -->
    <g transform="translate(350, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">低语境：美国、德国、瑞士、北欧国家</text>
    </g>
    
    <g transform="translate(350, 45)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">特点：明确直接，重视言语，任务导向</text>
    </g>
    
    <g transform="translate(350, 65)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">沟通：直截了当，注重效率，明确表达</text>
    </g>
  </g>
  
  <!-- 沟通策略 -->
  <g transform="translate(100, 540)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">跨文化沟通策略：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 了解对方文化背景和沟通习惯</text>
    <text y="35" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 适应不同的沟通方式，灵活调整</text>
    <text y="50" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 建立信任和理解的桥梁</text>
  </g>
  
  <!-- 非语言沟通 -->
  <g transform="translate(550, 150)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">非语言沟通：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">肢体语言：手势、姿态、表情</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">空间距离：个人空间、社交距离</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">眼神接触：直视程度、持续时间</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">时间观念：准时性、时间价值</text>
    </g>
  </g>
  
  <!-- 沟通效果评估 -->
  <g transform="translate(650, 280)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">沟通效果：</text>
    
    <!-- 效果指示器 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="16" width="15" height="64" rx="7" fill="#2ecc71"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">80%</text>
    </g>
    
    <!-- 评估说明 -->
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">差：0-40%</text>
    <text x="0" y="135" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">一般：41-70%</text>
    <text x="0" y="150" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">优秀：71-100%</text>
  </g>
  
  <!-- 沟通流程动画 -->
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#667eea" stroke-width="2" opacity="0.3">
      <animate attributeName="r" values="60;80;60" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 沟通循环箭头 -->
    <path d="M 0,-60 A 60,60 0 0,1 60,0" fill="none" stroke="#667eea" stroke-width="2" opacity="0.5">
      <animate attributeName="stroke-dasharray" values="0,1000;1000,0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各模式查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>