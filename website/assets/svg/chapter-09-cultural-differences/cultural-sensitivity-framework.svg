<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 文化敏感性框架 -->
  <defs>
    <!-- 文化意识渐变 -->
    <linearGradient id="cultural-awareness-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 文化知识渐变 -->
    <linearGradient id="cultural-knowledge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 文化技能渐变 -->
    <linearGradient id="cultural-skills-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <!-- 文化态度渐变 -->
    <linearGradient id="cultural-attitude-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    文化敏感性框架
  </text>
  
  <!-- 框架中心 -->
  <g transform="translate(400, 150)">
    <text x="0" y="-50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">文化敏感性维度</text>
    
    <!-- 文化意识 -->
    <g transform="translate(-150, 0)">
      <rect x="-45" y="-25" width="90" height="50" rx="25" fill="url(#cultural-awareness-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="文化意识：认识文化差异" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">文化</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">意识</text>
    </g>
    
    <!-- 文化知识 -->
    <g transform="translate(-50, 0)">
      <rect x="-45" y="-25" width="90" height="50" rx="25" fill="url(#cultural-knowledge-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="文化知识：了解文化背景" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">文化</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">知识</text>
    </g>
    
    <!-- 文化技能 -->
    <g transform="translate(50, 0)">
      <rect x="-45" y="-25" width="90" height="50" rx="25" fill="url(#cultural-skills-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="文化技能：跨文化沟通能力" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">文化</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">技能</text>
    </g>
    
    <!-- 文化态度 -->
    <g transform="translate(150, 0)">
      <rect x="-45" y="-25" width="90" height="50" rx="25" fill="url(#cultural-attitude-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="文化态度：尊重和开放态度" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">文化</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">态度</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -105 0 L -95 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M -5 0 L 5 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 95 0 L 105 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 敏感性层次 -->
  <g transform="translate(100, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">敏感性层次：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">表层敏感：认识明显的文化差异</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">中层敏感：理解文化价值观差异</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">深层敏感：洞察文化心理差异</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">整合敏感：文化融合创新能力</text>
    </g>
  </g>
  
  <!-- 培养策略 -->
  <g transform="translate(400, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">培养策略：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">教育训练：文化敏感性培训课程</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">实践经验：跨文化交流实践机会</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">反思学习：文化冲突反思总结</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">导师指导：跨文化导师指导</text>
    </g>
  </g>
  
  <!-- 应用领域 -->
  <g transform="translate(100, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">应用领域：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">医疗服务：跨文化医疗服务提供</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">教育培训：跨文化教育培训项目</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">企业管理：跨文化团队管理</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">国际关系：国际交流与合作</text>
    </g>
  </g>
  
  <!-- 评估指标 -->
  <g transform="translate(400, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">评估指标：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 文化意识水平测试</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 跨文化沟通能力评估</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 文化冲突处理能力</text>
  </g>
  
  <!-- 敏感性水平评估 -->
  <g transform="translate(650, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">敏感性水平：</text>
    
    <!-- 敏感性水平指示器 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="12" width="15" height="68" rx="7" fill="#2ecc71"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">85%</text>
    </g>
    
    <!-- 评估说明 -->
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">低：0-40%</text>
    <text x="0" y="135" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">中等：41-70%</text>
    <text x="0" y="150" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">高：71-100%</text>
  </g>
  
  <!-- 框架整合动画 -->
  <circle cx="400" cy="150" r="120" fill="none" stroke="#667eea" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="120;140;120" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各维度查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>