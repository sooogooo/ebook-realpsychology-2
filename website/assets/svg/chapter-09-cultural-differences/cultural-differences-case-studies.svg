<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 文化差异案例研究 -->
  <defs>
    <!-- 案例一渐变 -->
    <linearGradient id="case-one-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 案例二渐变 -->
    <linearGradient id="case-two-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 案例三渐变 -->
    <linearGradient id="case-three-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <!-- 案例四渐变 -->
    <linearGradient id="case-four-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    文化差异案例研究
  </text>
  
  <!-- 案例研究中心 -->
  <g transform="translate(400, 150)">
    <text x="0" y="-50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">典型案例分析</text>
    
    <!-- 案例一：医美消费文化差异 -->
    <g transform="translate(-150, 0)">
      <rect x="-45" y="-25" width="90" height="50" rx="25" fill="url(#case-one-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="案例一：医美消费文化差异" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">案例</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">一</text>
    </g>
    
    <!-- 案例二：跨文化医疗服务 -->
    <g transform="translate(-50, 0)">
      <rect x="-45" y="-25" width="90" height="50" rx="25" fill="url(#case-two-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="案例二：跨文化医疗服务" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">案例</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">二</text>
    </g>
    
    <!-- 案例三：国际营销策略 -->
    <g transform="translate(50, 0)">
      <rect x="-45" y="-25" width="90" height="50" rx="25" fill="url(#case-three-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="案例三：国际营销策略" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">案例</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">三</text>
    </g>
    
    <!-- 案例四：全球化团队管理 -->
    <g transform="translate(150, 0)">
      <rect x="-45" y="-25" width="90" height="50" rx="25" fill="url(#case-four-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="案例四：全球化团队管理" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">案例</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">四</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -105 0 L -95 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M -5 0 L 5 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 95 0 L 105 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 案例一详情 -->
  <g transform="translate(50, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">案例一：医美消费文化差异</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">背景：跨国医美机构在不同国家的运营</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">差异：东方vs西方美容观念差异</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">挑战：文化适应和本地化策略</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">成果：成功实现跨文化市场拓展</text>
    </g>
  </g>
  
  <!-- 案例二详情 -->
  <g transform="translate(350, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">案例二：跨文化医疗服务</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">背景：国际医院的多元文化患者服务</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">差异：不同文化背景患者的需求差异</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">挑战：沟通障碍和文化误解</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">成果：建立文化敏感的服务体系</text>
    </g>
  </g>
  
  <!-- 案例三详情 -->
  <g transform="translate(50, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">案例三：国际营销策略</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">背景：医美产品全球市场营销</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">差异：不同文化市场的消费习惯</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">挑战：文化适应和本地化营销</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">成果：实现全球市场成功布局</text>
    </g>
  </g>
  
  <!-- 案例四详情 -->
  <g transform="translate(350, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2ecc71">案例四：全球化团队管理</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">背景：跨国医美企业的多元团队</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">差异：不同文化背景员工的管理</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">挑战：文化冲突和团队协作</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">成果：建立高效的跨文化团队</text>
    </g>
  </g>
  
  <!-- 研究方法 -->
  <g transform="translate(650, 280)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">研究方法：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">深度访谈</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">参与观察</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">文献分析</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">比较研究</text>
    </g>
  </g>
  
  <!-- 启示总结 -->
  <g transform="translate(650, 450)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">启示总结：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">• 文化差异是挑战也是机遇</text>
    <text y="40" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">• 文化敏感性是成功关键</text>
    <text y="60" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">• 本地化策略至关重要</text>
    <text y="80" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">• 持续学习和适应能力</text>
  </g>
  
  <!-- 案例研究动画 -->
  <circle cx="400" cy="150" r="100" fill="none" stroke="#667eea" stroke-width="2" opacity="0.3">
    <animate attributeName="r" values="100;120;100" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各案例查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>