<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 文化对消费模式的影响 -->
  <defs>
    <!-- 消费动机渐变 -->
    <linearGradient id="consumption-motivation-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 决策过程渐变 -->
    <linearGradient id="decision-process-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 品牌偏好渐变 -->
    <linearGradient id="brand-preference-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <!-- 价格敏感度渐变 -->
    <linearGradient id="price-sensitivity-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    文化对消费模式的影响
  </text>
  
  <!-- 影响因素中心 -->
  <g transform="translate(400, 150)">
    <text x="0" y="-50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">文化影响因素</text>
    
    <!-- 消费动机 -->
    <g transform="translate(-150, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#consumption-motivation-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="消费动机：文化价值观驱动" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">消费</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">动机</text>
    </g>
    
    <!-- 决策过程 -->
    <g transform="translate(-50, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#decision-process-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="决策过程：文化思维方式影响" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">决策</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">过程</text>
    </g>
    
    <!-- 品牌偏好 -->
    <g transform="translate(50, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#brand-preference-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="品牌偏好：文化认同感影响" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">品牌</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">偏好</text>
    </g>
    
    <!-- 价格敏感度 -->
    <g transform="translate(150, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#price-sensitivity-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="价格敏感度：文化经济观念影响" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">价格</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">敏感</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -115 0 L -85 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M -15 0 L 15 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 85 0 L 115 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 文化价值观影响 -->
  <g transform="translate(100, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">文化价值观影响：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">个人主义vs集体主义：影响购买决策方式</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">权力距离：影响对高端品牌的接受度</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">不确定性规避：影响对新产品的态度</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">长期导向：影响消费规划和储蓄行为</text>
    </g>
  </g>
  
  <!-- 消费行为对比 -->
  <g transform="translate(400, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">消费行为对比：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">东方文化：注重面子消费，群体认同</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">西方文化：注重个性表达，实用主义</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">发展中国家：价格敏感，品牌忠诚度低</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">发达国家：品质导向，品牌意识强</text>
    </g>
  </g>
  
  <!-- 医美消费特征 -->
  <g transform="translate(100, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">医美消费特征：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">东亚：追求自然美，微创美容为主</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">西方：追求明显效果，手术美容为主</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">中东：注重美容护理，奢华消费</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">拉美：热情开放，美容消费活跃</text>
    </g>
  </g>
  
  <!-- 市场策略 -->
  <g transform="translate(400, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">市场策略：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 文化定位：根据文化特点调整营销策略</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 产品本地化：适应本地文化需求</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 文化敏感性：避免文化冲突和误解</text>
  </g>
  
  <!-- 影响程度评估 -->
  <g transform="translate(650, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">影响程度：</text>
    
    <!-- 影响程度指示器 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="8" width="15" height="72" rx="7" fill="#2ecc71"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">90%</text>
    </g>
    
    <!-- 评估说明 -->
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">轻微：0-40%</text>
    <text x="0" y="135" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">中等：41-70%</text>
    <text x="0" y="150" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">强烈：71-100%</text>
  </g>
  
  <!-- 消费循环动画 -->
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#667eea" stroke-width="2" opacity="0.3">
      <animate attributeName="r" values="60;80;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 消费循环箭头 -->
    <path d="M 0,-60 A 60,60 0 0,1 60,0" fill="none" stroke="#667eea" stroke-width="2" opacity="0.5">
      <animate attributeName="stroke-dasharray" values="0,1000;1000,0" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各因素查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>