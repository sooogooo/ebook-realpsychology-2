<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 建立健康的销售文化 -->
  <defs>
    <!-- 健康文化渐变 -->
    <linearGradient id="healthy-culture-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 文化特征渐变 -->
    <linearGradient id="culture-feature-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 建设策略渐变 -->
    <linearGradient id="strategy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <!-- 评估改进渐变 -->
    <linearGradient id="evaluation-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    建立健康的销售文化
  </text>
  
  <!-- 健康文化核心 -->
  <g transform="translate(400, 150)">
    <text x="0" y="-40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">健康文化特征</text>
    
    <!-- 诚信为本 -->
    <g transform="translate(-150, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#culture-feature-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="诚信为本：诚实守信" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">诚信</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">为本</text>
    </g>
    
    <!-- 客户导向 -->
    <g transform="translate(-50, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#culture-feature-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="客户导向：以客户为中心" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">客户</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">导向</text>
    </g>
    
    <!-- 专业精神 -->
    <g transform="translate(50, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#culture-feature-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="专业精神：专业素养" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">专业</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">精神</text>
    </g>
    
    <!-- 持续发展 -->
    <g transform="translate(150, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#culture-feature-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="持续发展：长期发展" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">持续</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">发展</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -115 0 L -85 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M -15 0 L 15 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 85 0 L 115 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 建设策略 -->
  <g transform="translate(150, 300)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">建设策略：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">领导示范：管理层带头实践</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">制度建设：完善规范制度</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">培训教育：提升伦理意识</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">激励机制：奖励伦理行为</text>
    </g>
  </g>
  
  <!-- 文化氛围 -->
  <g transform="translate(450, 300)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">文化氛围：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">开放沟通：鼓励坦诚交流</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">相互尊重：建立信任关系</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">学习创新：持续改进提升</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">责任担当：勇于承担责任</text>
    </g>
  </g>
  
  <!-- 评估指标 -->
  <g transform="translate(100, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">评估指标：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 员工满意度和敬业度</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 客户满意度和忠诚度</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 伦理行为合规率</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 企业声誉和品牌价值</text>
  </g>
  
  <!-- 持续改进 -->
  <g transform="translate(400, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">持续改进：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 定期文化诊断评估</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 收集反馈意见建议</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 调整优化建设策略</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 推广优秀实践经验</text>
  </g>
  
  <!-- 文化健康度 -->
  <g transform="translate(650, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">文化健康度：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="12" width="15" height="68" rx="7" fill="#2ecc71"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">85%</text>
    </g>
  </g>
  
  <!-- 实施进度 -->
  <g transform="translate(650, 350)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">实施进度：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="24" width="15" height="56" rx="7" fill="#9b59b6"/>
      <text x="25" y="60" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">70%</text>
    </g>
  </g>
  
  <!-- 成长动画 -->
  <circle cx="400" cy="300" r="120" fill="none" stroke="#2ecc71" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="120;140;120" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各特征查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>