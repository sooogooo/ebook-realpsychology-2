<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 消费者权益保护 -->
  <defs>
    <!-- 权益类型渐变 -->
    <linearGradient id="rights-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 保护机制渐变 -->
    <linearGradient id="protection-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 维权途径渐变 -->
    <linearGradient id="remedy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <!-- 风险防范渐变 -->
    <linearGradient id="prevention-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shield-filter">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    消费者权益保护
  </text>
  
  <!-- 保护盾牌中心 -->
  <g transform="translate(400, 200)">
    <!-- 盾牌外形 -->
    <path d="M 0 -60 L -50 -40 L -50 20 L 0 60 L 50 20 L 50 -40 Z" fill="url(#protection-grad)" filter="url(#shield-filter)" data-interactive="true" data-tooltip="消费者权益保护盾牌" data-onclick="details"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">权益</text>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">保护</text>
    
    <!-- 盾牌装饰线 -->
    <path d="M -30 -30 L 30 -30" stroke="white" stroke-width="2" opacity="0.5"/>
    <path d="M -30 0 L 30 0" stroke="white" stroke-width="2" opacity="0.5"/>
    <path d="M -30 30 L 30 30" stroke="white" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- 主要权益类型 -->
  <g transform="translate(400, 350)">
    <text x="0" y="-60" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">主要权益类型</text>
    
    <!-- 知情权 -->
    <g transform="translate(-180, 0)">
      <circle cx="0" cy="0" r="30" fill="url(#rights-grad)" filter="url(#shield-filter)" data-interactive="true" data-tooltip="知情权：了解真实信息" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">知情</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">权利</text>
    </g>
    
    <!-- 选择权 -->
    <g transform="translate(-60, 0)">
      <circle cx="0" cy="0" r="30" fill="url(#rights-grad)" filter="url(#shield-filter)" data-interactive="true" data-tooltip="选择权：自由选择服务" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">选择</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">权利</text>
    </g>
    
    <!-- 安全权 -->
    <g transform="translate(60, 0)">
      <circle cx="0" cy="0" r="30" fill="url(#rights-grad)" filter="url(#shield-filter)" data-interactive="true" data-tooltip="安全权：保障人身安全" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">安全</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">权利</text>
    </g>
    
    <!-- 监督权 -->
    <g transform="translate(180, 0)">
      <circle cx="0" cy="0" r="30" fill="url(#rights-grad)" filter="url(#shield-filter)" data-interactive="true" data-tooltip="监督权：监督服务质量" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">监督</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">权利</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M 0 40 L -150 40" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 0 40 L -30 40" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 0 40 L 90 40" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 0 40 L 150 40" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- 保护机制 -->
  <g transform="translate(100, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">保护机制：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 法律法规：完善法律保障</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 行业规范：制定行业标准</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 监督机构：加强监管力度</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 消费者组织：发挥维权作用</text>
  </g>
  
  <!-- 维权途径 -->
  <g transform="translate(450, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">维权途径：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 协商解决：与经营者协商</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 投诉举报：向监管部门投诉</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 仲裁调解：申请仲裁调解</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 法律诉讼：通过法律途径</text>
  </g>
  
  <!-- 保护效果 -->
  <g transform="translate(650, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">保护效果：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="12" width="15" height="68" rx="7" fill="#2ecc71"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">85%</text>
    </g>
  </g>
  
  <!-- 维权成功率 -->
  <g transform="translate(650, 350)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">维权成功率：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="20" width="15" height="60" rx="7" fill="#9b59b6"/>
      <text x="25" y="60" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">75%</text>
    </g>
  </g>
  
  <!-- 保护动画 -->
  <circle cx="400" cy="200" r="80" fill="none" stroke="#2ecc71" stroke-width="2" opacity="0.3">
    <animate attributeName="r" values="80;100;80" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各权益类型查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>