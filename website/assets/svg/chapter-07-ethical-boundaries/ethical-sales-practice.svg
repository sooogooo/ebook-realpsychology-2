<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 伦理销售实践指南 -->
  <defs>
    <!-- 核心要素渐变 -->
    <linearGradient id="core-element-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 实践方法渐变 -->
    <linearGradient id="practice-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 沟通技巧渐变 -->
    <linearGradient id="communication-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <!-- 效果评估渐变 -->
    <linearGradient id="evaluation-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    伦理销售实践指南
  </text>
  
  <!-- 核心要素 -->
  <g transform="translate(400, 150)">
    <text x="0" y="-40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">核心要素</text>
    
    <!-- 真诚透明 -->
    <g transform="translate(-150, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#core-element-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="真诚透明：诚实守信" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">真诚</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">透明</text>
    </g>
    
    <!-- 尊重客户 -->
    <g transform="translate(-50, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#core-element-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="尊重客户：以客户为中心" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">尊重</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">客户</text>
    </g>
    
    <!-- 专业负责 -->
    <g transform="translate(50, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#core-element-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="专业负责：专业精神" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">专业</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">负责</text>
    </g>
    
    <!-- 长期关系 -->
    <g transform="translate(150, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#core-element-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="长期关系：持续发展" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">长期</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">关系</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -115 0 L -85 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M -15 0 L 15 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 85 0 L 115 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 具体实践 -->
  <g transform="translate(200, 300)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">具体实践：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">全面信息披露：提供完整信息</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">个性化咨询：根据需求定制</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">无压力决策：给予充分时间</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">售后服务：持续跟踪支持</text>
    </g>
  </g>
  
  <!-- 沟通技巧 -->
  <g transform="translate(500, 300)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">沟通技巧：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">积极倾听：理解真实需求</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">清晰表达：用易懂语言</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">情绪管理：保持理性态度</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">反馈机制：及时回应问题</text>
    </g>
  </g>
  
  <!-- 效果评估 -->
  <g transform="translate(100, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">效果评估：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 客户满意度调查</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 重复购买率分析</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 投诉率统计</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 口碑传播效果</text>
  </g>
  
  <!-- 持续改进 -->
  <g transform="translate(400, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">持续改进：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 定期培训提升技能</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 收集客户反馈意见</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 更新销售理念方法</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 建立学习型组织</text>
  </g>
  
  <!-- 实践效果指示器 -->
  <g transform="translate(650, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">实践效果：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="16" width="15" height="64" rx="7" fill="#2ecc71"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">80%</text>
    </g>
  </g>
  
  <!-- 伦理指数 -->
  <g transform="translate(650, 350)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">伦理指数：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="12" width="15" height="68" rx="7" fill="#3498db"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">85%</text>
    </g>
  </g>
  
  <!-- 成长动画 -->
  <circle cx="400" cy="300" r="100" fill="none" stroke="#2ecc71" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="100;120;100" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各要素查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>