<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 伦理风险评估工具 -->
  <defs>
    <!-- 风险等级渐变 -->
    <linearGradient id="risk-level-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 评估维度渐变 -->
    <linearGradient id="assessment-dimension-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 风险控制渐变 -->
    <linearGradient id="risk-control-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 监控指标渐变 -->
    <linearGradient id="monitoring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    伦理风险评估工具
  </text>
  
  <!-- 风险等级矩阵 -->
  <g transform="translate(400, 200)">
    <text x="0" y="-80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">风险等级矩阵</text>
    
    <!-- 矩阵背景 -->
    <rect x="-120" y="-60" width="240" height="120" fill="none" stroke="#667eea" stroke-width="2"/>
    
    <!-- 高风险区 -->
    <rect x="-120" y="-60" width="80" height="40" fill="#e74c3c" opacity="0.3"/>
    <text x="-80" y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">高风险</text>
    
    <!-- 中风险区 -->
    <rect x="-40" y="-60" width="80" height="40" fill="#f39c12" opacity="0.3"/>
    <text x="0" y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">中风险</text>
    
    <!-- 低风险区 -->
    <rect x="40" y="-60" width="80" height="40" fill="#f1c40f" opacity="0.3"/>
    <text x="80" y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">低风险</text>
    
    <!-- 极高风险区 -->
    <rect x="-120" y="-20" width="80" height="80" fill="#c0392b" opacity="0.3"/>
    <text x="-80" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">极高</text>
    
    <!-- 中高风险区 -->
    <rect x="-40" y="-20" width="80" height="80" fill="#e67e22" opacity="0.3"/>
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e67e22">中高</text>
    
    <!-- 中低风险区 -->
    <rect x="40" y="-20" width="80" height="80" fill="#f39c12" opacity="0.3"/>
    <text x="80" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">中低</text>
    
    <!-- 坐标轴标签 -->
    <text x="-140" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">影响程度</text>
    <text x="140" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">高</text>
    <text x="0" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">发生概率</text>
    <text x="0" y="-70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">低</text>
  </g>
  
  <!-- 评估维度 -->
  <g transform="translate(100, 380)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">评估维度：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">法律合规性：是否符合法律法规</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">伦理标准：是否违背伦理原则</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">声誉影响：对品牌形象的影响</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">财务风险：可能造成的经济损失</text>
    </g>
  </g>
  
  <!-- 风险控制 -->
  <g transform="translate(450, 380)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">风险控制：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">预防措施：提前预防风险发生</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">缓解策略：降低风险影响程度</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">应急方案：应对风险发生</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">持续监控：实时监测风险</text>
    </g>
  </g>
  
  <!-- 评估工具 -->
  <g transform="translate(100, 150)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">评估工具：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 风险评估矩阵</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 伦理检查清单</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 利益相关者分析</text>
  </g>
  
  <!-- 监控指标 -->
  <g transform="translate(650, 380)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">监控指标：</text>
    
    <g transform="translate(0, 25)">
      <circle r="4" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">投诉率</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="4" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">违规率</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="4" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">满意度</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="4" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">声誉指数</text>
    </g>
  </g>
  
  <!-- 风险等级指示器 -->
  <g transform="translate(650, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">当前风险：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="40" width="15" height="40" rx="7" fill="#f39c12"/>
      <text x="25" y="65" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">50%</text>
    </g>
  </g>
  
  <!-- 控制效果 -->
  <g transform="translate(650, 320)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">控制效果：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="16" width="15" height="64" rx="7" fill="#2ecc71"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">80%</text>
    </g>
  </g>
  
  <!-- 动态风险指示 -->
  <circle cx="400" cy="200" r="100" fill="none" stroke="#e74c3c" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="100;120;100" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各区域查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>