<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 伦理边界的界定与挑战 -->
  <defs>
    <!-- 核心原则渐变 -->
    <linearGradient id="core-principle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 伦理边界渐变 -->
    <linearGradient id="ethical-boundary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <!-- 挑战渐变 -->
    <linearGradient id="challenge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 解决方案渐变 -->
    <linearGradient id="solution-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    伦理边界的界定与挑战
  </text>
  
  <!-- 核心原则 -->
  <g transform="translate(400, 150)">
    <text x="0" y="-30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">核心原则</text>
    
    <!-- 尊重自主 -->
    <g transform="translate(-150, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#core-principle-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="尊重自主：尊重客户决策权" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">尊重</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">自主</text>
    </g>
    
    <!-- 无伤害 -->
    <g transform="translate(-50, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#core-principle-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="无伤害：避免客户损害" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">无</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">伤害</text>
    </g>
    
    <!-- 有益 -->
    <g transform="translate(50, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#core-principle-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="有益：促进客户利益" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">有益</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">促进</text>
    </g>
    
    <!-- 公正 -->
    <g transform="translate(150, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#core-principle-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="公正：公平对待客户" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">公正</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">公平</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -115 0 L -85 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M -15 0 L 15 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 85 0 L 115 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 伦理边界界定 -->
  <g transform="translate(400, 300)">
    <text x="0" y="-50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">伦理边界界定</text>
    
    <!-- 信息真实性 -->
    <g transform="translate(-180, 0)">
      <rect x="-50" y="-25" width="100" height="50" rx="25" fill="url(#ethical-boundary-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="信息真实性边界" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">信息</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">真实性</text>
    </g>
    
    <!-- 压力程度 -->
    <g transform="translate(-60, 0)">
      <rect x="-50" y="-25" width="100" height="50" rx="25" fill="url(#ethical-boundary-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="压力程度边界" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">压力</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">程度</text>
    </g>
    
    <!-- 利益冲突 -->
    <g transform="translate(60, 0)">
      <rect x="-50" y="-25" width="100" height="50" rx="25" fill="url(#ethical-boundary-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="利益冲突边界" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">利益</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">冲突</text>
    </g>
    
    <!-- 隐私保护 -->
    <g transform="translate(180, 0)">
      <rect x="-50" y="-25" width="100" height="50" rx="25" fill="url(#ethical-boundary-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="隐私保护边界" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">隐私</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">保护</text>
    </g>
    
    <!-- 边界连接 -->
    <path d="M -130 0 L -110 0" stroke="#9b59b6" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M -10 0 L 10 0" stroke="#9b59b6" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M 110 0 L 130 0" stroke="#9b59b6" stroke-width="1" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 伦理挑战 -->
  <g transform="translate(100, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">现实挑战：</text>
    
    <g transform="translate(0, 25)">
      <circle r="4" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">业绩压力与伦理要求冲突</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="4" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">信息不对称难以完全避免</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="4" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">客户心理需求复杂多样</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="4" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">行业竞争环境激烈</text>
    </g>
  </g>
  
  <!-- 应对策略 -->
  <g transform="translate(450, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">应对策略：</text>
    
    <g transform="translate(0, 25)">
      <circle r="4" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">建立伦理评估机制</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="4" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">加强伦理培训教育</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="4" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">完善监督问责制度</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="4" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">营造伦理文化氛围</text>
    </g>
  </g>
  
  <!-- 伦理边界指示器 -->
  <g transform="translate(650, 300)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">边界清晰度：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="16" width="15" height="64" rx="7" fill="#9b59b6"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">80%</text>
    </g>
  </g>
  
  <!-- 动态边界效果 -->
  <circle cx="400" cy="300" r="120" fill="none" stroke="#9b59b6" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="120;140;120" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各元素查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>