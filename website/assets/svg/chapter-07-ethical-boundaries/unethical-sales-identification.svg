<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 不当销售行为的识别与防范 -->
  <defs>
    <!-- 不当行为渐变 -->
    <linearGradient id="unethical-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 识别方法渐变 -->
    <linearGradient id="detection-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <!-- 防范策略渐变 -->
    <linearGradient id="prevention-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 风险评估渐变 -->
    <linearGradient id="risk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    不当销售行为的识别与防范
  </text>
  
  <!-- 不当销售行为类型 -->
  <g transform="translate(400, 150)">
    <text x="0" y="-40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">不当销售行为类型</text>
    
    <!-- 虚假宣传 -->
    <g transform="translate(-200, 0)">
      <rect x="-50" y="-25" width="100" height="50" rx="25" fill="url(#unethical-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="虚假宣传：不实信息" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">虚假</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">宣传</text>
    </g>
    
    <!-- 隐瞒信息 -->
    <g transform="translate(-67, 0)">
      <rect x="-50" y="-25" width="100" height="50" rx="25" fill="url(#unethical-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="隐瞒信息：关键信息缺失" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">隐瞒</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">信息</text>
    </g>
    
    <!-- 高压销售 -->
    <g transform="translate(67, 0)">
      <rect x="-50" y="-25" width="100" height="50" rx="25" fill="url(#unethical-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="高压销售：强迫决策" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">高压</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">销售</text>
    </g>
    
    <!-- 价格欺诈 -->
    <g transform="translate(200, 0)">
      <rect x="-50" y="-25" width="100" height="50" rx="25" fill="url(#unethical-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="价格欺诈：不透明定价" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">价格</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">欺诈</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -150 0 L -117 0" stroke="#e74c3c" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M -17 0 L 17 0" stroke="#e74c3c" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M 117 0 L 150 0" stroke="#e74c3c" stroke-width="1" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 识别方法 -->
  <g transform="translate(150, 300)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">识别方法：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">信息验证：核实宣传内容真实性</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">风险评估：分析潜在风险程度</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">对比分析：多家机构比较验证</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">专业咨询：寻求第三方意见</text>
    </g>
    
    <g transform="translate(0, 105)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">时间检验：避免紧急决策</text>
    </g>
  </g>
  
  <!-- 防范策略 -->
  <g transform="translate(450, 300)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">防范策略：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">知识普及：提升消费者认知</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">建立标准：制定行业规范</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">加强监管：完善监督机制</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">法律保障：完善法律法规</text>
    </g>
    
    <g transform="translate(0, 105)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">投诉渠道：建立举报机制</text>
    </g>
  </g>
  
  <!-- 风险等级 -->
  <g transform="translate(50, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">风险等级：</text>
    
    <g transform="translate(0, 25)">
      <rect x="0" y="0" width="30" height="15" rx="3" fill="#e74c3c"/>
      <text x="40" y="12" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">高风险：欺诈、虚假宣传</text>
    </g>
    
    <g transform="translate(0, 45)">
      <rect x="0" y="0" width="30" height="15" rx="3" fill="#f39c12"/>
      <text x="40" y="12" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">中风险：隐瞒信息、高压销售</text>
    </g>
    
    <g transform="translate(0, 65)">
      <rect x="0" y="0" width="30" height="15" rx="3" fill="#f1c40f"/>
      <text x="40" y="12" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">低风险：过度承诺、信息模糊</text>
    </g>
  </g>
  
  <!-- 防护效果 -->
  <g transform="translate(400, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">防护效果：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 减少不当销售行为发生率</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 提高消费者识别能力</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 建立健康市场环境</text>
  </g>
  
  <!-- 风险指示器 -->
  <g transform="translate(700, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">当前风险：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="24" width="15" height="56" rx="7" fill="#e74c3c"/>
      <text x="25" y="60" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">70%</text>
    </g>
  </g>
  
  <!-- 防护能力 -->
  <g transform="translate(700, 350)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">防护能力：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="32" width="15" height="48" rx="7" fill="#2ecc71"/>
      <text x="25" y="60" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">60%</text>
    </g>
  </g>
  
  <!-- 警示动画 -->
  <circle cx="400" cy="150" r="80" fill="none" stroke="#e74c3c" stroke-width="2" opacity="0.3">
    <animate attributeName="r" values="80;100;80" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各类型查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>