<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 伦理培训与教育 -->
  <defs>
    <!-- 培训内容渐变 -->
    <linearGradient id="training-content-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 教育方法渐变 -->
    <linearGradient id="education-method-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <!-- 效果评估渐变 -->
    <linearGradient id="evaluation-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 持续改进渐变 -->
    <linearGradient id="improvement-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    伦理培训与教育
  </text>
  
  <!-- 培训体系中心 -->
  <g transform="translate(400, 180)">
    <!-- 核心圆 -->
    <circle cx="0" cy="0" r="50" fill="url(#training-content-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="伦理培训体系核心" data-onclick="details"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">伦理</text>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">培训</text>
    
    <!-- 培训模块 -->
    <g transform="translate(-120, -80)">
      <circle cx="0" cy="0" r="35" fill="url(#education-method-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="理论学习：伦理理论知识" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">理论</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">学习</text>
    </g>
    
    <g transform="translate(120, -80)">
      <circle cx="0" cy="0" r="35" fill="url(#education-method-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="案例分析：实际案例分析" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">案例</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">分析</text>
    </g>
    
    <g transform="translate(-120, 80)">
      <circle cx="0" cy="0" r="35" fill="url(#education-method-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="角色扮演：模拟实践演练" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">角色</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">扮演</text>
    </g>
    
    <g transform="translate(120, 80)">
      <circle cx="0" cy="0" r="35" fill="url(#education-method-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="讨论交流：互动讨论学习" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">讨论</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">交流</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -85 -45 L -45 -25" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 85 -45 L 45 -25" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M -85 45 L -45 25" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 85 45 L 45 25" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 培训内容 -->
  <g transform="translate(100, 350)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">培训内容：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">伦理理论：伦理学基础知识</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">法律法规：相关法律要求</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">行业标准：行业规范标准</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">实践技能：伦理决策技能</text>
    </g>
  </g>
  
  <!-- 教育方法 -->
  <g transform="translate(400, 350)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">教育方法：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">课堂教学：系统理论讲解</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">在线学习：灵活自主学习</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">实践演练：实际操作训练</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">导师指导：个性化辅导</text>
    </g>
  </g>
  
  <!-- 效果评估 -->
  <g transform="translate(100, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">效果评估：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 知识测试：理论知识掌握程度</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 技能评估：实际操作能力</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 行为观察：日常工作表现</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 反馈调查：培训效果反馈</text>
  </g>
  
  <!-- 持续改进 -->
  <g transform="translate(400, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">持续改进：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 定期更新培训内容</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 优化教育方法手段</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 建立培训效果跟踪</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 形成学习型组织文化</text>
  </g>
  
  <!-- 培训覆盖率 -->
  <g transform="translate(650, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">培训覆盖率：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="12" width="15" height="68" rx="7" fill="#3498db"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">85%</text>
    </g>
  </g>
  
  <!-- 培训效果 -->
  <g transform="translate(650, 350)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">培训效果：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="16" width="15" height="64" rx="7" fill="#2ecc71"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">80%</text>
    </g>
  </g>
  
  <!-- 知识传播动画 -->
  <circle r="3" fill="#667eea">
    <animateMotion dur="4s" repeatCount="indefinite">
      <mpath href="#knowledge-path"/>
    </animateMotion>
  </circle>
  
  <!-- 定义知识传播路径 -->
  <path id="knowledge-path" d="M 400 130 L 280 100 L 400 180 L 520 100 L 400 130" fill="none"/>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各模块查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>