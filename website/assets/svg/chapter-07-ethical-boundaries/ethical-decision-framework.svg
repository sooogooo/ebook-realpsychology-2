<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 伦理决策框架 -->
  <defs>
    <!-- 决策步骤渐变 -->
    <linearGradient id="decision-step-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 伦理原则渐变 -->
    <linearGradient id="ethical-principle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <!-- 利益相关者渐变 -->
    <linearGradient id="stakeholder-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 风险评估渐变 -->
    <linearGradient id="risk-assessment-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    伦理决策框架
  </text>
  
  <!-- 决策步骤 -->
  <g transform="translate(400, 150)">
    <text x="0" y="-30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">伦理决策步骤</text>
    
    <!-- 问题识别 -->
    <g transform="translate(-180, 0)">
      <rect x="-40" y="-20" width="80" height="40" rx="20" fill="url(#decision-step-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="问题识别：识别伦理问题" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">问题</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">识别</text>
    </g>
    
    <!-- 信息收集 -->
    <g transform="translate(-90, 0)">
      <rect x="-40" y="-20" width="80" height="40" rx="20" fill="url(#decision-step-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="信息收集：收集相关信息" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">信息</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">收集</text>
    </g>
    
    <!-- 方案制定 -->
    <g transform="translate(0, 0)">
      <rect x="-40" y="-20" width="80" height="40" rx="20" fill="url(#decision-step-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="方案制定：制定可行方案" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">方案</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">制定</text>
    </g>
    
    <!-- 伦理评估 -->
    <g transform="translate(90, 0)">
      <rect x="-40" y="-20" width="80" height="40" rx="20" fill="url(#decision-step-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="伦理评估：评估伦理影响" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">伦理</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">评估</text>
    </g>
    
    <!-- 决策执行 -->
    <g transform="translate(180, 0)">
      <rect x="-40" y="-20" width="80" height="40" rx="20" fill="url(#decision-step-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="决策执行：执行最优方案" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">决策</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">执行</text>
    </g>
    
    <!-- 连接箭头 -->
    <path d="M -140 0 L -130 0" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M -50 0 L -40 0" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 40 0 L 50 0" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 130 0 L 140 0" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- 伦理原则 -->
  <g transform="translate(150, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">伦理原则：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">功利原则：最大化整体利益</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">义务原则：履行道德义务</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">德性原则：培养道德品质</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">关怀原则：关注他人需求</text>
    </g>
  </g>
  
  <!-- 利益相关者 -->
  <g transform="translate(450, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">利益相关者：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">客户：接受服务的消费者</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">员工：提供服务的工作人员</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">企业：提供服务的机构</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">社会：整体社会环境</text>
    </g>
  </g>
  
  <!-- 风险评估 -->
  <g transform="translate(100, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">风险评估：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 法律风险：违反法律法规</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 声誉风险：损害品牌形象</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 关系风险：破坏信任关系</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 财务风险：造成经济损失</text>
  </g>
  
  <!-- 决策工具 -->
  <g transform="translate(400, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">决策工具：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 伦理决策矩阵</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 利益相关者分析</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 风险评估表</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 伦理检查清单</text>
  </g>
  
  <!-- 决策质量 -->
  <g transform="translate(650, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">决策质量：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="12" width="15" height="68" rx="7" fill="#3498db"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">85%</text>
    </g>
  </g>
  
  <!-- 伦理合规 -->
  <g transform="translate(650, 350)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">伦理合规：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="8" width="15" height="72" rx="7" fill="#9b59b6"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">90%</text>
    </g>
  </g>
  
  <!-- 流程动画 -->
  <circle r="3" fill="#667eea">
    <animateMotion dur="5s" repeatCount="indefinite">
      <mpath href="#decision-flow-path"/>
    </animateMotion>
  </circle>
  
  <!-- 定义决策流程路径 -->
  <path id="decision-flow-path" d="M 220 150 L 310 150 L 400 150 L 490 150 L 580 150" fill="none"/>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各步骤查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>