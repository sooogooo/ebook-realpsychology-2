<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 医美决策过程流程图 -->
  <defs>
    <linearGradient id="process-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="process-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="process-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="process-grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    医美决策过程流程图
  </text>
  
  <!-- 决策流程节点 -->
  <g transform="translate(400, 320)">
    <!-- 节点1: 需求认知 -->
    <g transform="translate(-300, -200)">
      <rect x="-60" y="-30" width="120" height="60" rx="30" fill="url(#process-grad1)" filter="url(#shadow)" data-interactive="true" data-tooltip="需求认知：产生医美需求的初始阶段" data-onclick="details"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">需求认知</text>
    </g>
    
    <!-- 节点2: 信息收集 -->
    <g transform="translate(-150, -100)">
      <rect x="-60" y="-30" width="120" height="60" rx="30" fill="url(#process-grad2)" filter="url(#shadow)" data-interactive="true" data-tooltip="信息收集：主动收集医美相关信息" data-onclick="details"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">信息收集</text>
    </g>
    
    <!-- 节点3: 方案评估 -->
    <g transform="translate(0, 0)">
      <rect x="-60" y="-30" width="120" height="60" rx="30" fill="url(#process-grad3)" filter="url(#shadow)" data-interactive="true" data-tooltip="方案评估：对比不同医美方案" data-onclick="details"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">方案评估</text>
    </g>
    
    <!-- 节点4: 风险评估 -->
    <g transform="translate(150, -100)">
      <rect x="-60" y="-30" width="120" height="60" rx="30" fill="url(#process-grad4)" filter="url(#shadow)" data-interactive="true" data-tooltip="风险评估：评估潜在风险和后果" data-onclick="details"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">风险评估</text>
    </g>
    
    <!-- 节点5: 决策制定 -->
    <g transform="translate(300, 0)">
      <rect x="-60" y="-30" width="120" height="60" rx="30" fill="url(#process-grad1)" filter="url(#shadow)" data-interactive="true" data-tooltip="决策制定：做出最终医美决策" data-onclick="details"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">决策制定</text>
    </g>
    
    <!-- 节点6: 实施体验 -->
    <g transform="translate(150, 100)">
      <rect x="-60" y="-30" width="120" height="60" rx="30" fill="url(#process-grad2)" filter="url(#shadow)" data-interactive="true" data-tooltip="实施体验：接受医美服务体验" data-onclick="details"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">实施体验</text>
    </g>
    
    <!-- 节点7: 效果评估 -->
    <g transform="translate(0, 200)">
      <rect x="-60" y="-30" width="120" height="60" rx="30" fill="url(#process-grad3)" filter="url(#shadow)" data-interactive="true" data-tooltip="效果评估：评估医美效果满意度" data-onclick="details"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">效果评估</text>
    </g>
    
    <!-- 节点8: 后续维护 -->
    <g transform="translate(-150, 100)">
      <rect x="-60" y="-30" width="120" height="60" rx="30" fill="url(#process-grad4)" filter="url(#shadow)" data-interactive="true" data-tooltip="后续维护：长期效果维护和管理" data-onclick="details"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">后续维护</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -240 -170 Q -195 -135 -150 -130" stroke="#667eea" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M -90 -70 Q -45 -35 0 -30" stroke="#667eea" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 60 -30 Q 105 -65 150 -70" stroke="#667eea" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 210 -70 Q 255 -35 300 -30" stroke="#667eea" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 300 30 Q 255 65 210 70" stroke="#667eea" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 90 130 Q 45 165 0 170" stroke="#667eea" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M -60 200 Q -105 165 -150 130" stroke="#667eea" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- 反馈循环 -->
    <path d="M -210 100 Q -330 0 -300 -170" stroke="#f5576c" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="-330" y="0" font-family="Arial, sans-serif" font-size="12" fill="#f5576c">反馈循环</text>
  </g>
  
  <!-- 阶段说明 -->
  <g transform="translate(50, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">决策阶段特征：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 认知阶段：产生需求，初步了解</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 评估阶段：信息收集，方案对比</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 决策阶段：风险评估，最终选择</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 体验阶段：实施过程，效果评估</text>
  </g>
  
  <!-- 影响因素 -->
  <g transform="translate(600, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">关键影响因素：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 个人因素：年龄、性别、收入</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 社会因素：文化、媒体、社交</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 心理因素：动机、态度、风险认知</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 经济因素：价格、预算、价值</text>
  </g>
  
  <!-- 动画效果 -->
  <animateTransform
    attributeName="transform"
    attributeType="XML"
    type="scale"
    values="0.95;1.05;0.95"
    dur="4s"
    repeatCount="indefinite"
    additive="sum"
    begin="0s"
    xlink:href="#decision-process"/>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各节点查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>