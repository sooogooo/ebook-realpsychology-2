<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 数据分析方法图 -->
  <defs>
    <linearGradient id="data-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="data-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="data-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="data-grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="data-grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    数据分析方法图
  </text>
  
  <!-- 数据类型分类 -->
  <g transform="translate(200, 150)">
    <rect x="-80" y="-30" width="160" height="60" rx="30" fill="url(#data-grad1)" filter="url(#shadow)" data-interactive="true" data-tooltip="定量数据：数值型、可测量、统计分析" data-onclick="details"/>
    <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">定量数据</text>
    <text y="-50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">数值型数据</text>
  </g>
  
  <g transform="translate(600, 150)">
    <rect x="-80" y="-30" width="160" height="60" rx="30" fill="url(#data-grad2)" filter="url(#shadow)" data-interactive="true" data-tooltip="定性数据：描述型、主题分析、内容分析" data-onclick="details"/>
    <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">定性数据</text>
    <text y="-50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">描述型数据</text>
  </g>
  
  <!-- 分析方法 -->
  <g transform="translate(400, 300)">
    <!-- 定量分析方法 -->
    <g transform="translate(-250, 0)">
      <rect x="-70" y="-80" width="140" height="160" rx="10" fill="white" stroke="#3498db" stroke-width="2" filter="url(#shadow)"/>
      <text y="-60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">定量分析</text>
      
      <text y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">描述统计</text>
      <text y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">推论统计</text>
      <text y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">相关分析</text>
      <text y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">回归分析</text>
      <text y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">方差分析</text>
      <text y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">因子分析</text>
    </g>
    
    <!-- 定性分析方法 -->
    <g transform="translate(250, 0)">
      <rect x="-70" y="-80" width="140" height="160" rx="10" fill="white" stroke="#e74c3c" stroke-width="2" filter="url(#shadow)"/>
      <text y="-60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">定性分析</text>
      
      <text y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">内容分析</text>
      <text y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">主题分析</text>
      <text y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">扎根理论</text>
      <text y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">叙事分析</text>
      <text y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">话语分析</text>
      <text y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">现象分析</text>
    </g>
    
    <!-- 混合分析方法 -->
    <g transform="translate(0, 0)">
      <rect x="-70" y="-80" width="140" height="160" rx="10" fill="white" stroke="#9b59b6" stroke-width="2" filter="url(#shadow)"/>
      <text y="-60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9b59b6">混合分析</text>
      
      <text y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">数据转换</text>
      <text y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">方法整合</text>
      <text y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">结果验证</text>
      <text y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">多维解释</text>
      <text y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">互补分析</text>
      <text y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">综合判断</text>
    </g>
  </g>
  
  <!-- 连接线 -->
  <path d="M 200 180 L 150 220" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 600 180 L 650 220" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 400 180 L 400 220" stroke="#9b59b6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 数据处理流程 -->
  <g transform="translate(400, 500)">
    <rect x="-300" y="-25" width="100" height="50" rx="25" fill="url(#data-grad3)" filter="url(#shadow)"/>
    <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">数据收集</text>
    
    <rect x="-150" y="-25" width="100" height="50" rx="25" fill="url(#data-grad4)" filter="url(#shadow)"/>
    <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">数据清洗</text>
    
    <rect x="0" y="-25" width="100" height="50" rx="25" fill="url(#data-grad5)" filter="url(#shadow)"/>
    <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">数据分析</text>
    
    <rect x="150" y="-25" width="100" height="50" rx="25" fill="url(#data-grad1)" filter="url(#shadow)"/>
    <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">结果解释</text>
    
    <!-- 流程箭头 -->
    <path d="M -200 475 L -250 475" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M -50 475 L -100 475" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 100 475 L 50 475" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- 应用说明 -->
  <g transform="translate(50, 50)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">医美研究应用：</text>
    <text y="15" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">• 消费者满意度统计分析</text>
    <text y="30" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">• 治疗效果定性评估</text>
    <text y="45" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">• 市场趋势混合研究</text>
  </g>
  
  <!-- 工具说明 -->
  <g transform="translate(600, 50)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">分析工具：</text>
    <text y="15" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">• SPSS、R、Python</text>
    <text y="30" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">• NVivo、Atlas.ti</text>
    <text y="45" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">• Excel、Tableau</text>
  </g>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各方法查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>