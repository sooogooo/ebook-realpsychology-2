<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 证据评估框架 -->
  <defs>
    <linearGradient id="evidence-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="evidence-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="evidence-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1c40f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="evidence-grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="evidence-grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    证据评估框架
  </text>
  
  <!-- 证据等级金字塔 -->
  <g transform="translate(400, 320)">
    <!-- 第5级：专家意见 -->
    <g transform="translate(0, 120)">
      <polygon points="-120,30 120,30 100,-30 -100,-30" fill="url(#evidence-grad1)" filter="url(#shadow)" data-interactive="true" data-tooltip="第5级：专家意见、个人经验、案例报告" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">专家意见</text>
      <text y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">第5级证据</text>
    </g>
    
    <!-- 第4级：病例系列 -->
    <g transform="translate(0, 60)">
      <polygon points="-100,-30 100,-30 80,-90 -80,-90" fill="url(#evidence-grad2)" filter="url(#shadow)" data-interactive="true" data-tooltip="第4级：病例系列研究、生态学研究" data-onclick="details"/>
      <text y="-55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">病例系列</text>
      <text y="-75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">第4级证据</text>
    </g>
    
    <!-- 第3级：病例对照 -->
    <g transform="translate(0, 0)">
      <polygon points="-80,-90 80,-90 60,-150 -60,-150" fill="url(#evidence-grad3)" filter="url(#shadow)" data-interactive="true" data-tooltip="第3级：病例对照研究、横断面研究" data-onclick="details"/>
      <text y="-115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">病例对照</text>
      <text y="-135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">第3级证据</text>
    </g>
    
    <!-- 第2级：队列研究 -->
    <g transform="translate(0, -60)">
      <polygon points="-60,-150 60,-150 40,-210 -40,-210" fill="url(#evidence-grad4)" filter="url(#shadow)" data-interactive="true" data-tooltip="第2级：队列研究、随机对照试验" data-onclick="details"/>
      <text y="-175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">队列研究</text>
      <text y="-195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">第2级证据</text>
    </g>
    
    <!-- 第1级：系统评价 -->
    <g transform="translate(0, -120)">
      <polygon points="-40,-210 40,-210 20,-270 -20,-270" fill="url(#evidence-grad5)" filter="url(#shadow)" data-interactive="true" data-tooltip="第1级：系统评价、Meta分析" data-onclick="details"/>
      <text y="-235" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">系统评价</text>
      <text y="-255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">第1级证据</text>
    </g>
  </g>
  
  <!-- 评估维度 -->
  <g transform="translate(100, 150)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">评估维度：</text>
    
    <g transform="translate(0, 30)">
      <circle r="8" fill="#e74c3c"/>
      <text x="20" y="5" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">研究设计质量</text>
    </g>
    
    <g transform="translate(0, 55)">
      <circle r="8" fill="#f39c12"/>
      <text x="20" y="5" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">样本代表性</text>
    </g>
    
    <g transform="translate(0, 80)">
      <circle r="8" fill="#f1c40f"/>
      <text x="20" y="5" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">数据完整性</text>
    </g>
    
    <g transform="translate(0, 105)">
      <circle r="8" fill="#2ecc71"/>
      <text x="20" y="5" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">结果一致性</text>
    </g>
    
    <g transform="translate(0, 130)">
      <circle r="8" fill="#3498db"/>
      <text x="20" y="5" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">临床相关性</text>
    </g>
  </g>
  
  <!-- 应用领域 -->
  <g transform="translate(550, 150)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">医美应用：</text>
    
    <text y="25" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 治疗效果评估</text>
    <text y="45" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 安全性分析</text>
    <text y="65" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 技术比较研究</text>
    <text y="85" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 满意度调查</text>
    <text y="105" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 成本效果分析</text>
  </g>
  
  <!-- 评估标准 -->
  <g transform="translate(50, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">评估标准：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 内部效度：研究结果的可靠性</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 外部效度：结果的推广应用性</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 统计效度：统计分析的准确性</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 构念效度：理论构建的科学性</text>
  </g>
  
  <!-- 批判性思考要点 -->
  <g transform="translate(450, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">批判性思考：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 识别潜在偏倚</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 评估方法局限性</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 考虑替代解释</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 权衡利弊得失</text>
  </g>
  
  <!-- 动态效果 -->
  <rect x="380" y="50" width="40" height="10" fill="#3498db" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各等级查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>