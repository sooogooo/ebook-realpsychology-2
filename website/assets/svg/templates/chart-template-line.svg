<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <title>Line Chart Template</title>
  <desc>Template for line charts with trend analysis</desc>

  <!-- Background -->
  <rect width="600" height="400" fill="#F7FAFC"/>

  <!-- Title area -->
  <text x="300" y="35" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#2D3748">
    Trend Analysis Chart
  </text>
  <text x="300" y="55" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#4A5568">
    Temporal Data Visualization
  </text>

  <!-- Chart area -->
  <g id="chart-area" transform="translate(80, 80)">
    <!-- Chart background -->
    <rect x="0" y="0" width="440" height="240" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>

    <!-- Y-axis -->
    <line x1="0" y1="0" x2="0" y2="240" stroke="#4A5568" stroke-width="1"/>

    <!-- X-axis -->
    <line x1="0" y1="240" x2="440" y2="240" stroke="#4A5568" stroke-width="1"/>

    <!-- Y-axis labels and grid lines -->
    <g font-family="JetBrains Mono, SF Mono, monospace" font-size="8" fill="#718096">
      <!-- 100 -->
      <text x="-10" y="5" text-anchor="end">100</text>
      <line x1="0" y1="0" x2="440" y2="0" stroke="#E2E8F0" stroke-width="0.5"/>

      <!-- 80 -->
      <text x="-10" y="53" text-anchor="end">80</text>
      <line x1="0" y1="48" x2="440" y2="48" stroke="#E2E8F0" stroke-width="0.5"/>

      <!-- 60 -->
      <text x="-10" y="101" text-anchor="end">60</text>
      <line x1="0" y1="96" x2="440" y2="96" stroke="#E2E8F0" stroke-width="0.5"/>

      <!-- 40 -->
      <text x="-10" y="149" text-anchor="end">40</text>
      <line x1="0" y1="144" x2="440" y2="144" stroke="#E2E8F0" stroke-width="0.5"/>

      <!-- 20 -->
      <text x="-10" y="197" text-anchor="end">20</text>
      <line x1="0" y1="192" x2="440" y2="192" stroke="#E2E8F0" stroke-width="0.5"/>

      <!-- 0 -->
      <text x="-10" y="245" text-anchor="end">0</text>
    </g>

    <!-- X-axis labels (time periods) -->
    <g font-family="Inter, Arial, sans-serif" font-size="9" fill="#2D3748">
      <text x="40" y="255" text-anchor="middle">2019</text>
      <text x="110" y="255" text-anchor="middle">2020</text>
      <text x="180" y="255" text-anchor="middle">2021</text>
      <text x="250" y="255" text-anchor="middle">2022</text>
      <text x="320" y="255" text-anchor="middle">2023</text>
      <text x="390" y="255" text-anchor="middle">2024</text>
    </g>

    <!-- Data lines -->
    <g id="data-lines">
      <!-- Line 1: Primary trend -->
      <polyline points="40,192 110,168 180,144 250,120 320,96 390,72"
                fill="none" stroke="#2D3748" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- Data points for line 1 -->
      <g fill="#2D3748">
        <circle cx="40" cy="192" r="3"/>
        <circle cx="110" cy="168" r="3"/>
        <circle cx="180" cy="144" r="3"/>
        <circle cx="250" cy="120" r="3"/>
        <circle cx="320" cy="96" r="3"/>
        <circle cx="390" cy="72" r="3"/>
      </g>

      <!-- Line 2: Secondary trend -->
      <polyline points="40,216 110,192 180,180 250,168 320,156 390,144"
                fill="none" stroke="#48BB78" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- Data points for line 2 -->
      <g fill="#48BB78">
        <circle cx="40" cy="216" r="3"/>
        <circle cx="110" cy="192" r="3"/>
        <circle cx="180" cy="180" r="3"/>
        <circle cx="250" cy="168" r="3"/>
        <circle cx="320" cy="156" r="3"/>
        <circle cx="390" cy="144" r="3"/>
      </g>

      <!-- Line 3: Tertiary trend -->
      <polyline points="40,180 110,156 180,168 250,156 320,144 390,120"
                fill="none" stroke="#ED8936" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5,3"/>

      <!-- Data points for line 3 -->
      <g fill="#ED8936">
        <circle cx="40" cy="180" r="3"/>
        <circle cx="110" cy="156" r="3"/>
        <circle cx="180" cy="168" r="3"/>
        <circle cx="250" cy="156" r="3"/>
        <circle cx="320" cy="144" r="3"/>
        <circle cx="390" cy="120" r="3"/>
      </g>
    </g>

    <!-- Trend indicators (arrows showing overall direction) -->
    <defs>
      <marker id="trend-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4A5568" opacity="0.6"/>
      </marker>
    </defs>

    <!-- Trend lines -->
    <g stroke="#4A5568" stroke-width="0.5" fill="none" marker-end="url(#trend-arrow)" opacity="0.4">
      <line x1="40" y1="200" x2="390" y2="80"/>
    </g>
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(440, 100)">
    <rect x="0" y="0" width="130" height="80" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="0.5" rx="3"/>
    <text x="65" y="15" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" fill="#2D3748">
      Legend
    </text>

    <!-- Line 1 -->
    <line x1="10" y1="30" x2="30" y2="30" stroke="#2D3748" stroke-width="1.5"/>
    <circle cx="20" cy="30" r="3" fill="#2D3748"/>
    <text x="35" y="34" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">Primary Metric</text>

    <!-- Line 2 -->
    <line x1="10" y1="45" x2="30" y2="45" stroke="#48BB78" stroke-width="1.5"/>
    <circle cx="20" cy="45" r="3" fill="#48BB78"/>
    <text x="35" y="49" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">Secondary Metric</text>

    <!-- Line 3 -->
    <line x1="10" y1="60" x2="30" y2="60" stroke="#ED8936" stroke-width="1.5" stroke-dasharray="5,3"/>
    <circle cx="20" cy="60" r="3" fill="#ED8936"/>
    <text x="35" y="64" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">Tertiary Metric</text>
  </g>

  <!-- Key insights -->
  <g transform="translate(50, 360)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" fill="#2D3748">
      Key Trends:
    </text>
    <text x="0" y="12" font-family="Inter, Arial, sans-serif" font-size="7" fill="#4A5568">
      • Primary metric shows consistent growth over time
    </text>
    <text x="0" y="22" font-family="Inter, Arial, sans-serif" font-size="7" fill="#4A5568">
      • Secondary metric demonstrates steady improvement
    </text>
    <text x="0" y="32" font-family="Inter, Arial, sans-serif" font-size="7" fill="#4A5568">
      • Tertiary metric shows variable pattern
    </text>
  </g>

  <!-- Statistical note -->
  <g transform="translate(320, 360)">
    <text x="0" y="0" font-family="JetBrains Mono, SF Mono, monospace" font-size="7" fill="#718096">
      R² = 0.894 | p < 0.001 | CI: [0.82, 0.97]
    </text>
  </g>

  <!-- Customization guide (hidden by default) -->
  <g id="customization-guide" opacity="0.1">
    <rect x="200" y="100" width="180" height="100" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="0.5" rx="3"/>
    <text x="210" y="115" font-family="Inter, Arial, sans-serif" font-size="7" font-weight="500" fill="#718096">
      Customization Guide:
    </text>
    <text x="210" y="125" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Update polyline points for new data
    </text>
    <text x="210" y="135" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Modify Y-axis scale as needed
    </text>
    <text x="210" y="145" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Change time period labels on X-axis
    </text>
    <text x="210" y="155" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Add/remove data lines as required
    </text>
    <text x="210" y="165" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Update legend entries accordingly
    </text>
    <text x="210" y="175" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Modify statistical indicators
    </text>
    <text x="210" y="185" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Adjust trend analysis arrows
    </text>
  </g>
</svg>