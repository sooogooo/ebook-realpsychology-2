<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <title>Process Flow Diagram Template</title>
  <desc>Template for decision-making process flow diagrams</desc>

  <!-- Background -->
  <rect width="800" height="600" fill="#F7FAFC"/>

  <!-- Title area -->
  <text x="400" y="35" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="300" fill="#2D3748">
    Decision-Making Process Flow
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#4A5568">
    Sequential Process Analysis
  </text>

  <!-- Main flow area -->
  <g id="process-flow" transform="translate(400, 300)">
    <!-- Arrow definitions -->
    <defs>
      <marker id="flow-arrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
        <polygon points="0 0, 12 4, 0 8" fill="#4A5568" opacity="0.7"/>
      </marker>
      <marker id="decision-arrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
        <polygon points="0 0, 12 4, 0 8" fill="#ED8936" opacity="0.7"/>
      </marker>
    </defs>

    <!-- Start node -->
    <g id="start-node" transform="translate(0, -200)">
      <ellipse cx="0" cy="0" rx="60" ry="25" fill="none" stroke="#48BB78" stroke-width="1.5"/>
      <text x="0" y="0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#2D3748">
        Start
      </text>
      <text x="0" y="12" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9" fill="#4A5568">
        Initial State
      </text>
    </g>

    <!-- Process 1 -->
    <g id="process-1" transform="translate(0, -120)">
      <rect x="-70" y="-25" width="140" height="50" fill="none" stroke="#2D3748" stroke-width="1" rx="4"/>
      <text x="0" y="-5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#2D3748">
        Information Gathering
      </text>
      <text x="0" y="8" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9" fill="#4A5568">
        Research & Analysis
      </text>
    </g>

    <!-- Decision 1 -->
    <g id="decision-1" transform="translate(0, -40)">
      <path d="M 0,-30 L 50,0 L 0,30 L -50,0 Z" fill="none" stroke="#ED8936" stroke-width="1"/>
      <text x="0" y="-5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#2D3748">
        Decision
      </text>
      <text x="0" y="8" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
        Sufficient Data?
      </text>
    </g>

    <!-- Process 2A (Yes branch) -->
    <g id="process-2a" transform="translate(-120, 40)">
      <rect x="-60" y="-20" width="120" height="40" fill="none" stroke="#48BB78" stroke-width="1" rx="4"/>
      <text x="0" y="-3" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#2D3748">
        Analysis
      </text>
      <text x="0" y="10" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
        Evaluate Options
      </text>
    </g>

    <!-- Process 2B (No branch) -->
    <g id="process-2b" transform="translate(120, 40)">
      <rect x="-60" y="-20" width="120" height="40" fill="none" stroke="#4A5568" stroke-width="1" rx="4"/>
      <text x="0" y="-3" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#2D3748">
        Additional
      </text>
      <text x="0" y="10" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
        Research Needed
      </text>
    </g>

    <!-- Decision 2 -->
    <g id="decision-2" transform="translate(-120, 120)">
      <path d="M 0,-25 L 40,0 L 0,25 L -40,0 Z" fill="none" stroke="#ED8936" stroke-width="1"/>
      <text x="0" y="-3" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" fill="#2D3748">
        Risk
      </text>
      <text x="0" y="8" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
        Acceptable?
      </text>
    </g>

    <!-- Process 3 (Final Decision) -->
    <g id="process-3" transform="translate(-120, 200)">
      <rect x="-70" y="-25" width="140" height="50" fill="none" stroke="#48BB78" stroke-width="1" rx="4"/>
      <text x="0" y="-5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#2D3748">
        Decision Made
      </text>
      <text x="0" y="8" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9" fill="#4A5568">
        Commit to Action
      </text>
    </g>

    <!-- Process 4 (Re-evaluation) -->
    <g id="process-4" transform="translate(120, 120)">
      <rect x="-60" y="-20" width="120" height="40" fill="none" stroke="#4A5568" stroke-width="1" rx="4"/>
      <text x="0" y="-3" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#2D3748">
        Re-evaluate
      </text>
      <text x="0" y="10" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
        Consider Alternatives
      </text>
    </g>

    <!-- End node -->
    <g id="end-node" transform="translate(-120, 280)">
      <ellipse cx="0" cy="0" rx="60" ry="25" fill="none" stroke="#ED8936" stroke-width="1.5"/>
      <text x="0" y="0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#2D3748">
        End
      </text>
      <text x="0" y="12" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9" fill="#4A5568">
        Final Outcome
      </text>
    </g>

    <!-- Flow arrows -->
    <g stroke="#4A5568" stroke-width="1" fill="none" marker-end="url(#flow-arrow)">
      <!-- Start to Process 1 -->
      <line x1="0" y1="-175" x2="0" y2="-145"/>

      <!-- Process 1 to Decision 1 -->
      <line x1="0" y1="-95" x2="0" y2="-70"/>

      <!-- Decision 1 to Process 2A (Yes) -->
      <line x1="-25" y1="-20" x2="-95" y2="20"/>
      <text x="-60" y="0" font-family="Inter, Arial, sans-serif" font-size="8" fill="#48BB78">Yes</text>

      <!-- Decision 1 to Process 2B (No) -->
      <line x1="25" y1="-20" x2="95" y2="20"/>
      <text x="60" y="0" font-family="Inter, Arial, sans-serif" font-size="8" fill="#ED8936">No</text>

      <!-- Process 2A to Decision 2 -->
      <line x1="-120" y1="60" x2="-120" y2="95"/>

      <!-- Decision 2 to Process 3 (Yes) -->
      <line x1="-120" y1="145" x2="-120" y2="175"/>
      <text x="-100" y="160" font-family="Inter, Arial, sans-serif" font-size="8" fill="#48BB78">Yes</text>

      <!-- Decision 2 to Process 4 (No) -->
      <line x1="-80" y1="120" x2="60" y2="120"/>
      <text x="-10" y="115" font-family="Inter, Arial, sans-serif" font-size="8" fill="#ED8936">No</text>

      <!-- Process 3 to End -->
      <line x1="-120" y1="225" x2="-120" y2="255"/>

      <!-- Process 4 back to Process 1 -->
      <path d="M 120,140 Q 200,0 0,-95" stroke-dasharray="3,3"/>
      <text x="160" y="80" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">Loop</text>
    </g>
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(50, 520)">
    <rect x="0" y="0" width="200" height="60" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="0.5" rx="3"/>
    <text x="100" y="15" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#2D3748">
      Process Elements
    </text>

    <!-- Start/End -->
    <ellipse cx="20" cy="30" rx="15" ry="8" fill="none" stroke="#48BB78" stroke-width="1"/>
    <text x="40" y="33" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">Start/End Point</text>

    <!-- Process -->
    <rect x="110" y="25" width="20" height="10" fill="none" stroke="#2D3748" stroke-width="1" rx="1"/>
    <text x="135" y="33" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">Process Step</text>

    <!-- Decision -->
    <path d="M 20,45 L 27,50 L 20,55 L 13,50 Z" fill="none" stroke="#ED8936" stroke-width="1"/>
    <text x="35" y="53" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">Decision Point</text>

    <!-- Flow direction -->
    <line x1="110" y1="50" x2="130" y2="50" stroke="#4A5568" stroke-width="1" marker-end="url(#flow-arrow)"/>
    <text x="135" y="53" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">Flow Direction</text>
  </g>

  <!-- Process summary -->
  <g transform="translate(600, 520)">
    <rect x="0" y="0" width="150" height="60" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="0.5" rx="3"/>
    <text x="75" y="15" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#2D3748">
      Process Summary
    </text>
    <text x="75" y="30" text-anchor="middle" font-family="JetBrains Mono, SF Mono, monospace" font-size="8" fill="#4A5568">
      5 Process Steps
    </text>
    <text x="75" y="42" text-anchor="middle" font-family="JetBrains Mono, SF Mono, monospace" font-size="8" fill="#4A5568">
      2 Decision Points
    </text>
    <text x="75" y="54" text-anchor="middle" font-family="JetBrains Mono, SF Mono, monospace" font-size="8" fill="#4A5568">
      1 Feedback Loop
    </text>
  </g>

  <!-- Customization guide (hidden by default) -->
  <g id="customization-guide" opacity="0.1">
    <rect x="600" y="100" width="180" height="120" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="0.5" rx="3"/>
    <text x="610" y="115" font-family="Inter, Arial, sans-serif" font-size="7" font-weight="500" fill="#718096">
      Customization Guide:
    </text>
    <text x="610" y="125" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Modify text in process nodes
    </text>
    <text x="610" y="135" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Add/remove decision points
    </text>
    <text x="610" y="145" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Adjust flow paths and arrows
    </text>
    <text x="610" y="155" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Change branch labels (Yes/No)
    </text>
    <text x="610" y="165" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Update process summary
    </text>
    <text x="610" y="175" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Modify colors for different states
    </text>
    <text x="610" y="185" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Add parallel processes if needed
    </text>
    <text x="610" y="195" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Include timing information
    </text>
    <text x="610" y="205" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Add success criteria indicators
    </text>
  </g>
</svg>