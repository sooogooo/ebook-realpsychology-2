<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <title>Bar Chart Template</title>
  <desc>Template for bar charts with minimalist design</desc>

  <!-- Background -->
  <rect width="600" height="400" fill="#F7FAFC"/>

  <!-- Title area -->
  <text x="300" y="35" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#2D3748">
    Data Visualization Chart
  </text>
  <text x="300" y="55" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#4A5568">
    Quantitative Analysis Results
  </text>

  <!-- Chart area -->
  <g id="chart-area" transform="translate(80, 80)">
    <!-- Chart background -->
    <rect x="0" y="0" width="440" height="240" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>

    <!-- Y-axis -->
    <line x1="0" y1="0" x2="0" y2="240" stroke="#4A5568" stroke-width="1"/>

    <!-- X-axis -->
    <line x1="0" y1="240" x2="440" y2="240" stroke="#4A5568" stroke-width="1"/>

    <!-- Y-axis labels and grid lines -->
    <g font-family="JetBrains Mono, SF Mono, monospace" font-size="8" fill="#718096">
      <!-- 100% -->
      <text x="-10" y="5" text-anchor="end">100%</text>
      <line x1="0" y1="0" x2="440" y2="0" stroke="#E2E8F0" stroke-width="0.5"/>

      <!-- 80% -->
      <text x="-10" y="53" text-anchor="end">80%</text>
      <line x1="0" y1="48" x2="440" y2="48" stroke="#E2E8F0" stroke-width="0.5"/>

      <!-- 60% -->
      <text x="-10" y="101" text-anchor="end">60%</text>
      <line x1="0" y1="96" x2="440" y2="96" stroke="#E2E8F0" stroke-width="0.5"/>

      <!-- 40% -->
      <text x="-10" y="149" text-anchor="end">40%</text>
      <line x1="0" y1="144" x2="440" y2="144" stroke="#E2E8F0" stroke-width="0.5"/>

      <!-- 20% -->
      <text x="-10" y="197" text-anchor="end">20%</text>
      <line x1="0" y1="192" x2="440" y2="192" stroke="#E2E8F0" stroke-width="0.5"/>

      <!-- 0% -->
      <text x="-10" y="245" text-anchor="end">0%</text>
    </g>

    <!-- Sample bars -->
    <g id="bars">
      <!-- Bar 1 -->
      <rect x="30" y="72" width="60" height="168" fill="#2D3748" fill-opacity="0.8"/>
      <text x="60" y="65" text-anchor="middle" font-family="JetBrains Mono, SF Mono, monospace" font-size="8" fill="#2D3748">70%</text>

      <!-- Bar 2 -->
      <rect x="120" y="48" width="60" height="192" fill="#48BB78" fill-opacity="0.8"/>
      <text x="150" y="41" text-anchor="middle" font-family="JetBrains Mono, SF Mono, monospace" font-size="8" fill="#48BB78">80%</text>

      <!-- Bar 3 -->
      <rect x="210" y="96" width="60" height="144" fill="#ED8936" fill-opacity="0.8"/>
      <text x="240" y="89" text-anchor="middle" font-family="JetBrains Mono, SF Mono, monospace" font-size="8" fill="#ED8936">60%</text>

      <!-- Bar 4 -->
      <rect x="300" y="120" width="60" height="120" fill="#4A5568" fill-opacity="0.8"/>
      <text x="330" y="113" text-anchor="middle" font-family="JetBrains Mono, SF Mono, monospace" font-size="8" fill="#4A5568">50%</text>

      <!-- Bar 5 -->
      <rect x="390" y="144" width="60" height="96" fill="#2D3748" fill-opacity="0.8"/>
      <text x="420" y="137" text-anchor="middle" font-family="JetBrains Mono, SF Mono, monospace" font-size="8" fill="#2D3748">40%</text>
    </g>

    <!-- X-axis labels -->
    <g font-family="Inter, Arial, sans-serif" font-size="9" fill="#2D3748">
      <text x="60" y="255" text-anchor="middle">Category A</text>
      <text x="150" y="255" text-anchor="middle">Category B</text>
      <text x="240" y="255" text-anchor="middle">Category C</text>
      <text x="330" y="255" text-anchor="middle">Category D</text>
      <text x="420" y="255" text-anchor="middle">Category E</text>
    </g>

    <!-- Sub-labels -->
    <g font-family="Inter, Arial, sans-serif" font-size="7" fill="#718096">
      <text x="60" y="267" text-anchor="middle">Description</text>
      <text x="150" y="267" text-anchor="middle">Description</text>
      <text x="240" y="267" text-anchor="middle">Description</text>
      <text x="330" y="267" text-anchor="middle">Description</text>
      <text x="420" y="267" text-anchor="middle">Description</text>
    </g>
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(450, 340)">
    <rect x="0" y="0" width="130" height="50" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="0.5" rx="3"/>
    <text x="65" y="15" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" fill="#2D3748">
      Legend
    </text>

    <rect x="10" y="25" width="15" height="8" fill="#2D3748" fill-opacity="0.8"/>
    <text x="30" y="32" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">Primary Data</text>

    <rect x="10" y="37" width="15" height="8" fill="#48BB78" fill-opacity="0.8"/>
    <text x="30" y="44" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">Secondary Data</text>
  </g>

  <!-- Statistical note -->
  <g transform="translate(50, 360)">
    <text x="0" y="0" font-family="JetBrains Mono, SF Mono, monospace" font-size="7" fill="#718096">
      n = 1,247 participants | Margin of error: ±3% | Confidence level: 95%
    </text>
  </g>

  <!-- Customization guide (hidden by default) -->
  <g id="customization-guide" opacity="0.1">
    <rect x="200" y="100" width="180" height="100" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="0.5" rx="3"/>
    <text x="210" y="115" font-family="Inter, Arial, sans-serif" font-size="7" font-weight="500" fill="#718096">
      Customization Guide:
    </text>
    <text x="210" y="125" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Modify bar heights in 'bars' group
    </text>
    <text x="210" y="135" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Update values in percentage labels
    </text>
    <text x="210" y="145" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Change colors to match data type
    </text>
    <text x="210" y="155" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Update category labels as needed
    </text>
    <text x="210" y="165" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Adjust statistical note in footer
    </text>
    <text x="210" y="175" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Add/remove bars for different datasets
    </text>
    <text x="210" y="185" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Modify legend entries as required
    </text>
  </g>
</svg>