<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <title>Concept Diagram Template</title>
  <desc>Template for psychological theory conceptual diagrams</desc>

  <!-- Background -->
  <rect width="600" height="400" fill="#F7FAFC"/>

  <!-- Title area -->
  <text x="300" y="35" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#2D3748">
    Theory Concept Framework
  </text>
  <text x="300" y="55" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#4A5568">
    Psychological Theory Model
  </text>

  <!-- Main framework area -->
  <g id="main-framework" transform="translate(300, 200)">
    <!-- Central core concept -->
    <g id="core-concept">
      <circle cx="0" cy="0" r="40" fill="none" stroke="#2D3748" stroke-width="1"/>
      <circle cx="0" cy="0" r="35" fill="none" stroke="#4A5568" stroke-width="0.5" stroke-dasharray="2,2"/>
      <text x="0" y="0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#2D3748">
        Core
      </text>
      <text x="0" y="15" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9" fill="#4A5568">
        Concept
      </text>
    </g>

    <!-- Primary supporting concepts -->
    <g id="primary-concepts">
      <!-- Top concept -->
      <g transform="translate(0, -100)">
        <rect x="-40" y="-20" width="80" height="40" fill="none" stroke="#48BB78" stroke-width="1" rx="4"/>
        <text x="0" y="0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#2D3748">
          Concept A
        </text>
        <text x="0" y="12" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
          Primary Factor
        </text>
      </g>

      <!-- Right concept -->
      <g transform="translate(100, 0)">
        <rect x="-40" y="-20" width="80" height="40" fill="none" stroke="#ED8936" stroke-width="1" rx="4"/>
        <text x="0" y="0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#2D3748">
          Concept B
        </text>
        <text x="0" y="12" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
          Key Variable
        </text>
      </g>

      <!-- Bottom concept -->
      <g transform="translate(0, 100)">
        <rect x="-40" y="-20" width="80" height="40" fill="none" stroke="#2D3748" stroke-width="1" rx="4"/>
        <text x="0" y="0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#2D3748">
          Concept C
        </text>
        <text x="0" y="12" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
          Supporting
        </text>
      </g>

      <!-- Left concept -->
      <g transform="translate(-100, 0)">
        <rect x="-40" y="-20" width="80" height="40" fill="none" stroke="#4A5568" stroke-width="1" rx="4"/>
        <text x="0" y="0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#2D3748">
          Concept D
        </text>
        <text x="0" y="12" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
          Secondary
        </text>
      </g>
    </g>

    <!-- Connection lines -->
    <g id="connections" stroke="#4A5568" stroke-width="0.75" fill="none">
      <!-- Primary connections (solid) -->
      <line x1="0" y1="-40" x2="0" y2="-80"/>
      <line x1="40" y1="0" x2="60" y2="0"/>
      <line x1="0" y1="40" x2="0" y2="80"/>
      <line x1="-40" y1="0" x2="-60" y2="0"/>

      <!-- Secondary connections (dashed) -->
      <g stroke-dasharray="3,3" opacity="0.6">
        <line x1="30" y1="-70" x2="70" y2="-30"/>
        <line x1="70" y1="30" x2="30" y2="70"/>
        <line x1="-30" y1="70" x2="-70" y2="30"/>
        <line x1="-70" y1="-30" x2="-30" y2="-70"/>
      </g>
    </g>

    <!-- Secondary supporting elements -->
    <g id="secondary-elements">
      <!-- Diagonal elements -->
      <g transform="translate(70, -70)">
        <circle cx="0" cy="0" r="15" fill="none" stroke="#48BB78" stroke-width="0.5" stroke-dasharray="1,1"/>
        <text x="0" y="0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
          Factor 1
        </text>
      </g>

      <g transform="translate(70, 70)">
        <circle cx="0" cy="0" r="15" fill="none" stroke="#ED8936" stroke-width="0.5" stroke-dasharray="1,1"/>
        <text x="0" y="0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
          Factor 2
        </text>
      </g>

      <g transform="translate(-70, 70)">
        <circle cx="0" cy="0" r="15" fill="none" stroke="#2D3748" stroke-width="0.5" stroke-dasharray="1,1"/>
        <text x="0" y="0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
          Factor 3
        </text>
      </g>

      <g transform="translate(-70, -70)">
        <circle cx="0" cy="0" r="15" fill="none" stroke="#4A5568" stroke-width="0.5" stroke-dasharray="1,1"/>
        <text x="0" y="0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
          Factor 4
        </text>
      </g>
    </g>
  </g>

  <!-- Legend/Key area -->
  <g id="legend" transform="translate(50, 350)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#2D3748">
      Legend:
    </text>

    <!-- Core concept -->
    <circle cx="10" cy="15" r="6" fill="none" stroke="#2D3748" stroke-width="1"/>
    <text x="25" y="18" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
      Core Concept
    </text>

    <!-- Primary concept -->
    <rect x="115" y="10" width="15" height="10" fill="none" stroke="#48BB78" stroke-width="1" rx="1"/>
    <text x="135" y="18" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
      Primary Concept
    </text>

    <!-- Secondary element -->
    <circle cx="235" cy="15" r="6" fill="none" stroke="#4A5568" stroke-width="0.5" stroke-dasharray="1,1"/>
    <text x="250" y="18" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
      Secondary Element
    </text>

    <!-- Strong connection -->
    <line x1="355" y1="15" x2="375" y2="15" stroke="#4A5568" stroke-width="0.75"/>
    <text x="380" y="18" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
      Strong Connection
    </text>

    <!-- Weak connection -->
    <line x1="475" y1="15" x2="495" y2="15" stroke="#4A5568" stroke-width="0.75" stroke-dasharray="3,3"/>
    <text x="500" y="18" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
      Weak Connection
    </text>
  </g>

  <!-- Usage notes -->
  <g id="usage-notes" opacity="0.1">
    <rect x="450" y="70" width="140" height="60" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="0.5" rx="2"/>
    <text x="460" y="85" font-family="Inter, Arial, sans-serif" font-size="7" fill="#718096">
      Customization Notes:
    </text>
    <text x="460" y="95" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Replace text with actual concepts
    </text>
    <text x="460" y="103" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Adjust colors to match theme
    </text>
    <text x="460" y="111" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Modify connections as needed
    </text>
    <text x="460" y="119" font-family="Inter, Arial, sans-serif" font-size="6" fill="#718096">
      • Add/remove elements per theory
    </text>
  </g>
</svg>