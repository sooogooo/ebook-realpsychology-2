<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 信息处理流程 -->
  <defs>
    <!-- 输入阶段渐变 -->
    <linearGradient id="input-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 处理阶段渐变 -->
    <linearGradient id="process-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <!-- 输出阶段渐变 -->
    <linearGradient id="output-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 反馈阶段渐变 -->
    <linearGradient id="feedback-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    信息处理流程
  </text>
  
  <!-- 主要流程 -->
  <g transform="translate(400, 300)">
    <!-- 1. 信息输入 -->
    <g transform="translate(-250, -80)">
      <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#input-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="信息输入：接收外部信息" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">信息输入</text>
      <text y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">感知接收</text>
    </g>
    
    <!-- 2. 信息筛选 -->
    <g transform="translate(-100, -80)">
      <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#input-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="信息筛选：过滤重要信息" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">信息筛选</text>
      <text y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">注意力分配</text>
    </g>
    
    <!-- 3. 信息处理 -->
    <g transform="translate(100, -80)">
      <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#process-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="信息处理：分析和理解" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">信息处理</text>
      <text y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">认知加工</text>
    </g>
    
    <!-- 4. 信息存储 -->
    <g transform="translate(250, -80)">
      <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#process-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="信息存储：记忆和保留" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">信息存储</text>
      <text y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">记忆形成</text>
    </g>
    
    <!-- 5. 决策形成 -->
    <g transform="translate(250, 80)">
      <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#output-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="决策形成：做出选择" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">决策形成</text>
      <text y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">判断选择</text>
    </g>
    
    <!-- 6. 行为执行 -->
    <g transform="translate(100, 80)">
      <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#output-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="行为执行：实施行动" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">行为执行</text>
      <text y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">行动实施</text>
    </g>
    
    <!-- 7. 结果反馈 -->
    <g transform="translate(-100, 80)">
      <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#feedback-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="结果反馈：获得结果" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">结果反馈</text>
      <text y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">效果评估</text>
    </g>
    
    <!-- 8. 经验学习 -->
    <g transform="translate(-250, 80)">
      <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#feedback-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="经验学习：积累经验" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">经验学习</text>
      <text y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">知识更新</text>
    </g>
    
    <!-- 连接箭头 -->
    <path d="M -190 -80 L -160 -80" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M -40 -80 L 40 -80" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 160 -80 L 190 -80" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 250 -50 L 250 50" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 190 80 L 160 80" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 40 80 L -40 80" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M -160 80 L -190 80" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- 反馈循环 -->
    <path d="M -250 50 Q -300 0 -250 -50" stroke="#f39c12" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
    
    <!-- 中心处理单元 -->
    <circle cx="0" cy="0" r="40" fill="white" stroke="#667eea" stroke-width="3" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#667eea">认知</text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#667eea">中枢</text>
  </g>
  
  <!-- 处理机制 -->
  <g transform="translate(50, 180)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">处理机制：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">选择性注意：过滤重要信息</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">工作记忆：临时信息处理</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">长期记忆：知识存储系统</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">元认知：监控和调节</text>
    </g>
  </g>
  
  <!-- 医美应用 -->
  <g transform="translate(550, 180)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">医美应用：</text>
    
    <text y="25" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">• 广告信息接收和处理</text>
    <text y="45" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">• 医生建议的理解和评估</text>
    <text y="65" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">• 风险信息的认知处理</text>
    <text y="85" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">• 价格信息的价值判断</text>
  </g>
  
  <!-- 影响因素 -->
  <g transform="translate(100, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">影响因素：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 个人知识水平和经验</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 情绪状态和动机强度</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 社会环境和文化背景</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 信息来源的可信度</text>
  </g>
  
  <!-- 优化策略 -->
  <g transform="translate(450, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">优化策略：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 提供清晰简洁的信息</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 使用多种表达方式</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 建立反馈和调整机制</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 考虑认知负荷限制</text>
  </g>
  
  <!-- 流程动画 -->
  <circle r="4" fill="#667eea">
    <animateMotion dur="8s" repeatCount="indefinite">
      <mpath href="#process-path"/>
    </animateMotion>
  </circle>
  
  <!-- 定义流程路径 -->
  <path id="process-path" d="M 150 220 L 300 220 L 450 220 L 550 220 L 550 380 L 450 380 L 300 380 L 150 380 L 150 220" fill="none"/>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各阶段查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>