<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 情绪对决策的影响 -->
  <defs>
    <!-- 积极情绪渐变 -->
    <linearGradient id="positive-emotion-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 消极情绪渐变 -->
    <linearGradient id="negative-emotion-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 中性情绪渐变 -->
    <linearGradient id="neutral-emotion-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#95a5a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7f8c8d;stop-opacity:1" />
    </linearGradient>
    
    <!-- 决策影响渐变 -->
    <linearGradient id="decision-impact-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    情绪对决策的影响
  </text>
  
  <!-- 情绪-决策关系图 -->
  <g transform="translate(400, 300)">
    <!-- 情绪中心 -->
    <circle cx="0" cy="0" r="50" fill="url(#decision-impact-grad)" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">情绪</text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">决策</text>
    
    <!-- 积极情绪影响 -->
    <g transform="translate(-150, -100)">
      <ellipse cx="0" cy="0" rx="70" ry="40" fill="url(#positive-emotion-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="积极情绪促进决策" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">积极情绪</text>
      <text y="-12" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">乐观、自信</text>
    </g>
    
    <!-- 消极情绪影响 -->
    <g transform="translate(150, -100)">
      <ellipse cx="0" cy="0" rx="70" ry="40" fill="url(#negative-emotion-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="消极情绪阻碍决策" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">消极情绪</text>
      <text y="-12" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">恐惧、焦虑</text>
    </g>
    
    <!-- 中性情绪影响 -->
    <g transform="translate(0, 120)">
      <ellipse cx="0" cy="0" rx="70" ry="40" fill="url(#neutral-emotion-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="中性情绪理性决策" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">中性情绪</text>
      <text y="-12" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">平静、客观</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -80 -80 L -45 -45" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 80 -80 L 45 -45" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 0 50 L 0 80" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- 影响强度 -->
    <text x="-100" y="-130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2ecc71">促进</text>
    <text x="100" y="-130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">阻碍</text>
    <text x="0" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">平衡</text>
  </g>
  
  <!-- 情绪类型 -->
  <g transform="translate(50, 150)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">情绪类型：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">积极情绪：喜悦、兴奋、期待</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">消极情绪：恐惧、焦虑、担忧</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#95a5a6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">中性情绪：平静、理性</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">复杂情绪：矛盾、纠结</text>
    </g>
  </g>
  
  <!-- 决策影响机制 -->
  <g transform="translate(550, 150)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">决策影响机制：</text>
    
    <text y="25" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">• 风险评估：影响风险感知</text>
    <text y="45" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">• 信息处理：改变信息筛选</text>
    <text y="65" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">• 时间偏好：影响现在vs未来</text>
    <text y="85" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">• 社会比较：改变参照标准</text>
    <text y="105" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">• 自我效能：影响信心判断</text>
  </g>
  
  <!-- 医美决策中的情绪 -->
  <g transform="translate(100, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">医美决策中的情绪：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 对美丽的渴望和期待</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 对手术风险的恐惧</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 对效果的焦虑和担忧</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 对价格的纠结和犹豫</text>
  </g>
  
  <!-- 情绪管理策略 -->
  <g transform="translate(450, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">情绪管理策略：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 情绪识别：觉察情绪状态</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 认知重评：改变思考角度</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 情绪调节：控制情绪强度</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 延迟决策：避免情绪冲动</text>
  </g>
  
  <!-- 情绪强度指示器 -->
  <g transform="translate(50, 320)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">当前情绪强度：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="24" width="15" height="56" rx="7" fill="#f39c12"/>
      <text x="25" y="60" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">70%</text>
    </g>
  </g>
  
  <!-- 决策质量 -->
  <g transform="translate(700, 320)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">决策质量：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="20" width="15" height="60" rx="7" fill="#2ecc71"/>
      <text x="-35" y="60" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">75%</text>
    </g>
  </g>
  
  <!-- 情绪波动效果 -->
  <circle cx="400" cy="300" r="100" fill="none" stroke="#e74c3c" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="100;120;100" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各情绪类型查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>