<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 风险感知模型 -->
  <defs>
    <!-- 低风险渐变 -->
    <linearGradient id="low-risk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 中风险渐变 -->
    <linearGradient id="medium-risk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <!-- 高风险渐变 -->
    <linearGradient id="high-risk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 风险评估渐变 -->
    <linearGradient id="assessment-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    风险感知模型
  </text>
  
  <!-- 风险矩阵 -->
  <g transform="translate(400, 300)">
    <!-- 矩阵背景 -->
    <rect x="-150" y="-120" width="300" height="240" fill="white" stroke="#667eea" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- 低风险区域 -->
    <rect x="-150" y="-120" width="150" height="120" fill="url(#low-risk-grad)" opacity="0.3"/>
    <text x="-75" y="-60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">低风险</text>
    <text x="-75" y="-40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">低概率 × 低影响</text>
    
    <!-- 中风险区域 -->
    <rect x="0" y="-120" width="150" height="120" fill="url(#medium-risk-grad)" opacity="0.3"/>
    <text x="75" y="-60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d68910">中风险</text>
    <text x="75" y="-40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d68910">高概率 × 低影响</text>
    
    <!-- 高风险区域 -->
    <rect x="-150" y="0" width="150" height="120" fill="url(#high-risk-grad)" opacity="0.3"/>
    <text x="-75" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c0392b">高风险</text>
    <text x="-75" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c0392b">低概率 × 高影响</text>
    
    <!-- 极高风险区域 -->
    <rect x="0" y="0" width="150" height="120" fill="url(#high-risk-grad)" opacity="0.5"/>
    <text x="75" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c0392b">极高风险</text>
    <text x="75" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c0392b">高概率 × 高影响</text>
    
    <!-- 坐标轴 -->
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#34495e" stroke-width="2"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#34495e" stroke-width="2"/>
    
    <!-- 坐标轴标签 -->
    <text x="160" y="5" font-family="Arial, sans-serif" font-size="12" fill="#34495e">发生概率</text>
    <text x="5" y="-130" font-family="Arial, sans-serif" font-size="12" fill="#34495e">影响程度</text>
    
    <!-- 箭头 -->
    <polygon points="150,0 140,-5 140,5" fill="#34495e"/>
    <polygon points="0,-120 -5,-110 5,-110" fill="#34495e"/>
  </g>
  
  <!-- 风险评估过程 -->
  <g transform="translate(50, 150)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">风险评估过程：</text>
    
    <g transform="translate(0, 25)">
      <circle r="6" fill="url(#assessment-grad)"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">风险识别：识别潜在风险因素</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="6" fill="url(#assessment-grad)"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">风险分析：分析风险发生机制</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="6" fill="url(#assessment-grad)"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">风险评估：量化风险等级</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="6" fill="url(#assessment-grad)"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">风险应对：制定应对策略</text>
    </g>
  </g>
  
  <!-- 医美风险因素 -->
  <g transform="translate(550, 150)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">医美风险因素：</text>
    
    <g transform="translate(0, 25)">
      <circle r="4" fill="#e74c3c"/>
      <text x="12" y="4" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">手术并发症：感染、出血等</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="4" fill="#f39c12"/>
      <text x="12" y="4" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">效果不理想：未达到预期</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="4" fill="#2ecc71"/>
      <text x="12" y="4" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">经济风险：价格过高</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="4" fill="#9b59b6"/>
      <text x="12" y="4" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">心理风险：后悔、抑郁</text>
    </g>
  </g>
  
  <!-- 风险感知偏差 -->
  <g transform="translate(100, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">风险感知偏差：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 乐观偏差：低估自身风险</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 可得性偏差：依赖易得信息</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 确认偏差：选择性接受信息</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 情绪影响：恐惧或贪婪</text>
  </g>
  
  <!-- 风险管理策略 -->
  <g transform="translate(450, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">风险管理策略：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 风险规避：避免高风险选择</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 风险降低：减少风险概率</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 风险转移：购买保险</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 风险接受：理性承担</text>
  </g>
  
  <!-- 风险等级指示器 -->
  <g transform="translate(50, 320)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">当前风险等级：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="20" height="100" rx="10" fill="#ecf0f1"/>
      <rect x="0" y="40" width="20" height="60" rx="10" fill="#f39c12"/>
      <text x="30" y="70" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">中等</text>
    </g>
  </g>
  
  <!-- 风险接受度 -->
  <g transform="translate(700, 320)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">风险接受度：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="20" height="100" rx="10" fill="#ecf0f1"/>
      <rect x="0" y="20" width="20" height="80" rx="10" fill="#2ecc71"/>
      <text x="-50" y="70" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">80%</text>
    </g>
  </g>
  
  <!-- 动态风险指示 -->
  <circle cx="400" cy="300" r="80" fill="none" stroke="#e74c3c" stroke-width="2" opacity="0.3">
    <animate attributeName="stroke-dasharray" values="0 502;502 0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各区域查看风险详情">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>