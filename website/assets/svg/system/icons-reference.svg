<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <title>Stakeholder Icons Reference</title>
  <desc>Complete set of stakeholder icons for the medical aesthetics psychology project</desc>

  <!-- Background -->
  <rect width="800" height="600" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="300" fill="#2D3748">
    Stakeholder Icon System
  </text>
  <text x="400" y="65" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#4A5568">
    Medical Aesthetics Consumer Psychology
  </text>

  <!-- Icons Grid -->
  <g id="icons-grid">
    <!-- Consumer Icon -->
    <g transform="translate(200, 150)">
      <rect x="-40" y="-40" width="80" height="80" fill="white" stroke="#E2E8F0" stroke-width="1" rx="8"/>

      <!-- Icon placeholder -->
      <circle cx="0" cy="-10" r="8" stroke="#2D3748" stroke-width="1.5" fill="none"/>
      <path d="M -15 5 Q 0 0, 15 5 L 10 20 L -10 20 Z" stroke="#2D3748" stroke-width="1.5" fill="none"/>

      <!-- Consumer-specific elements -->
      <rect x="10" y="2" width="6" height="8" stroke="#48BB78" stroke-width="1" fill="none" rx="1"/>
      <circle cx="-5" cy="8" r="1" fill="#ED8936" stroke="#ED8936"/>
      <circle cx="5" cy="6" r="1" fill="#4A5568" stroke="#4A5568"/>

      <text x="0" y="40" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#2D3748">
        Consumer
      </text>
      <text x="0" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
        消费者
      </text>
    </g>

    <!-- Doctor Icon -->
    <g transform="translate(400, 150)">
      <rect x="-40" y="-40" width="80" height="80" fill="white" stroke="#E2E8F0" stroke-width="1" rx="8"/>

      <!-- Icon placeholder -->
      <circle cx="0" cy="-10" r="8" stroke="#2D3748" stroke-width="1.5" fill="none"/>
      <!-- Medical cap -->
      <rect x="-6" y="-18" width="12" height="4" stroke="#48BB78" stroke-width="1" fill="none" rx="1"/>
      <path d="M -2 -16 h 4 v 2 h -4 z" stroke="#48BB78" stroke-width="1" fill="#48BB78"/>

      <path d="M -15 5 Q 0 0, 15 5 L 10 20 L -10 20 Z" stroke="#2D3748" stroke-width="1.5" fill="none"/>

      <!-- Medical elements -->
      <circle cx="0" cy="10" r="3" stroke="#48BB78" stroke-width="1" fill="none"/>
      <line x1="0" y1="7" x2="0" y2="13" stroke="#48BB78" stroke-width="1"/>
      <line x1="-3" y1="10" x2="3" y2="10" stroke="#48BB78" stroke-width="1"/>

      <text x="0" y="40" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#2D3748">
        Doctor
      </text>
      <text x="0" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
        医生
      </text>
    </g>

    <!-- Sales Icon -->
    <g transform="translate(600, 150)">
      <rect x="-40" y="-40" width="80" height="80" fill="white" stroke="#E2E8F0" stroke-width="1" rx="8"/>

      <!-- Icon placeholder -->
      <circle cx="0" cy="-10" r="8" stroke="#2D3748" stroke-width="1.5" fill="none"/>
      <path d="M -15 5 Q 0 0, 15 5 L 10 20 L -10 20 Z" stroke="#2D3748" stroke-width="1.5" fill="none"/>

      <!-- Tie -->
      <path d="M 0 2 l 0 4 l -1 2 l 1 -0.5 l 1 0.5 l -1 -2 z" stroke="#ED8936" stroke-width="1" fill="#ED8936"/>

      <!-- Communication elements -->
      <circle cx="-8" cy="-5" r="3" stroke="#4A5568" stroke-width="1" fill="none"/>
      <circle cx="8" cy="-5" r="3" stroke="#4A5568" stroke-width="1" fill="none"/>
      <circle cx="0" cy="-12" r="3" stroke="#4A5568" stroke-width="1" fill="none"/>

      <text x="0" y="40" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#2D3748">
        Sales Personnel
      </text>
      <text x="0" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
        销售人员
      </text>
    </g>

    <!-- Investor Icon -->
    <g transform="translate(200, 300)">
      <rect x="-40" y="-40" width="80" height="80" fill="white" stroke="#E2E8F0" stroke-width="1" rx="8"/>

      <!-- Icon placeholder -->
      <circle cx="0" cy="-10" r="8" stroke="#2D3748" stroke-width="1.5" fill="none"/>
      <path d="M -15 5 Q 0 0, 15 5 L 10 20 L -10 20 Z" stroke="#2D3748" stroke-width="1.5" fill="none"/>

      <!-- Tie -->
      <path d="M 0 2 l 0 4 l -1 2 l 1 -0.5 l 1 0.5 l -1 -2 z" stroke="#ED8936" stroke-width="1" fill="#ED8936"/>

      <!-- Financial elements -->
      <rect x="10" y="8" width="6" height="6" stroke="#48BB78" stroke-width="1" fill="none" rx="1"/>
      <polyline points="11,13 11.5,11.5 12,12 12.5,11.5 13,12.5" stroke="#48BB78" stroke-width="0.75" fill="none"/>

      <!-- Growth arrow -->
      <path d="M 10 5 L 13 2 L 13 5" stroke="#48BB78" stroke-width="1" fill="#48BB78"/>

      <text x="0" y="40" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#2D3748">
        Investor
      </text>
      <text x="0" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
        投资者
      </text>
    </g>
  </g>

  <!-- Icon Design Principles -->
  <g transform="translate(50, 420)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#2D3748">
      Design Principles
    </text>

    <rect x="0" y="10" width="700" height="120" fill="white" stroke="#E2E8F0" stroke-width="1" rx="4"/>

    <g font-family="Inter, Arial, sans-serif" font-size="9" fill="#4A5568">
      <text x="15" y="30" font-weight="500">Visual Consistency:</text>
      <text x="15" y="42">• All icons share the same base structure (head + body)</text>
      <text x="15" y="54">• Consistent stroke weight (1.5px for main elements, 1px for details)</text>
      <text x="15" y="66">• Uniform color palette across all icons</text>

      <text x="380" y="30" font-weight="500">Semantic Clarity:</text>
      <text x="380" y="42">• Each icon includes distinctive elements for stakeholder identification</text>
      <text x="380" y="54">• Clear visual hierarchy with primary elements first</text>
      <text x="380" y="66">• Professional appearance appropriate for academic content</text>

      <text x="15" y="90" font-weight="500">Color Coding:</text>
      <text x="15" y="102">• Primary Academic (#2D3748): Main structural elements</text>
      <text x="15" y="114">• Secondary Calm (#4A5568): Supporting details, communication elements</text>

      <text x="380" y="90" font-weight="500">• Accent Emerald (#48BB78): Positive indicators, medical elements</text>
      <text x="380" y="102">• Accent Coral (#ED8936): Attention points, business elements</text>
      <text x="380" y="114">• Consistent use ensures quick visual recognition</text>
    </g>
  </g>

  <!-- Usage Guidelines -->
  <g transform="translate(400, 300)">
    <rect x="-40" y="-40" width="80" height="80" fill="white" stroke="#E2E8F0" stroke-width="1" rx="8"/>

    <!-- Size variants -->
    <circle cx="0" cy="-15" r="4" stroke="#2D3748" stroke-width="1" fill="none"/>
    <circle cx="0" cy="0" r="6" stroke="#2D3748" stroke-width="1.5" fill="none"/>
    <circle cx="0" cy="18" r="8" stroke="#2D3748" stroke-width="2" fill="none"/>

    <text x="0" y="-10" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="6" fill="#4A5568">16px</text>
    <text x="0" y="4" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="6" fill="#4A5568">24px</text>
    <text x="0" y="22" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="6" fill="#4A5568">32px</text>

    <text x="0" y="40" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#2D3748">
      Size Variants
    </text>
    <text x="0" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
      Scalable Icons
    </text>
  </g>
</svg>