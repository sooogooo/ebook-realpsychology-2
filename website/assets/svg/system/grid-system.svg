<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <title>Grid and Spacing Guidelines</title>
  <desc>Grid system and spacing reference for consistent SVG layouts</desc>

  <!-- Background -->
  <rect width="800" height="600" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="300" fill="#2D3748">
    Grid System & Spacing Guidelines
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#4A5568">
    8px Baseline Grid with 4px Minor Increments
  </text>

  <!-- Grid demonstration area -->
  <g id="grid-demo" transform="translate(50, 80)">
    <!-- Background for grid area -->
    <rect x="0" y="0" width="700" height="200" fill="white" stroke="#E2E8F0" stroke-width="1" rx="4"/>

    <!-- Major grid lines (16px spacing) -->
    <g stroke="#CBD5E0" stroke-width="0.5">
      <line x1="0" y1="16" x2="700" y2="16"/>
      <line x1="0" y1="32" x2="700" y2="32"/>
      <line x1="0" y1="48" x2="700" y2="48"/>
      <line x1="0" y1="64" x2="700" y2="64"/>
      <line x1="0" y1="80" x2="700" y2="80"/>
      <line x1="0" y1="96" x2="700" y2="96"/>
      <line x1="0" y1="112" x2="700" y2="112"/>
      <line x1="0" y1="128" x2="700" y2="128"/>
      <line x1="0" y1="144" x2="700" y2="144"/>
      <line x1="0" y1="160" x2="700" y2="160"/>
      <line x1="0" y1="176" x2="700" y2="176"/>

      <!-- Vertical grid lines -->
      <line x1="16" y1="0" x2="16" y2="200"/>
      <line x1="32" y1="0" x2="32" y2="200"/>
      <line x1="48" y1="0" x2="48" y2="200"/>
      <line x1="64" y1="0" x2="64" y2="200"/>
      <line x1="80" y1="0" x2="80" y2="200"/>
      <line x1="96" y1="0" x2="96" y2="200"/>
      <line x1="112" y1="0" x2="112" y2="200"/>
      <line x1="128" y1="0" x2="128" y2="200"/>
      <line x1="144" y1="0" x2="144" y2="200"/>
      <line x1="160" y1="0" x2="160" y2="200"/>
    </g>

    <!-- Minor grid lines (4px spacing) -->
    <g stroke="#E2E8F0" stroke-width="0.25">
      <line x1="0" y1="4" x2="700" y2="4"/>
      <line x1="0" y1="8" x2="700" y2="8"/>
      <line x1="0" y1="12" x2="700" y2="12"/>
      <line x1="0" y1="20" x2="700" y2="20"/>
      <line x1="0" y1="24" x2="700" y2="24"/>
      <line x1="0" y1="28" x2="700" y2="28"/>
      <line x1="0" y1="36" x2="700" y2="36"/>
      <line x1="0" y1="40" x2="700" y2="40"/>
      <line x1="0" y1="44" x2="700" y2="44"/>
      <line x1="0" y1="52" x2="700" y2="52"/>
      <line x1="0" y1="56" x2="700" y2="56"/>
      <line x1="0" y1="60" x2="700" y2="60"/>
    </g>

    <!-- Grid labels -->
    <g font-family="JetBrains Mono, SF Mono, monospace" font-size="8" fill="#718096">
      <!-- Y-axis labels -->
      <text x="-5" y="20" text-anchor="end">16</text>
      <text x="-5" y="36" text-anchor="end">32</text>
      <text x="-5" y="52" text-anchor="end">48</text>
      <text x="-5" y="68" text-anchor="end">64</text>
      <text x="-5" y="84" text-anchor="end">80</text>

      <!-- X-axis labels -->
      <text x="16" y="-5" text-anchor="middle">16</text>
      <text x="48" y="-5" text-anchor="middle">48</text>
      <text x="80" y="-5" text-anchor="middle">80</text>
      <text x="112" y="-5" text-anchor="middle">112</text>
    </g>

    <!-- Grid title -->
    <text x="350" y="20" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#2D3748">
      8px Baseline Grid
    </text>
    <text x="350" y="35" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
      Major: 16px | Minor: 4px
    </text>
  </g>

  <!-- Spacing scale demonstration -->
  <g transform="translate(50, 300)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#2D3748">
      Spacing Scale
    </text>

    <!-- Spacing examples -->
    <g transform="translate(0, 20)">
      <!-- XS: 4px -->
      <rect x="0" y="0" width="40" height="4" fill="#2D3748" rx="1"/>
      <text x="50" y="4" font-family="Inter, Arial, sans-serif" font-size="9" fill="#4A5568">XS: 4px</text>
      <text x="50" y="15" font-family="Inter, Arial, sans-serif" font-size="7" fill="#718096">Fine details, tight spacing</text>

      <!-- SM: 8px -->
      <rect x="0" y="25" width="40" height="8" fill="#4A5568" rx="1"/>
      <text x="50" y="31" font-family="Inter, Arial, sans-serif" font-size="9" fill="#4A5568">SM: 8px</text>
      <text x="50" y="42" font-family="Inter, Arial, sans-serif" font-size="7" fill="#718096">Element spacing, baseline</text>

      <!-- MD: 16px -->
      <rect x="0" y="50" width="40" height="16" fill="#48BB78" rx="1"/>
      <text x="50" y="60" font-family="Inter, Arial, sans-serif" font-size="9" fill="#4A5568">MD: 16px</text>
      <text x="50" y="71" font-family="Inter, Arial, sans-serif" font-size="7" fill="#718096">Component spacing, major rhythm</text>

      <!-- LG: 32px -->
      <rect x="0" y="80" width="40" height="32" fill="#ED8936" rx="1"/>
      <text x="50" y="98" font-family="Inter, Arial, sans-serif" font-size="9" fill="#4A5568">LG: 32px</text>
      <text x="50" y="109" font-family="Inter, Arial, sans-serif" font-size="7" fill="#718096">Section spacing, major divisions</text>

      <!-- XL: 64px -->
      <rect x="0" y="120" width="40" height="64" fill="#2D3748" opacity="0.6" rx="1"/>
      <text x="50" y="154" font-family="Inter, Arial, sans-serif" font-size="9" fill="#4A5568">XL: 64px</text>
      <text x="50" y="165" font-family="Inter, Arial, sans-serif" font-size="7" fill="#718096">Page spacing, major sections</text>
    </g>
  </g>

  <!-- Layout templates -->
  <g transform="translate(400, 300)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#2D3748">
      Layout Templates
    </text>

    <!-- Standard card layout -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="200" height="120" fill="white" stroke="#E2E8F0" stroke-width="1" rx="4"/>
      <text x="100" y="20" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#2D3748">
        Standard Card Layout
      </text>

      <!-- Internal spacing guides -->
      <rect x="16" y="32" width="168" height="8" fill="#E2E8F0" rx="1"/>
      <rect x="16" y="48" width="168" height="40" fill="#F7FAFC" rx="2"/>
      <rect x="16" y="96" width="80" height="8" fill="#E2E8F0" rx="1"/>
      <rect x="104" y="96" width="80" height="8" fill="#E2E8F0" rx="1"/>

      <!-- Spacing annotations -->
      <g font-family="JetBrains Mono, SF Mono, monospace" font-size="6" fill="#718096">
        <text x="8" y="36">16</text>
        <text x="8" y="52">16</text>
        <text x="8" y="100">16</text>
        <text x="8" y="114">8</text>
      </g>
    </g>

    <!-- Content layout -->
    <g transform="translate(220, 20)">
      <rect x="0" y="0" width="120" height="120" fill="white" stroke="#E2E8F0" stroke-width="1" rx="4"/>
      <text x="60" y="20" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#2D3748">
        Content Layout
      </text>

      <!-- Content blocks -->
      <rect x="16" y="32" width="88" height="24" fill="#F7FAFC" rx="2"/>
      <rect x="16" y="64" width="40" height="40" fill="#F7FAFC" rx="2"/>
      <rect x="64" y="64" width="40" height="40" fill="#F7FAFC" rx="2"/>
    </g>
  </g>

  <!-- Usage guidelines -->
  <g transform="translate(50, 490)">
    <rect x="0" y="0" width="700" height="80" fill="white" stroke="#E2E8F0" stroke-width="1" rx="4"/>
    <text x="350" y="20" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#2D3748">
      Usage Guidelines
    </text>

    <g font-family="Inter, Arial, sans-serif" font-size="8" fill="#4A5568">
      <text x="20" y="35">• Align all elements to the 8px baseline grid for vertical rhythm</text>
      <text x="20" y="47">• Use 4px increments for fine adjustments and detailed layouts</text>
      <text x="20" y="59">• Maintain consistent spacing using the defined scale (4, 8, 16, 32, 64px)</text>
      <text x="370" y="35">• Leave minimum 8px margin from container edges</text>
      <text x="370" y="47">• Use 16px spacing between major elements and components</text>
      <text x="370" y="59">• Reserve 32px+ spacing for section and page-level divisions</text>
    </g>
  </g>
</svg>