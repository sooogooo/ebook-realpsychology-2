<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 年龄与动机变化 -->
  <defs>
    <!-- 青春期渐变 -->
    <linearGradient id="teen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 青年期渐变 -->
    <linearGradient id="youth-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <!-- 中年期渐变 -->
    <linearGradient id="middle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 中老年期渐变 -->
    <linearGradient id="senior-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 老年期渐变 -->
    <linearGradient id="elderly-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    年龄与动机变化
  </text>
  
  <!-- 年龄轴 -->
  <g transform="translate(100, 500)">
    <line x1="0" y1="0" x2="600" y2="0" stroke="#34495e" stroke-width="2"/>
    <polygon points="600,0 590,-5 590,5" fill="#34495e"/>
    
    <!-- 年龄标记 -->
    <g transform="translate(0, 0)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#34495e" stroke-width="2"/>
      <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">13-18岁</text>
    </g>
    
    <g transform="translate(150, 0)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#34495e" stroke-width="2"/>
      <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">19-30岁</text>
    </g>
    
    <g transform="translate(300, 0)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#34495e" stroke-width="2"/>
      <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">31-45岁</text>
    </g>
    
    <g transform="translate(450, 0)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#34495e" stroke-width="2"/>
      <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">46-60岁</text>
    </g>
    
    <g transform="translate(600, 0)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#34495e" stroke-width="2"/>
      <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">60岁以上</text>
    </g>
  </g>
  
  <!-- 动机强度曲线 -->
  <g transform="translate(100, 300)">
    <!-- 美丽需求曲线 -->
    <path d="M 0 -80 Q 75 -60 150 -40 T 300 -20 Q 375 -10 450 -30 T 600 -50" 
          stroke="#e74c3c" stroke-width="3" fill="none" filter="url(#shadow)"/>
    <circle cx="0" cy="-80" r="6" fill="#e74c3c" data-interactive="true" data-tooltip="青春期：美丽认同需求强烈" data-onclick="details"/>
    <circle cx="150" cy="-40" r="6" fill="#e74c3c" data-interactive="true" data-tooltip="青年期：美丽追求高峰期" data-onclick="details"/>
    <circle cx="300" cy="-20" r="6" fill="#e74c3c" data-interactive="true" data-tooltip="中年期：美丽需求稳定" data-onclick="details"/>
    <circle cx="450" cy="-30" r="6" fill="#e74c3c" data-interactive="true" data-tooltip="中老年期：抗衰需求增加" data-onclick="details"/>
    <circle cx="600" cy="-50" r="6" fill="#e74c3c" data-interactive="true" data-tooltip="老年期：保持年轻心态" data-onclick="details"/>
    
    <!-- 社交需求曲线 -->
    <path d="M 0 -40 Q 75 -50 150 -60 T 300 -40 Q 375 -20 450 -10 T 600 -20" 
          stroke="#f39c12" stroke-width="3" fill="none" filter="url(#shadow)"/>
    <circle cx="0" cy="-40" r="6" fill="#f39c12" data-interactive="true" data-tooltip="青春期：同伴认同重要" data-onclick="details"/>
    <circle cx="150" cy="-60" r="6" fill="#f39c12" data-interactive="true" data-tooltip="青年期：社交需求高峰" data-onclick="details"/>
    <circle cx="300" cy="-40" r="6" fill="#f39c12" data-interactive="true" data-tooltip="中年期：社交需求理性" data-onclick="details"/>
    <circle cx="450" cy="-10" r="6" fill="#f39c12" data-interactive="true" data-tooltip="中老年期：社交圈稳定" data-onclick="details"/>
    <circle cx="600" cy="-20" r="6" fill="#f39c12" data-interactive="true" data-tooltip="老年期：社交需求降低" data-onclick="details"/>
    
    <!-- 健康需求曲线 -->
    <path d="M 0 -20 Q 75 -30 150 -40 T 300 -60 Q 375 -70 450 -60 T 600 -40" 
          stroke="#2ecc71" stroke-width="3" fill="none" filter="url(#shadow)"/>
    <circle cx="0" cy="-20" r="6" fill="#2ecc71" data-interactive="true" data-tooltip="青春期：健康意识萌芽" data-onclick="details"/>
    <circle cx="150" cy="-40" r="6" fill="#2ecc71" data-interactive="true" data-tooltip="青年期：健康需求增长" data-onclick="details"/>
    <circle cx="300" cy="-60" r="6" fill="#2ecc71" data-interactive="true" data-tooltip="中年期：健康需求高峰" data-onclick="details"/>
    <circle cx="450" cy="-60" r="6" fill="#2ecc71" data-interactive="true" data-tooltip="中老年期：健康关注持续" data-onclick="details"/>
    <circle cx="600" cy="-40" r="6" fill="#2ecc71" data-interactive="true" data-tooltip="老年期：健康维护重点" data-onclick="details"/>
  </g>
  
  <!-- 年龄阶段特征 -->
  <g transform="translate(50, 120)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">年龄阶段特征：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">青春期：自我认同、同伴压力</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">青年期：求职恋爱、形象管理</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">中年期：事业稳定、抗衰老</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">中老年期：保持活力、延缓衰老</text>
    </g>
    
    <g transform="translate(0, 105)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">老年期：健康维护、生活质量</text>
    </g>
  </g>
  
  <!-- 动机优先级变化 -->
  <g transform="translate(550, 120)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">动机优先级变化：</text>
    
    <text y="25" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">青春：美丽 > 社交 > 健康</text>
    <text y="45" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">青年：社交 > 美丽 > 健康</text>
    <text y="65" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">中年：健康 > 美丽 > 社交</text>
    <text y="85" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">中老年：健康 > 美丽 > 社交</text>
    <text y="105" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">老年：健康 > 生活质量 > 美丽</text>
  </g>
  
  <!-- 营销策略调整 -->
  <g transform="translate(100, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">营销策略调整：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 青春期：强调同伴认同和流行趋势</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 青年期：突出职业发展和恋爱优势</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 中年期：注重抗衰老和健康效益</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 中老年期：强调活力和生活质量</text>
  </g>
  
  <!-- 年龄选择器 -->
  <g transform="translate(450, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">年龄选择器：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">点击曲线上各点查看该年龄段的</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">详细动机特征和消费行为模式</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">包括：心理需求、消费能力、</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">决策特点、服务偏好等</text>
  </g>
  
  <!-- 图例 -->
  <g transform="translate(100, 350)">
    <rect x="0" y="0" width="15" height="3" fill="#e74c3c"/>
    <text x="20" y="5" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">美丽需求</text>
    
    <rect x="0" y="15" width="15" height="3" fill="#f39c12"/>
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">社交需求</text>
    
    <rect x="0" y="30" width="15" height="3" fill="#2ecc71"/>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">健康需求</text>
  </g>
  
  <!-- 动态效果 -->
  <circle cx="250" cy="260" r="4" fill="#667eea">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#age-path"/>
    </animateMotion>
  </circle>
  
  <!-- 定义年龄路径 -->
  <path id="age-path" d="M 100 220 L 250 260 L 400 280 L 550 270 L 700 250" fill="none"/>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击曲线上的点查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>