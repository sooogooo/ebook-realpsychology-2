<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 文化背景对动机的影响 -->
  <defs>
    <!-- 东亚文化渐变 -->
    <linearGradient id="east-asia-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 西方文化渐变 -->
    <linearGradient id="western-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 中东文化渐变 -->
    <linearGradient id="middle-east-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <!-- 非洲文化渐变 -->
    <linearGradient id="africa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 拉美文化渐变 -->
    <linearGradient id="latin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    文化背景对动机的影响
  </text>
  
  <!-- 世界地图简化版 -->
  <g transform="translate(400, 300)">
    <!-- 东亚文化圈 -->
    <g transform="translate(-200, -50)">
      <ellipse cx="0" cy="0" rx="80" ry="60" fill="url(#east-asia-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="东亚文化：集体主义、和谐导向" data-onclick="details"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">东亚文化</text>
      <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">集体主义</text>
    </g>
    
    <!-- 西方文化圈 -->
    <g transform="translate(100, -80)">
      <ellipse cx="0" cy="0" rx="80" ry="60" fill="url(#western-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="西方文化：个人主义、自由导向" data-onclick="details"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">西方文化</text>
      <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">个人主义</text>
    </g>
    
    <!-- 中东文化圈 -->
    <g transform="translate(-50, 20)">
      <ellipse cx="0" cy="0" rx="70" ry="50" fill="url(#middle-east-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="中东文化：宗教传统、保守导向" data-onclick="details"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">中东文化</text>
      <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">宗教传统</text>
    </g>
    
    <!-- 非洲文化圈 -->
    <g transform="translate(-100, 80)">
      <ellipse cx="0" cy="0" rx="70" ry="50" fill="url(#africa-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="非洲文化：部落文化、自然导向" data-onclick="details"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">非洲文化</text>
      <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">部落文化</text>
    </g>
    
    <!-- 拉美文化圈 -->
    <g transform="translate(150, 50)">
      <ellipse cx="0" cy="0" rx="70" ry="50" fill="url(#latin-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="拉美文化：热情奔放、享乐导向" data-onclick="details"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">拉美文化</text>
      <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">热情奔放</text>
    </g>
    
    <!-- 文化影响连接线 -->
    <path d="M -200 -50 Q -100 -50 0 -80" stroke="#667eea" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M -200 -50 Q -125 -15 -50 20" stroke="#667eea" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M -200 -50 Q -150 15 -100 80" stroke="#667eea" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M 100 -80 Q 125 -15 150 50" stroke="#667eea" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M -50 20 Q 50 35 150 50" stroke="#667eea" stroke-width="1" fill="none" opacity="0.3"/>
  </g>
  
  <!-- 文化维度对比 -->
  <g transform="translate(50, 150)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">文化维度对比：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">集体主义 vs 个人主义</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">权力距离大小</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">不确定性规避程度</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">男性化 vs 女性化</text>
    </g>
    
    <g transform="translate(0, 105)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">长期导向 vs 短期导向</text>
    </g>
  </g>
  
  <!-- 医美动机差异 -->
  <g transform="translate(550, 150)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">医美动机差异：</text>
    
    <text y="25" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">东亚：社会和谐、群体认同</text>
    <text y="45" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">西方：个人表达、自我实现</text>
    <text y="65" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">中东：宗教规范、适度修饰</text>
    <text y="85" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">非洲：传统美容、自然美</text>
    <text y="105" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">拉美：热情表达、享乐主义</text>
  </g>
  
  <!-- 文化适应策略 -->
  <g transform="translate(100, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">文化适应策略：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 尊重文化差异，避免刻板印象</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 了解文化价值观，调整沟通方式</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 考虑宗教信仰，尊重传统习俗</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 适应审美标准，提供个性化服务</text>
  </g>
  
  <!-- 全球化影响 -->
  <g transform="translate(450, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">全球化影响：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 审美标准趋同化</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 消费模式国际化</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 技术传播全球化</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 文化认同多元化</text>
  </g>
  
  <!-- 热力效果 -->
  <circle cx="200" cy="250" r="60" fill="#e74c3c" opacity="0.1">
    <animate attributeName="r" values="60;80;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.05;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="500" cy="220" r="50" fill="#3498db" opacity="0.1">
    <animate attributeName="r" values="50;70;50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.05;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="350" cy="320" r="40" fill="#f39c12" opacity="0.1">
    <animate attributeName="r" values="40;60;40" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.05;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各文化圈查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>