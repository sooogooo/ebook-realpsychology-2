<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 心理需求与消费行为 -->
  <defs>
    <!-- 需求层渐变 -->
    <linearGradient id="need-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="need-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="need-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="need-grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="need-grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <!-- 行为层渐变 -->
    <linearGradient id="behavior-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a67d8;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    心理需求与消费行为
  </text>
  
  <!-- 漏斗图结构 -->
  <g transform="translate(400, 300)">
    <!-- 第1层：美丽需求 -->
    <g transform="translate(0, -120)">
      <path d="M -120 0 L 120 0 L 100 40 L -100 40 Z" fill="url(#need-grad1)" filter="url(#shadow)" data-interactive="true" data-tooltip="美丽需求：对美的追求和审美满足" data-onclick="details"/>
      <text y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">美丽需求</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">100% 消费者</text>
    </g>
    
    <!-- 第2层：社交需求 -->
    <g transform="translate(0, -70)">
      <path d="M -100 0 L 100 0 L 80 40 L -80 40 Z" fill="url(#need-grad2)" filter="url(#shadow)" data-interactive="true" data-tooltip="社交需求：获得认同和归属感" data-onclick="details"/>
      <text y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">社交需求</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">85% 消费者</text>
    </g>
    
    <!-- 第3层：自信需求 -->
    <g transform="translate(0, -20)">
      <path d="M -80 0 L 80 0 L 60 40 L -60 40 Z" fill="url(#need-grad3)" filter="url(#shadow)" data-interactive="true" data-tooltip="自信需求：提升自我价值感" data-onclick="details"/>
      <text y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">自信需求</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">70% 消费者</text>
    </g>
    
    <!-- 第4层：职业需求 -->
    <g transform="translate(0, 30)">
      <path d="M -60 0 L 60 0 L 40 40 L -40 40 Z" fill="url(#need-grad4)" filter="url(#shadow)" data-interactive="true" data-tooltip="职业需求：提升职业竞争力" data-onclick="details"/>
      <text y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">职业需求</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">45% 消费者</text>
    </g>
    
    <!-- 第5层：健康需求 -->
    <g transform="translate(0, 80)">
      <path d="M -40 0 L 40 0 L 20 40 L -20 40 Z" fill="url(#need-grad5)" filter="url(#shadow)" data-interactive="true" data-tooltip="健康需求：改善身体状况" data-onclick="details"/>
      <text y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">健康需求</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">30% 消费者</text>
    </g>
    
    <!-- 最终行为 -->
    <g transform="translate(0, 140)">
      <rect x="-60" y="-20" width="120" height="40" rx="20" fill="url(#behavior-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="消费行为：实际购买决策" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">消费行为</text>
      <text y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#667eea">转化率: 25%</text>
    </g>
    
    <!-- 连接箭头 -->
    <path d="M 0 -80 L 0 -70" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 0 -30 L 0 -20" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 0 20 L 0 30" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 0 70 L 0 80" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 0 120 L 0 120" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- 转化影响因素 -->
  <g transform="translate(50, 150)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">转化影响因素：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">经济能力：支付能力评估</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">风险认知：安全风险考量</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">信息充分：决策信息完整度</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">社会支持：家人朋友态度</text>
    </g>
    
    <g transform="translate(0, 105)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">时机成熟：生活阶段适合性</text>
    </g>
  </g>
  
  <!-- 需求强度分析 -->
  <g transform="translate(550, 150)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">需求强度分析：</text>
    
    <g transform="translate(0, 25)">
      <rect x="0" y="0" width="120" height="15" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="0" width="120" height="15" rx="7" fill="#3498db"/>
      <text x="130" y="12" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">美丽 100%</text>
    </g>
    
    <g transform="translate(0, 45)">
      <rect x="0" y="0" width="120" height="15" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="0" width="102" height="15" rx="7" fill="#e74c3c"/>
      <text x="130" y="12" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">社交 85%</text>
    </g>
    
    <g transform="translate(0, 65)">
      <rect x="0" y="0" width="120" height="15" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="0" width="84" height="15" rx="7" fill="#2ecc71"/>
      <text x="130" y="12" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">自信 70%</text>
    </g>
    
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="120" height="15" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="0" width="54" height="15" rx="7" fill="#f39c12"/>
      <text x="130" y="12" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">职业 45%</text>
    </g>
    
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="120" height="15" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="0" width="36" height="15" rx="7" fill="#9b59b6"/>
      <text x="130" y="12" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">健康 30%</text>
    </g>
  </g>
  
  <!-- 行为预测模型 -->
  <g transform="translate(100, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">行为预测模型：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">购买概率 = 需求强度 × 转化能力 × 外部条件</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">其中：转化能力 = 1 - 风险感知 + 信息充分度</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">外部条件 = 经济能力 × 社会支持 × 时机成熟度</text>
  </g>
  
  <!-- 干预策略 -->
  <g transform="translate(450, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">干预策略：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 需求唤醒：增强美丽意识</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 风险降低：提供安全保障</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 能力提升：增强决策信心</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 环境优化：创造有利条件</text>
  </g>
  
  <!-- 动态流动效果 -->
  <circle r="3" fill="#667eea">
    <animateMotion dur="4s" repeatCount="indefinite">
      <mpath href="#conversion-path"/>
    </animateMotion>
  </circle>
  
  <!-- 定义流动路径 -->
  <path id="conversion-path" d="M 400 180 L 400 230 L 400 280 L 400 330 L 400 380 L 400 440" fill="none"/>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各层次查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>