<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 医美消费的深层动机 -->
  <defs>
    <!-- 表层动机渐变 -->
    <linearGradient id="surface-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 浅层动机渐变 -->
    <linearGradient id="shallow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 中层动机渐变 -->
    <linearGradient id="middle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <!-- 深层动机渐变 -->
    <linearGradient id="deep-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 核心动机渐变 -->
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    医美消费的深层动机
  </text>
  
  <!-- 海平面线 -->
  <line x1="100" y1="200" x2="700" y2="200" stroke="#667eea" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="720" y="205" font-family="Arial, sans-serif" font-size="12" fill="#667eea">海平面</text>
  
  <!-- 冰山主体 -->
  <g transform="translate(400, 350)">
    <!-- 表层动机（水面以上） -->
    <g transform="translate(0, -150)">
      <path d="M -80 0 L 80 0 L 60 50 L -60 50 Z" fill="url(#surface-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="表层动机：直接表达的美丽需求" data-onclick="details"/>
      <text y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">表层动机</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">变美需求</text>
    </g>
    
    <!-- 浅层动机（水面以下） -->
    <g transform="translate(0, -80)">
      <path d="M -100 0 L 100 0 L 80 60 L -80 60 Z" fill="url(#shallow-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="浅层动机：社交认同和职业发展" data-onclick="details"/>
      <text y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">浅层动机</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">社交职业</text>
    </g>
    
    <!-- 中层动机 -->
    <g transform="translate(0, 0)">
      <path d="M -120 0 L 120 0 L 100 70 L -100 70 Z" fill="url(#middle-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="中层动机：自信提升和自我价值" data-onclick="details"/>
      <text y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">中层动机</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">自信价值</text>
    </g>
    
    <!-- 深层动机 -->
    <g transform="translate(0, 90)">
      <path d="M -100 0 L 100 0 L 80 60 L -80 60 Z" fill="url(#deep-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="深层动机：安全感和归属感需求" data-onclick="details"/>
      <text y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">深层动机</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">安全归属</text>
    </g>
    
    <!-- 核心动机 -->
    <g transform="translate(0, 170)">
      <path d="M -60 0 L 60 0 L 40 50 L -40 50 Z" fill="url(#core-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="核心动机：存在意义和自我实现" data-onclick="details"/>
      <text y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">核心动机</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">自我实现</text>
    </g>
  </g>
  
  <!-- 动机层次说明 -->
  <g transform="translate(50, 120)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">层次特征：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">表层：意识清晰，表达直接</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">浅层：半意识状态，容易表达</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">中层：潜意识影响，需要引导</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">深层：深层潜意识，难以察觉</text>
    </g>
    
    <g transform="translate(0, 105)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">核心：最深层动机，驱动本质</text>
    </g>
  </g>
  
  <!-- 探索方法 -->
  <g transform="translate(550, 120)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">探索方法：</text>
    
    <text y="25" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">• 深度访谈技术</text>
    <text y="45" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">• 投射测试方法</text>
    <text y="65" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">• 梦境分析技术</text>
    <text y="85" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">• 自由联想方法</text>
    <text y="105" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">• 叙事分析技术</text>
  </g>
  
  <!-- 层次展开功能 -->
  <g transform="translate(100, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">层次展开：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">点击各层次可查看详细内容</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">包括：具体表现、影响程度、</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">激活条件、调节策略等</text>
  </g>
  
  <!-- 应用指导 -->
  <g transform="translate(450, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">应用指导：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 营销：满足表层，激活深层</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 咨询：理解深层，解决根本</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 服务：关注显性，照顾隐性</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 管理：平衡层次，满足多样</text>
  </g>
  
  <!-- 水波纹效果 -->
  <ellipse cx="400" cy="200" rx="200" ry="20" fill="none" stroke="#667eea" stroke-width="1" opacity="0.3">
    <animate attributeName="rx" values="200;250;200" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <ellipse cx="400" cy="200" rx="180" ry="15" fill="none" stroke="#667eea" stroke-width="1" opacity="0.5">
    <animate attributeName="rx" values="180;220;180" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各层次查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>