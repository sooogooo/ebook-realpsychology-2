<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 性别差异分析 -->
  <defs>
    <!-- 男性渐变 -->
    <linearGradient id="male-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 女性渐变 -->
    <linearGradient id="female-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 共同区域渐变 -->
    <linearGradient id="common-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    性别差异分析
  </text>
  
  <!-- 对称对比图 -->
  <g transform="translate(400, 320)">
    <!-- 男性半边 -->
    <g transform="translate(-200, 0)">
      <path d="M -100 -120 L 0 -120 L 0 120 L -100 120 Z" fill="url(#male-grad)" filter="url(#shadow)" opacity="0.8"/>
      <text x="-50" y="-100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">男性</text>
      
      <!-- 男性特征 -->
      <g transform="translate(-50, -60)">
        <circle r="15" fill="white" opacity="0.9" data-interactive="true" data-tooltip="功能导向：注重实用效果" data-onclick="details"/>
        <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2980b9">功能</text>
      </g>
      
      <g transform="translate(-50, -20)">
        <circle r="15" fill="white" opacity="0.9" data-interactive="true" data-tooltip="理性决策：基于逻辑分析" data-onclick="details"/>
        <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2980b9">理性</text>
      </g>
      
      <g transform="translate(-50, 20)">
        <circle r="15" fill="white" opacity="0.9" data-interactive="true" data-tooltip="结果导向：关注最终效果" data-onclick="details"/>
        <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2980b9">结果</text>
      </g>
      
      <g transform="translate(-50, 60)">
        <circle r="15" fill="white" opacity="0.9" data-interactive="true" data-tooltip="独立决策：自主选择权" data-onclick="details"/>
        <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2980b9">独立</text>
      </g>
      
      <g transform="translate(-50, 100)">
        <circle r="15" fill="white" opacity="0.9" data-interactive="true" data-tooltip="职业需求：工作形象管理" data-onclick="details"/>
        <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2980b9">职业</text>
      </g>
    </g>
    
    <!-- 女性半边 -->
    <g transform="translate(200, 0)">
      <path d="M 0 -120 L 100 -120 L 100 120 L 0 120 Z" fill="url(#female-grad)" filter="url(#shadow)" opacity="0.8"/>
      <text x="50" y="-100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">女性</text>
      
      <!-- 女性特征 -->
      <g transform="translate(50, -60)">
        <circle r="15" fill="white" opacity="0.9" data-interactive="true" data-tooltip="情感导向：注重感受体验" data-onclick="details"/>
        <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c0392b">情感</text>
      </g>
      
      <g transform="translate(50, -20)">
        <circle r="15" fill="white" opacity="0.9" data-interactive="true" data-tooltip="感性决策：基于直觉感受" data-onclick="details"/>
        <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c0392b">感性</text>
      </g>
      
      <g transform="translate(50, 20)">
        <circle r="15" fill="white" opacity="0.9" data-interactive="true" data-tooltip="过程导向：享受整个过程" data-onclick="details"/>
        <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c0392b">过程</text>
      </g>
      
      <g transform="translate(50, 60)">
        <circle r="15" fill="white" opacity="0.9" data-interactive="true" data-tooltip="社交影响：参考他人意见" data-onclick="details"/>
        <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c0392b">社交</text>
      </g>
      
      <g transform="translate(50, 100)">
        <circle r="15" fill="white" opacity="0.9" data-interactive="true" data-tooltip="美丽需求：外在形象管理" data-onclick="details"/>
        <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c0392b">美丽</text>
      </g>
    </g>
    
    <!-- 中间重叠区域 -->
    <rect x="-30" y="-120" width="60" height="240" fill="url(#common-grad)" filter="url(#shadow)" opacity="0.7"/>
    <text x="0" y="-100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">共同</text>
    
    <!-- 共同特征 -->
    <g transform="translate(0, -40)">
      <circle r="12" fill="white" opacity="0.9" data-interactive="true" data-tooltip="健康关注：身体状态改善" data-onclick="details"/>
      <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8e44ad">健康</text>
    </g>
    
    <g transform="translate(0, 0)">
      <circle r="12" fill="white" opacity="0.9" data-interactive="true" data-tooltip="自信提升：自我价值感" data-onclick="details"/>
      <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8e44ad">自信</text>
    </g>
    
    <g transform="translate(0, 40)">
      <circle r="12" fill="white" opacity="0.9" data-interactive="true" data-tooltip="社会认同：群体归属感" data-onclick="details"/>
      <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8e44ad">认同</text>
    </g>
    
    <g transform="translate(0, 80)">
      <circle r="12" fill="white" opacity="0.9" data-interactive="true" data-tooltip="科技接受：新技术应用" data-onclick="details"/>
      <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8e44ad">科技</text>
    </g>
  </g>
  
  <!-- 消费行为对比 -->
  <g transform="translate(50, 150)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">消费行为对比：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">男性：目标明确、决策快速、价格敏感</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">女性：信息充分、比较选择、价值导向</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">共同：品质要求、安全关注、效果期望</text>
    </g>
  </g>
  
  <!-- 市场数据 -->
  <g transform="translate(550, 150)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">市场数据：</text>
    
    <g transform="translate(0, 25)">
      <rect x="0" y="0" width="80" height="15" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="0" width="32" height="15" rx="7" fill="#3498db"/>
      <text x="90" y="12" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">男性 40%</text>
    </g>
    
    <g transform="translate(0, 45)">
      <rect x="0" y="0" width="80" height="15" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="0" width="48" height="15" rx="7" fill="#e74c3c"/>
      <text x="90" y="12" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">女性 60%</text>
    </g>
    
    <text y="75" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">增长率：男性 +15%/年</text>
    <text y="95" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">增长率：女性 +8%/年</text>
  </g>
  
  <!-- 营销策略差异 -->
  <g transform="translate(100, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">营销策略差异：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 男性：突出功能性、效率性、专业性</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 女性：强调体验性、情感性、社交性</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 共同：注重安全性、品质、效果</text>
  </g>
  
  <!-- 服务设计建议 -->
  <g transform="translate(450, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">服务设计建议：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 男性：简洁流程、专业说明、结果导向</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 女性：细致服务、情感沟通、过程体验</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 共同：个性化定制、隐私保护</text>
    <text y="80" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 趋势：性别界限模糊化、需求多元化</text>
  </g>
  
  <!-- 动态连接效果 -->
  <line x1="200" y1="200" x2="600" y2="200" stroke="#667eea" stroke-width="1" opacity="0.3" stroke-dasharray="5,5">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>
  </line>
  
  <line x1="200" y1="320" x2="600" y2="320" stroke="#667eea" stroke-width="1" opacity="0.3" stroke-dasharray="5,5">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>
  </line>
  
  <line x1="200" y1="440" x2="600" y2="440" stroke="#667eea" stroke-width="1" opacity="0.3" stroke-dasharray="5,5">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>
  </line>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各特征查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>