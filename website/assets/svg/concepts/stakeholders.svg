<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f8f9fa"/>
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    医美消费的四大利益相关者
  </text>
  
  <\!-- 中心节点 -->
  <circle cx="200" cy="150" r="30" fill="#98d8c8"/>
  <text x="200" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">医美消费</text>
  
  <\!-- 消费者 -->
  <circle cx="100" cy="80" r="25" fill="#b8a9c9"/>
  <text x="100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">消费者</text>
  
  <\!-- 医生 -->
  <circle cx="300" cy="80" r="25" fill="#ff9a8b"/>
  <text x="300" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">医生</text>
  
  <\!-- 销售人员 -->
  <circle cx="100" cy="220" r="25" fill="#f4a261"/>
  <text x="100" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">销售人员</text>
  
  <\!-- 投资者 -->
  <circle cx="300" cy="220" r="25" fill="#4ecdc4"/>
  <text x="300" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">投资者</text>
  
  <\!-- 连接线 -->
  <line x1="125" y1="95" x2="175" y2="135" stroke="#6c757d" stroke-width="2"/>
  <line x1="275" y1="95" x2="225" y2="135" stroke="#6c757d" stroke-width="2"/>
  <line x1="125" y1="205" x2="175" y2="165" stroke="#6c757d" stroke-width="2"/>
  <line x1="275" y1="205" x2="225" y2="165" stroke="#6c757d" stroke-width="2"/>
  
  <\!-- 角色描述 -->
  <text x="100" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6c757d">决策者</text>
  <text x="300" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6c757d">服务提供者</text>
  <text x="100" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6c757d">推动者</text>
  <text x="300" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6c757d">资金提供者</text>
</svg>
