<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 未来伦理考量 -->
  <defs>
    <!-- 技术伦理渐变 -->
    <linearGradient id="tech-ethics-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 社会伦理渐变 -->
    <linearGradient id="social-ethics-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 商业伦理渐变 -->
    <linearGradient id="business-ethics-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <!-- 环境伦理渐变 -->
    <linearGradient id="environmental-ethics-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    未来伦理考量
  </text>
  
  <!-- 伦理考量中心 -->
  <g transform="translate(400, 150)">
    <text x="0" y="-50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">医美伦理未来挑战</text>
    
    <!-- 技术伦理 -->
    <g transform="translate(-150, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#tech-ethics-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="技术伦理：AI与生物技术" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">技术</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">伦理</text>
    </g>
    
    <!-- 社会伦理 -->
    <g transform="translate(-50, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#social-ethics-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="社会伦理：社会公平与正义" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">社会</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">伦理</text>
    </g>
    
    <!-- 商业伦理 -->
    <g transform="translate(50, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#business-ethics-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="商业伦理：诚信与责任" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">商业</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">伦理</text>
    </g>
    
    <!-- 环境伦理 -->
    <g transform="translate(150, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#environmental-ethics-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="环境伦理：可持续发展" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">环境</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">伦理</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -115 0 L -85 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M -15 0 L 15 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 85 0 L 115 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 技术伦理详情 -->
  <g transform="translate(50, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">技术伦理挑战：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">AI诊断的隐私保护</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">生物技术的安全性</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">基因美容的伦理边界</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">技术滥用的风险控制</text>
    </g>
  </g>
  
  <!-- 社会伦理详情 -->
  <g transform="translate(350, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">社会伦理挑战：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">美容标准的多元化</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">医美资源的公平分配</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">社会压力与心理影响</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">文化差异的尊重</text>
    </g>
  </g>
  
  <!-- 商业伦理详情 -->
  <g transform="translate(50, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">商业伦理挑战：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">真实透明的营销</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">合理的价格策略</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">专业资质的保障</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">消费者权益保护</text>
    </g>
  </g>
  
  <!-- 环境伦理详情 -->
  <g transform="translate(350, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2ecc71">环境伦理挑战：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">绿色美容材料研发</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">减少医疗废物产生</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">能源消耗优化</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">可持续包装设计</text>
    </g>
  </g>
  
  <!-- 伦理框架建设 -->
  <g transform="translate(650, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">伦理框架建设：</text>
    
    <!-- 框架层次 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="60" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="6" width="15" height="54" rx="7" fill="#9b59b6"/>
      <text x="25" y="35" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">90%</text>
      <text x="25" y="48" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">完善度</text>
    </g>
    
    <!-- 建设重点 -->
    <g transform="translate(0, 90)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">行业自律机制</text>
    </g>
    
    <g transform="translate(0, 110)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">法律法规完善</text>
    </g>
    
    <g transform="translate(0, 130)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">伦理教育普及</text>
    </g>
    
    <g transform="translate(0, 150)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">公众参与监督</text>
    </g>
  </g>
  
  <!-- 伦理平衡动画 -->
  <circle cx="400" cy="150" r="120" fill="none" stroke="#667eea" stroke-width="2" opacity="0.3">
    <animate attributeName="r" values="120;140;120" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各领域查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>