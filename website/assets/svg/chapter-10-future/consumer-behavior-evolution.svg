<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 消费者行为演化 -->
  <defs>
    <!-- 传统消费渐变 -->
    <linearGradient id="traditional-consumption-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 现代消费渐变 -->
    <linearGradient id="modern-consumption-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 未来消费渐变 -->
    <linearGradient id="future-consumption-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <!-- 影响因素渐变 -->
    <linearGradient id="influence-factors-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    消费者行为演化
  </text>
  
  <!-- 消费演化中心 -->
  <g transform="translate(400, 150)">
    <text x="0" y="-50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">医美消费行为演变</text>
    
    <!-- 传统消费 -->
    <g transform="translate(-150, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#traditional-consumption-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="传统消费：基础需求驱动" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">传统</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">消费</text>
    </g>
    
    <!-- 现代消费 -->
    <g transform="translate(-50, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#modern-consumption-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="现代消费：个性化需求" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">现代</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">消费</text>
    </g>
    
    <!-- 未来消费 -->
    <g transform="translate(50, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#future-consumption-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="未来消费：智能化体验" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">未来</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">消费</text>
    </g>
    
    <!-- 影响因素 -->
    <g transform="translate(150, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#influence-factors-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="影响因素：多维度驱动" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">影响</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">因素</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -115 0 L -85 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M -15 0 L 15 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 85 0 L 115 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 传统消费特征 -->
  <g transform="translate(50, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">传统消费特征：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">基础功能需求为主</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">价格敏感度高</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">信息获取渠道有限</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">品牌忠诚度较高</text>
    </g>
  </g>
  
  <!-- 现代消费特征 -->
  <g transform="translate(350, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">现代消费特征：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">个性化定制需求</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">体验式消费模式</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">数字化信息获取</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">社交媒体影响大</text>
    </g>
  </g>
  
  <!-- 未来消费特征 -->
  <g transform="translate(50, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">未来消费特征：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">AI智能推荐系统</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">虚拟现实体验</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">生物个性化定制</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">预防性美容理念</text>
    </g>
  </g>
  
  <!-- 影响因素详情 -->
  <g transform="translate(350, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2ecc71">影响因素：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">技术发展驱动</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">社会文化变迁</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">经济水平提升</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">信息获取便捷化</text>
    </g>
  </g>
  
  <!-- 消费行为变化趋势 -->
  <g transform="translate(650, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">变化趋势：</text>
    
    <!-- 趋势指示器 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="8" width="15" height="72" rx="7" fill="#2ecc71"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">90%</text>
      <text x="25" y="65" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">变化程度</text>
    </g>
    
    <!-- 关键变化点 -->
    <g transform="translate(0, 110)">
      <circle r="8" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">2020年转折点</text>
    </g>
    
    <g transform="translate(0, 130)">
      <circle r="8" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">2025年预测</text>
    </g>
    
    <g transform="translate(0, 150)">
      <circle r="8" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">2030年展望</text>
    </g>
  </g>
  
  <!-- 消费演化动画 -->
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#667eea" stroke-width="2" opacity="0.3">
      <animate attributeName="r" values="60;80;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 演化路径 -->
    <path d="M -50,0 A 50,50 0 0,1 50,0" fill="none" stroke="#667eea" stroke-width="2" opacity="0.5">
      <animate attributeName="stroke-dasharray" values="0,1000;1000,0" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各阶段查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>