<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 创新生态系统分析 -->
  <defs>
    <!-- 研发创新渐变 -->
    <linearGradient id="rd-innovation-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 产业协同渐变 -->
    <linearGradient id="industry-collaboration-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 人才培养渐变 -->
    <linearGradient id="talent-cultivation-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <!-- 政策支持渐变 -->
    <linearGradient id="policy-support-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    创新生态系统分析
  </text>
  
  <!-- 创新生态系统中心 -->
  <g transform="translate(400, 150)">
    <text x="0" y="-50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">医美创新生态要素</text>
    
    <!-- 研发创新 -->
    <g transform="translate(-150, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#rd-innovation-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="研发创新：技术研发与突破" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">研发</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">创新</text>
    </g>
    
    <!-- 产业协同 -->
    <g transform="translate(-50, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#industry-collaboration-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="产业协同：产业链合作" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">产业</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">协同</text>
    </g>
    
    <!-- 人才培养 -->
    <g transform="translate(50, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#talent-cultivation-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="人才培养：专业人才培育" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">人才</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">培养</text>
    </g>
    
    <!-- 政策支持 -->
    <g transform="translate(150, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#policy-support-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="政策支持：政策环境优化" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">政策</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">支持</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -115 0 L -85 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M -15 0 L 15 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 85 0 L 115 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 研发创新详情 -->
  <g transform="translate(50, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">研发创新体系：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">基础研究与应用研究结合</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">产学研一体化模式</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">创新平台建设</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">知识产权保护</text>
    </g>
  </g>
  
  <!-- 产业协同详情 -->
  <g transform="translate(350, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">产业协同网络：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">上下游企业合作</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">跨界融合创新</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">产业集群发展</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">资源共享机制</text>
    </g>
  </g>
  
  <!-- 人才培养详情 -->
  <g transform="translate(50, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">人才培养体系：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">专业教育体系完善</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">职业技能培训</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">国际交流合作</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">人才激励政策</text>
    </g>
  </g>
  
  <!-- 政策支持详情 -->
  <g transform="translate(350, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2ecc71">政策支持体系：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">创新激励政策</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">产业扶持政策</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">法规标准完善</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">国际规则对接</text>
    </g>
  </g>
  
  <!-- 生态系统评估 -->
  <g transform="translate(650, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">生态健康度：</text>
    
    <!-- 健康度指标 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="8" width="15" height="72" rx="7" fill="#2ecc71"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">90%</text>
      <text x="25" y="65" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">健康度</text>
    </g>
    
    <!-- 评估维度 -->
    <g transform="translate(0, 110)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">创新活力</text>
    </g>
    
    <g transform="translate(0, 130)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">协同效率</text>
    </g>
    
    <g transform="translate(0, 150)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">人才储备</text>
    </g>
    
    <g transform="translate(0, 170)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">政策环境</text>
    </g>
  </g>
  
  <!-- 生态系统循环动画 -->
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#667eea" stroke-width="2" opacity="0.3">
      <animate attributeName="r" values="60;80;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 系统连接线 -->
    <path d="M -60,0 L 60,0" stroke="#667eea" stroke-width="2" opacity="0.5">
      <animate attributeName="stroke-dasharray" values="0,1000;1000,0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各要素查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>