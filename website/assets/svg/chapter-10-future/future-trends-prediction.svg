<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 未来趋势预测 -->
  <defs>
    <!-- 技术趋势渐变 -->
    <linearGradient id="tech-trend-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 消费趋势渐变 -->
    <linearGradient id="consumer-trend-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 市场趋势渐变 -->
    <linearGradient id="market-trend-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <!-- 社会趋势渐变 -->
    <linearGradient id="social-trend-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    未来趋势预测
  </text>
  
  <!-- 趋势预测中心 -->
  <g transform="translate(400, 150)">
    <text x="0" y="-50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">医美行业发展趋势</text>
    
    <!-- 技术趋势 -->
    <g transform="translate(-150, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#tech-trend-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="技术趋势：AI与生物技术融合" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">技术</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">趋势</text>
    </g>
    
    <!-- 消费趋势 -->
    <g transform="translate(-50, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#consumer-trend-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="消费趋势：个性化与体验化" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">消费</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">趋势</text>
    </g>
    
    <!-- 市场趋势 -->
    <g transform="translate(50, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#market-trend-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="市场趋势：全球化与本地化" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">市场</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">趋势</text>
    </g>
    
    <!-- 社会趋势 -->
    <g transform="translate(150, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#social-trend-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="社会趋势：可持续发展与伦理" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">社会</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">趋势</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -115 0 L -85 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M -15 0 L 15 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 85 0 L 115 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 技术趋势详情 -->
  <g transform="translate(50, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">技术趋势：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">AI智能诊断与个性化方案</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">生物材料与再生医学</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">非侵入式治疗技术</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">数字化与虚拟现实应用</text>
    </g>
  </g>
  
  <!-- 消费趋势详情 -->
  <g transform="translate(350, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">消费趋势：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">个性化定制需求增长</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">体验式消费模式兴起</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">男性医美市场扩大</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">预防性医美理念普及</text>
    </g>
  </g>
  
  <!-- 市场趋势详情 -->
  <g transform="translate(50, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">市场趋势：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">新兴市场快速增长</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">线上线下融合模式</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">产业链整合与专业化</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">国际品牌本土化策略</text>
    </g>
  </g>
  
  <!-- 社会趋势详情 -->
  <g transform="translate(350, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2ecc71">社会趋势：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">可持续美容理念兴起</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">伦理规范与监管加强</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">多元化美容标准认同</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">心理健康与美容结合</text>
    </g>
  </g>
  
  <!-- 预测时间轴 -->
  <g transform="translate(650, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">预测时间轴：</text>
    
    <!-- 短期预测 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="20" rx="3" fill="#3498db"/>
      <text x="25" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1-3年</text>
      <text x="25" y="28" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">短期趋势</text>
    </g>
    
    <!-- 中期预测 -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="15" height="20" rx="3" fill="#f39c12"/>
      <text x="25" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">3-5年</text>
      <text x="25" y="28" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">中期趋势</text>
    </g>
    
    <!-- 长期预测 -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="15" height="20" rx="3" fill="#2ecc71"/>
      <text x="25" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">5-10年</text>
      <text x="25" y="28" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">长期趋势</text>
    </g>
  </g>
  
  <!-- 趋势预测动画 -->
  <circle cx="400" cy="150" r="120" fill="none" stroke="#667eea" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="120;150;120" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各趋势查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>