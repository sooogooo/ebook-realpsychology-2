<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow3">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 研究方法中心 -->
  <g transform="translate(400, 300)">
    <!-- 中心节点 -->
    <rect x="-60" y="-30" width="120" height="60" rx="30" fill="url(#grad3)" filter="url(#shadow3)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">研究方法</text>
    
    <!-- 方法分支 -->
    <g transform="translate(-200, -100)">
      <rect x="-50" y="-25" width="100" height="50" rx="25" fill="#3498db" filter="url(#shadow3)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">定量研究</text>
    </g>
    
    <g transform="translate(200, -100)">
      <rect x="-50" y="-25" width="100" height="50" rx="25" fill="#e74c3c" filter="url(#shadow3)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">定性研究</text>
    </g>
    
    <g transform="translate(-200, 100)">
      <rect x="-50" y="-25" width="100" height="50" rx="25" fill="#27ae60" filter="url(#shadow3)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">混合研究</text>
    </g>
    
    <g transform="translate(200, 100)">
      <rect x="-50" y="-25" width="100" height="50" rx="25" fill="#f39c12" filter="url(#shadow3)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">行动研究</text>
    </g>
    
    <!-- 连接线 -->
    <line x1="-60" y1="-20" x2="-150" y2="-85" stroke="#bdc3c7" stroke-width="2"/>
    <line x1="60" y1="-20" x2="150" y2="-85" stroke="#bdc3c7" stroke-width="2"/>
    <line x1="-60" y1="20" x2="-150" y2="85" stroke="#bdc3c7" stroke-width="2"/>
    <line x1="60" y1="20" x2="150" y2="85" stroke="#bdc3c7" stroke-width="2"/>
  </g>
  
  <!-- 标题 -->
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">研究方法框架</text>
  <text x="400" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">Research Methods Framework</text>
  
  <!-- 底部说明 -->
  <text x="400" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#95a5a6">医美消费心理学的多元研究方法体系</text>
</svg>