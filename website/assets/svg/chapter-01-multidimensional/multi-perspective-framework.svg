<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 多维视角中心 -->
  <g transform="translate(400, 300)">
    <!-- 中心圆 -->
    <circle cx="0" cy="0" r="60" fill="url(#grad2)" filter="url(#shadow2)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">医美消费</text>
    
    <!-- 四个维度 -->
    <g transform="translate(0, -120)">
      <circle cx="0" cy="0" r="40" fill="#3498db" filter="url(#shadow2)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">消费者</text>
    </g>
    
    <g transform="translate(120, 0)">
      <circle cx="0" cy="0" r="40" fill="#e74c3c" filter="url(#shadow2)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">医生</text>
    </g>
    
    <g transform="translate(0, 120)">
      <circle cx="0" cy="0" r="40" fill="#27ae60" filter="url(#shadow2)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">销售</text>
    </g>
    
    <g transform="translate(-120, 0)">
      <circle cx="0" cy="0" r="40" fill="#f39c12" filter="url(#shadow2)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">投资者</text>
    </g>
    
    <!-- 连接线 -->
    <line x1="0" y1="-60" x2="0" y2="-80" stroke="#bdc3c7" stroke-width="2"/>
    <line x1="60" y1="0" x2="80" y2="0" stroke="#bdc3c7" stroke-width="2"/>
    <line x1="0" y1="60" x2="0" y2="80" stroke="#bdc3c7" stroke-width="2"/>
    <line x1="-60" y1="0" x2="-80" y2="0" stroke="#bdc3c7" stroke-width="2"/>
  </g>
  
  <!-- 标题 -->
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">多维视角分析</text>
  <text x="400" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">Multi-dimensional Perspectives</text>
  
  <!-- 底部说明 -->
  <text x="400" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#95a5a6">四大利益相关者的综合分析框架</text>
</svg>