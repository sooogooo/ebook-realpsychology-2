<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 书本图标 -->
  <g transform="translate(400, 150)">
    <rect x="-60" y="-80" width="120" height="160" rx="5" fill="url(#grad1)" filter="url(#shadow)"/>
    <rect x="-55" y="-75" width="110" height="150" rx="3" fill="white"/>
    <line x1="0" y1="-75" x2="0" y2="75" stroke="#e0e0e0" stroke-width="2"/>
    <line x1="-30" y1="-50" x2="30" y2="-50" stroke="#ddd" stroke-width="1"/>
    <line x1="-30" y1="-30" x2="30" y2="-30" stroke="#ddd" stroke-width="1"/>
    <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#ddd" stroke-width="1"/>
  </g>
  
  <!-- 标题 -->
  <text x="400" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">医美消费心理学</text>
  <text x="400" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7f8c8d">Medical Aesthetics Consumer Psychology</text>
  
  <!-- 装饰元素 -->
  <g transform="translate(400, 400)">
    <circle cx="-100" cy="0" r="30" fill="#3498db" opacity="0.8"/>
    <circle cx="0" cy="0" r="30" fill="#e74c3c" opacity="0.8"/>
    <circle cx="100" cy="0" r="30" fill="#27ae60" opacity="0.8"/>
    
    <text x="-100" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">心理</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">消费</text>
    <text x="100" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">医美</text>
  </g>
  
  <!-- 底部装饰 -->
  <rect x="200" y="480" width="400" height="4" rx="2" fill="#3498db"/>
  <text x="400" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#95a5a6">序言与引言</text>
</svg>