<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 技术标准与规范 -->
  <defs>
    <!-- 标准制定渐变 -->
    <linearGradient id="standard-development-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 规范实施渐变 -->
    <linearGradient id="standard-implementation-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <!-- 监督检查渐变 -->
    <linearGradient id="supervision-inspection-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 持续改进渐变 -->
    <linearGradient id="continuous-improvement-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    技术标准与规范
  </text>
  
  <!-- 标准体系中心 -->
  <g transform="translate(400, 150)">
    <text x="0" y="-60" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">标准规范体系</text>
    
    <!-- 技术标准 -->
    <g transform="translate(-150, 0)">
      <rect x="-45" y="-25" width="90" height="50" rx="25" fill="url(#standard-development-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="技术标准：技术标准规范" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">技术</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">标准</text>
    </g>
    
    <!-- 安全规范 -->
    <g transform="translate(-50, 0)">
      <rect x="-45" y="-25" width="90" height="50" rx="25" fill="url(#standard-implementation-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="安全规范：安全规范要求" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">安全</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">规范</text>
    </g>
    
    <!-- 伦理规范 -->
    <g transform="translate(50, 0)">
      <rect x="-45" y="-25" width="90" height="50" rx="25" fill="url(#supervision-inspection-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="伦理规范：伦理规范标准" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">伦理</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">规范</text>
    </g>
    
    <!-- 质量标准 -->
    <g transform="translate(150, 0)">
      <rect x="-45" y="-25" width="90" height="50" rx="25" fill="url(#continuous-improvement-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="质量标准：质量控制标准" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">质量</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">标准</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -105 0 L -95 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M -5 0 L 5 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 95 0 L 105 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 标准层级 -->
  <g transform="translate(100, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">标准层级：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">国际标准：国际通用标准</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">国家标准：国家制定标准</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">行业标准：行业规范标准</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">企业标准：企业内部标准</text>
    </g>
  </g>
  
  <!-- 规范内容 -->
  <g transform="translate(400, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">规范内容：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">技术规范：技术参数要求</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">操作规范：操作流程规范</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">管理规范：管理流程规范</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">服务规范：服务质量规范</text>
    </g>
  </g>
  
  <!-- 合规指标 -->
  <g transform="translate(650, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">合规指标：</text>
    
    <!-- 合规指标指示器 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="8" width="15" height="72" rx="7" fill="#2ecc71"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">90%</text>
    </g>
    
    <!-- 指标说明 -->
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">不合规：0-60%</text>
    <text x="0" y="135" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">基本合规：61-85%</text>
    <text x="0" y="150" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">完全合规：86-100%</text>
  </g>
  
  <!-- 实施机制 -->
  <g transform="translate(100, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">实施机制：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">标准制定：制定相关标准</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">宣传推广：标准推广应用</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">监督检查：监督执行情况</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">违规处理：处理违规行为</text>
    </g>
  </g>
  
  <!-- 持续改进 -->
  <g transform="translate(400, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">持续改进：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 定期评估标准效果</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 根据技术发展更新</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 借鉴国际先进经验</text>
  </g>
  
  <!-- 标准规范动画 -->
  <circle cx="400" cy="150" r="120" fill="none" stroke="#3498db" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="120;140;120" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各标准查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>