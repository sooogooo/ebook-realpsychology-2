<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 技术风险评估与管理 -->
  <defs>
    <!-- 风险识别渐变 -->
    <linearGradient id="risk-identification-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 风险评估渐变 -->
    <linearGradient id="risk-assessment-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <!-- 风险控制渐变 -->
    <linearGradient id="risk-control-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 风险监控渐变 -->
    <linearGradient id="risk-monitoring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    技术风险评估与管理
  </text>
  
  <!-- 风险管理循环 -->
  <g transform="translate(400, 180)">
    <text x="0" y="-80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">风险管理循环</text>
    
    <!-- 风险识别 -->
    <g transform="translate(0, -120)">
      <circle cx="0" cy="0" r="35" fill="url(#risk-identification-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="风险识别：识别潜在风险" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">风险</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">识别</text>
    </g>
    
    <!-- 风险评估 -->
    <g transform="translate(120, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#risk-assessment-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="风险评估：评估风险程度" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">风险</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">评估</text>
    </g>
    
    <!-- 风险控制 -->
    <g transform="translate(0, 120)">
      <circle cx="0" cy="0" r="35" fill="url(#risk-control-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="风险控制：控制风险影响" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">风险</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">控制</text>
    </g>
    
    <!-- 风险监控 -->
    <g transform="translate(-120, 0)">
      <circle cx="0" cy="0" r="35" fill="url(#risk-monitoring-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="风险监控：监控风险变化" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">风险</text>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">监控</text>
    </g>
    
    <!-- 连接线和箭头 -->
    <path d="M 25 -85 L 85 -25" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 85 25 L 25 85" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M -25 85 L -85 25" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M -85 -25 L -25 -85" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- 风险类型 -->
  <g transform="translate(100, 380)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">风险类型：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">技术风险：技术故障、失效风险</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">安全风险：人身安全、健康风险</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">心理风险：心理压力、适应困难</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">伦理风险：隐私保护、伦理问题</text>
    </g>
  </g>
  
  <!-- 评估方法 -->
  <g transform="translate(400, 380)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">评估方法：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">风险矩阵：概率影响矩阵</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">专家评估：专家意见评估</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">数据分析：历史数据分析</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">模拟测试：风险模拟测试</text>
    </g>
  </g>
  
  <!-- 风险等级 -->
  <g transform="translate(650, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">风险等级：</text>
    
    <!-- 风险等级指示器 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="40" width="15" height="40" rx="7" fill="#f39c12"/>
      <text x="25" y="65" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">中等</text>
    </g>
    
    <!-- 风险等级说明 -->
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">低风险：0-25%</text>
    <text x="0" y="135" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">中风险：26-75%</text>
    <text x="0" y="150" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">高风险：76-100%</text>
  </g>
  
  <!-- 控制措施 -->
  <g transform="translate(100, 520)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">控制措施：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 技术验证和测试</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 安全保障措施</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 应急预案制定</text>
  </g>
  
  <!-- 监控机制 -->
  <g transform="translate(400, 520)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">监控机制：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 实时监测系统</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 定期评估审查</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 反馈改进机制</text>
  </g>
  
  <!-- 风险预警动画 -->
  <circle cx="400" cy="180" r="100" fill="none" stroke="#e74c3c" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="100;120;100" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各环节查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>