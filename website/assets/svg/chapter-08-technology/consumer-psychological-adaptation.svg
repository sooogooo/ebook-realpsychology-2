<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 消费者心理适应机制 -->
  <defs>
    <!-- 心理适应渐变 -->
    <linearGradient id="adaptation-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 认知调整渐变 -->
    <linearGradient id="cognitive-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <!-- 情感调节渐变 -->
    <linearGradient id="emotional-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 行为适应渐变 -->
    <linearGradient id="behavioral-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    消费者心理适应机制
  </text>
  
  <!-- 适应机制中心 -->
  <g transform="translate(400, 150)">
    <text x="0" y="-40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">心理适应维度</text>
    
    <!-- 认知调整 -->
    <g transform="translate(-150, 0)">
      <circle cx="0" cy="0" r="40" fill="url(#cognitive-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="认知调整：改变认知结构" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">认知</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">调整</text>
    </g>
    
    <!-- 情感调节 -->
    <g transform="translate(-50, 0)">
      <circle cx="0" cy="0" r="40" fill="url(#emotional-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="情感调节：管理情绪反应" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">情感</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">调节</text>
    </g>
    
    <!-- 行为适应 -->
    <g transform="translate(50, 0)">
      <circle cx="0" cy="0" r="40" fill="url(#behavioral-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="行为适应：调整行为模式" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">行为</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">适应</text>
    </g>
    
    <!-- 社会支持 -->
    <g transform="translate(150, 0)">
      <circle cx="0" cy="0" r="40" fill="url(#adaptation-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="社会支持：寻求社会支持" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">社会</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">支持</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -110 0 L -90 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M -10 0 L 10 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 90 0 L 110 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 认知调整策略 -->
  <g transform="translate(100, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">认知调整策略：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">信息获取：主动了解技术信息</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">风险评估：评估技术风险收益</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">期望管理：调整期望值</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">认知重构：重构认知框架</text>
    </g>
  </g>
  
  <!-- 情感调节方法 -->
  <g transform="translate(400, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">情感调节方法：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">情绪识别：识别情绪状态</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">放松训练：学习放松技巧</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">正念练习：培养正念意识</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">积极思维：培养积极心态</text>
    </g>
  </g>
  
  <!-- 适应过程 -->
  <g transform="translate(100, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">适应过程：</text>
    
    <!-- 过程阶段 -->
    <g transform="translate(0, 25)">
      <rect x="0" y="0" width="50" height="20" rx="10" fill="#3498db" opacity="0.7"/>
      <text x="25" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">初期</text>
      <text x="60" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">接触技术</text>
    </g>
    
    <g transform="translate(120, 25)">
      <rect x="0" y="0" width="50" height="20" rx="10" fill="#9b59b6" opacity="0.7"/>
      <text x="25" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">学习</text>
      <text x="60" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">学习使用</text>
    </g>
    
    <g transform="translate(240, 25)">
      <rect x="0" y="0" width="50" height="20" rx="10" fill="#e74c3c" opacity="0.7"/>
      <text x="25" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">适应</text>
      <text x="60" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">心理适应</text>
    </g>
    
    <g transform="translate(360, 25)">
      <rect x="0" y="0" width="50" height="20" rx="10" fill="#2ecc71" opacity="0.7"/>
      <text x="25" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">接受</text>
      <text x="60" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">完全接受</text>
    </g>
    
    <!-- 连接箭头 -->
    <path d="M 50 35 L 120 35" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 170 35 L 240 35" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 290 35 L 360 35" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- 适应效果 -->
  <g transform="translate(650, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">适应效果：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="16" width="15" height="64" rx="7" fill="#2ecc71"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">80%</text>
    </g>
  </g>
  
  <!-- 心理舒适度 -->
  <g transform="translate(650, 350)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">心理舒适度：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="20" width="15" height="60" rx="7" fill="#9b59b6"/>
      <text x="25" y="60" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">75%</text>
    </g>
  </g>
  
  <!-- 适应动画 -->
  <circle cx="400" cy="150" r="100" fill="none" stroke="#3498db" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="100;120;100" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各维度查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>