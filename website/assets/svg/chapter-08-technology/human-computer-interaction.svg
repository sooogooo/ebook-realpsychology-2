<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 人机交互心理效应 -->
  <defs>
    <!-- 交互体验渐变 -->
    <linearGradient id="interaction-experience-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 心理反馈渐变 -->
    <linearGradient id="psychological-feedback-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <!-- 行为改变渐变 -->
    <linearGradient id="behavioral-change-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 长期适应渐变 -->
    <linearGradient id="long-term-adaptation-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    人机交互心理效应
  </text>
  
  <!-- 交互循环中心 -->
  <g transform="translate(400, 150)">
    <text x="0" y="-60" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">人机交互循环</text>
    
    <!-- 用户输入 -->
    <g transform="translate(0, -100)">
      <rect x="-50" y="-20" width="100" height="40" rx="20" fill="url(#interaction-experience-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="用户输入：用户操作输入" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">用户输入</text>
    </g>
    
    <!-- 系统处理 -->
    <g transform="translate(120, 0)">
      <rect x="-50" y="-20" width="100" height="40" rx="20" fill="url(#psychological-feedback-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="系统处理：系统处理反馈" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">系统处理</text>
    </g>
    
    <!-- 反馈输出 -->
    <g transform="translate(0, 100)">
      <rect x="-50" y="-20" width="100" height="40" rx="20" fill="url(#behavioral-change-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="反馈输出：系统反馈输出" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">反馈输出</text>
    </g>
    
    <!-- 用户感知 -->
    <g transform="translate(-120, 0)">
      <rect x="-50" y="-20" width="100" height="40" rx="20" fill="url(#long-term-adaptation-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="用户感知：用户感知体验" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">用户感知</text>
    </g>
    
    <!-- 连接箭头 -->
    <path d="M 0 -80 L 0 -60" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 20 -80 L 100 -20" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 120 20 L 120 80" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 100 100 L 20 100" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 0 80 L 0 60" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M -20 80 L -100 20" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M -120 -20 L -120 -80" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M -100 -100 L -20 -100" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- 心理效应类型 -->
  <g transform="translate(100, 320)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">心理效应类型：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">控制感：用户对系统的控制感</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">成就感：完成任务后的成就感</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">沉浸感：深度投入的沉浸体验</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">信任感：对系统的信任感</text>
    </g>
  </g>
  
  <!-- 交互设计要素 -->
  <g transform="translate(400, 320)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">交互设计要素：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">界面设计：简洁直观的界面</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">反馈机制：及时有效的反馈</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">操作流程：顺畅的操作流程</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">个性化：个性化的体验</text>
    </g>
  </g>
  
  <!-- 用户体验评分 -->
  <g transform="translate(650, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">用户体验评分：</text>
    
    <!-- 用户体验指示器 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="16" width="15" height="64" rx="7" fill="#2ecc71"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">80%</text>
    </g>
    
    <!-- 评分说明 -->
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">差：0-40%</text>
    <text x="0" y="135" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">一般：41-70%</text>
    <text x="0" y="150" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">优秀：71-100%</text>
  </g>
  
  <!-- 情感反应 -->
  <g transform="translate(100, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">情感反应：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">愉悦感：使用过程中的愉悦</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">挫败感：遇到困难时的挫败</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">满足感：完成任务后的满足</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">期待感：对功能的期待</text>
    </g>
  </g>
  
  <!-- 优化策略 -->
  <g transform="translate(400, 480)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">优化策略：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 用户研究了解需求</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 迭代设计改进体验</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 情感化设计增强体验</text>
  </g>
  
  <!-- 交互循环动画 -->
  <circle cx="400" cy="150" r="120" fill="none" stroke="#3498db" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="120;140;120" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各环节查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>