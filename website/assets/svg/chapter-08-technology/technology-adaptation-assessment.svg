<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 技术适应综合评估 -->
  <defs>
    <!-- 评估指标渐变 -->
    <linearGradient id="assessment-indicator-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 适应程度渐变 -->
    <linearGradient id="adaptation-level-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <!-- 效果评估渐变 -->
    <linearGradient id="effect-evaluation-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 改进建议渐变 -->
    <linearGradient id="improvement-suggestion-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    技术适应综合评估
  </text>
  
  <!-- 评估框架中心 -->
  <g transform="translate(400, 150)">
    <text x="0" y="-60" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">综合评估框架</text>
    
    <!-- 评估指标 -->
    <g transform="translate(-150, 0)">
      <rect x="-45" y="-25" width="90" height="50" rx="25" fill="url(#assessment-indicator-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="评估指标：评估指标体系" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">评估</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">指标</text>
    </g>
    
    <!-- 适应程度 -->
    <g transform="translate(-50, 0)">
      <rect x="-45" y="-25" width="90" height="50" rx="25" fill="url(#adaptation-level-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="适应程度：技术适应程度" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">适应</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">程度</text>
    </g>
    
    <!-- 效果评估 -->
    <g transform="translate(50, 0)">
      <rect x="-45" y="-25" width="90" height="50" rx="25" fill="url(#effect-evaluation-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="效果评估：适应效果评估" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">效果</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">评估</text>
    </g>
    
    <!-- 改进建议 -->
    <g transform="translate(150, 0)">
      <rect x="-45" y="-25" width="90" height="50" rx="25" fill="url(#improvement-suggestion-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="改进建议：改进优化建议" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">改进</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">建议</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -105 0 L -95 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M -5 0 L 5 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 95 0 L 105 0" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 评估维度 -->
  <g transform="translate(100, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">评估维度：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">认知适应：认知理解程度</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">情感适应：情感接受程度</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">行为适应：行为改变程度</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">社会适应：社会融入程度</text>
    </g>
  </g>
  
  <!-- 评估方法 -->
  <g transform="translate(400, 280)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">评估方法：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">问卷调查：问卷调查统计</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">访谈调查：深度访谈分析</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">行为观察：实际行为观察</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">数据分析：数据分析评估</text>
    </g>
  </g>
  
  <!-- 综合评分 -->
  <g transform="translate(650, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">综合评分：</text>
    
    <!-- 综合评分指示器 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="12" width="15" height="68" rx="7" fill="#2ecc71"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">85%</text>
    </g>
    
    <!-- 评分说明 -->
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">差：0-40%</text>
    <text x="0" y="135" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">一般：41-70%</text>
    <text x="0" y="150" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">优秀：71-100%</text>
  </g>
  
  <!-- 评估结果 -->
  <g transform="translate(100, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">评估结果：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">适应水平：总体适应水平</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">问题识别：适应问题识别</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">效果分析：适应效果分析</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#f39c12"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">改进方向：改进优化方向</text>
    </g>
  </g>
  
  <!-- 持续监测 -->
  <g transform="translate(400, 450)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">持续监测：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 定期评估适应情况</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 动态调整评估指标</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 建立反馈改进机制</text>
  </g>
  
  <!-- 评估循环动画 -->
  <circle cx="400" cy="150" r="120" fill="none" stroke="#3498db" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="120;140;120" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各要素查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>