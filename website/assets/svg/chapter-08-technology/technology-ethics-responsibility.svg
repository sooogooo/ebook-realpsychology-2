<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 技术伦理与社会责任 -->
  <defs>
    <!-- 伦理原则渐变 -->
    <linearGradient id="ethical-principle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 社会影响渐变 -->
    <linearGradient id="social-impact-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <!-- 责任担当渐变 -->
    <linearGradient id="responsibility-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <!-- 可持续发展渐变 -->
    <linearGradient id="sustainability-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    技术伦理与社会责任
  </text>
  
  <!-- 伦理框架中心 -->
  <g transform="translate(400, 150)">
    <text x="0" y="-50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">伦理责任框架</text>
    
    <!-- 尊重自主 -->
    <g transform="translate(-120, -60)">
      <circle cx="0" cy="0" r="35" fill="url(#ethical-principle-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="尊重自主：尊重用户自主权" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">尊重</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">自主</text>
    </g>
    
    <!-- 无伤害原则 -->
    <g transform="translate(120, -60)">
      <circle cx="0" cy="0" r="35" fill="url(#ethical-principle-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="无伤害：避免技术伤害" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">无伤害</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">原则</text>
    </g>
    
    <!-- 有益原则 -->
    <g transform="translate(-120, 60)">
      <circle cx="0" cy="0" r="35" fill="url(#ethical-principle-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="有益：创造社会价值" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">有益</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">原则</text>
    </g>
    
    <!-- 公正原则 -->
    <g transform="translate(120, 60)">
      <circle cx="0" cy="0" r="35" fill="url(#ethical-principle-grad)" filter="url(#shadow)" data-interactive="true" data-tooltip="公正：确保公平公正" data-onclick="details"/>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">公正</text>
      <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">原则</text>
    </g>
    
    <!-- 连接线 -->
    <path d="M -85 -60 L 85 -60" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M -120 -25 L -120 25" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 120 -25 L 120 25" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M -85 60 L 85 60" stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 社会影响 -->
  <g transform="translate(100, 300)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">社会影响：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">就业影响：改变就业结构</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">社会公平：促进社会公平</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">文化影响：影响文化发展</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#9b59b6"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">伦理挑战：面临伦理挑战</text>
    </g>
  </g>
  
  <!-- 责任担当 -->
  <g transform="translate(400, 300)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">责任担当：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">企业责任：企业社会责任</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">研发责任：研发伦理责任</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">应用责任：应用伦理责任</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#2ecc71"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">监管责任：监管审查责任</text>
    </g>
  </g>
  
  <!-- 伦理合规指标 -->
  <g transform="translate(650, 200)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">伦理合规指标：</text>
    
    <!-- 合规指标指示器 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#ecf0f1"/>
      <rect x="0" y="8" width="15" height="72" rx="7" fill="#2ecc71"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">90%</text>
    </g>
    
    <!-- 指标说明 -->
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">不合规：0-60%</text>
    <text x="0" y="135" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">基本合规：61-85%</text>
    <text x="0" y="150" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">完全合规：86-100%</text>
  </g>
  
  <!-- 风险防范 -->
  <g transform="translate(100, 470)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">风险防范：</text>
    
    <g transform="translate(0, 25)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">隐私保护：保护用户隐私</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">安全防护：确保技术安全</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">透明度：提高透明度</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle r="5" fill="#e74c3c"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">问责机制：建立问责机制</text>
    </g>
  </g>
  
  <!-- 可持续发展 -->
  <g transform="translate(400, 470)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">可持续发展：</text>
    <text y="20" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 技术与社会协调发展</text>
    <text y="40" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 长期社会价值创造</text>
    <text y="60" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">• 伦理规范持续完善</text>
  </g>
  
  <!-- 伦理光芒动画 -->
  <circle cx="400" cy="150" r="120" fill="none" stroke="#3498db" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="120;140;120" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 交互提示 -->
  <g data-interactive="true" data-tooltip="点击各原则查看详细说明">
    <circle cx="750" cy="50" r="20" fill="#667eea" opacity="0.8" cursor="pointer"/>
    <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">?</text>
  </g>
</svg>