<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <title>Doctor Stakeholder Icon</title>
  <desc>Icon representing doctor/medical professional perspective</desc>

  <!-- Main person outline -->
  <g stroke="#2D3748" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head with medical cap -->
    <circle cx="12" cy="7" r="4"/>
    <path d="M 8 3 h 8 v 2 h -8 z" stroke-width="1"/>

    <!-- Medical cross on cap -->
    <g stroke="#48BB78" stroke-width="1">
      <line x1="11" y1="2" x2="13" y2="2"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
    </g>

    <!-- Body with lab coat -->
    <path d="M 5 21 v -2 a 6 6 0 0 1 6 -6 h 2 a 6 6 0 0 1 6 6 v 2"/>
    <path d="M 7 13 h 10 v 8 h -10 z" stroke-width="1"/>

    <!-- Stethoscope -->
    <circle cx="18" cy="12" r="2" stroke-width="1"/>
    <path d="M 16 12 q -2 0, -2 2 v 3 q 0 1, -1 1" stroke-width="1"/>
    <circle cx="13" cy="18" r="1" stroke-width="1"/>

    <!-- Professional indicators -->
    <line x1="10" y1="16" x2="14" y2="16" stroke-width="1"/>
    <line x1="10" y1="18" x2="14" y2="18" stroke-width="1"/>
  </g>

  <!-- Expertise/knowledge symbols -->
  <g stroke="#ED8936" stroke-width="1" fill="none">
    <circle cx="7" cy="10" r="1" fill="#ED8936" stroke="#ED8936"/>
    <circle cx="17" cy="8" r="1" fill="#ED8936" stroke="#ED8936"/>
  </g>
</svg>