<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b8a9c9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9a8b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <g stroke="#2c3e50" stroke-width="1.5" fill="none">
    <!-- Magnifying glass analyzing data -->
    <circle cx="150" cy="100" r="40" stroke-width="2"/>
    <line x1="180" y1="130" x2="210" y2="160" stroke-width="3"/>
    
    <!-- Data points inside magnifying glass -->
    <circle cx="140" cy="90" r="3" fill="#98d8c8"/>
    <circle cx="160" cy="95" r="3" fill="#b8a9c9"/>
    <circle cx="150" cy="110" r="3" fill="#ff9a8b"/>
    <circle cx="135" cy="105" r="3" fill="#f4a261"/>
    
    <!-- Research methodology symbols -->
    <g transform="translate(300, 80)">
      <!-- Bar chart -->
      <rect x="0" y="20" width="8" height="30" fill="#98d8c8"/>
      <rect x="12" y="15" width="8" height="35" fill="#b8a9c9"/>
      <rect x="24" y="25" width="8" height="25" fill="#ff9a8b"/>
      <rect x="36" y="10" width="8" height="40" fill="#f4a261"/>
    </g>
    
    <!-- Pie chart -->
    <g transform="translate(420, 100)">
      <circle cx="0" cy="0" r="30" stroke-width="1"/>
      <path d="M 0 0 L 0 -30 A 30 30 0 0 1 21 -21 Z" fill="#98d8c8" opacity="0.7"/>
      <path d="M 0 0 L 21 -21 A 30 30 0 0 1 30 0 Z" fill="#b8a9c9" opacity="0.7"/>
      <path d="M 0 0 L 30 0 A 30 30 0 0 1 0 30 Z" fill="#ff9a8b" opacity="0.7"/>
    </g>
    
    <!-- Brain with critical thinking -->
    <g transform="translate(550, 100)">
      <path d="M 0 0 Q -20 -20, 0 -30 Q 20 -20, 25 0 Q 20 20, 0 25 Q -20 20, 0 0" stroke-width="1.5"/>
      <!-- Question mark -->
      <path d="M -5 -10 Q -5 -15, 0 -15 Q 5 -15, 5 -10 Q 5 -5, 0 0" stroke-width="2" fill="none"/>
      <circle cx="0" cy="5" r="2" fill="#2c3e50"/>
    </g>
    
    <!-- Light bulb for ideas -->
    <g transform="translate(650, 100)">
      <circle cx="0" cy="-5" r="15" stroke-width="1.5"/>
      <rect x="-8" y="5" width="16" height="10" rx="2" stroke-width="1"/>
      <line x1="-5" y1="8" x2="5" y2="8" stroke-width="1"/>
      <line x1="-5" y1="12" x2="5" y2="12" stroke-width="1"/>
      <!-- Light rays -->
      <line x1="0" y1="-25" x2="0" y2="-35" stroke-width="2" stroke-dasharray="2,2"/>
      <line x1="18" y1="-18" x2="25" y2="-25" stroke-width="2" stroke-dasharray="2,2"/>
      <line x1="-18" y1="-18" x2="-25" y2="-25" stroke-width="2" stroke-dasharray="2,2"/>
    </g>
  </g>
  
  <!-- Background accent -->
  <rect x="50" y="50" width="700" height="100" fill="url(#grad2)" opacity="0.1" rx="10"/>
</svg>