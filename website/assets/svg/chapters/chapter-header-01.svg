<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#98d8c8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8a9c9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Abstract brain and network connections -->
  <g stroke="#2c3e50" stroke-width="1.5" fill="none">
    <!-- Central brain shape -->
    <path d="M 150 100 Q 180 70, 220 80 T 280 100 Q 300 120, 280 140 T 220 160 Q 180 170, 150 160 T 100 100 Q 100 80, 150 100" />
    
    <!-- Network connections -->
    <line x1="280" y1="100" x2="350" y2="80" stroke-dasharray="5,5" opacity="0.6"/>
    <line x1="280" y1="100" x2="350" y2="120" stroke-dasharray="5,5" opacity="0.6"/>
    <line x1="280" y1="100" x2="400" y2="100" stroke-dasharray="5,5" opacity="0.6"/>
    
    <!-- Decision nodes -->
    <circle cx="350" cy="80" r="8" fill="#98d8c8"/>
    <circle cx="350" cy="120" r="8" fill="#b8a9c9"/>
    <circle cx="400" cy="100" r="10" fill="#ff9a8b"/>
    
    <!-- Consumer figures -->
    <g transform="translate(500, 60)">
      <circle cx="0" cy="0" r="12" stroke-width="1"/>
      <path d="M -15 15 Q 0 10, 15 15 L 10 35 L -10 35 Z" stroke-width="1"/>
    </g>
    
    <g transform="translate(580, 90)">
      <circle cx="0" cy="0" r="12" stroke-width="1"/>
      <path d="M -15 15 Q 0 10, 15 15 L 10 35 L -10 35 Z" stroke-width="1"/>
    </g>
    
    <g transform="translate(660, 120)">
      <circle cx="0" cy="0" r="12" stroke-width="1"/>
      <path d="M -15 15 Q 0 10, 15 15 L 10 35 L -10 35 Z" stroke-width="1"/>
    </g>
    
    <!-- Connection lines between people -->
    <path d="M 515 75 Q 550 80, 565 95" stroke-dasharray="3,3" opacity="0.5"/>
    <path d="M 595 105 Q 620 110, 645 125" stroke-dasharray="3,3" opacity="0.5"/>
  </g>
  
  <!-- Title area placeholder -->
  <rect x="50" y="50" width="700" height="100" fill="url(#grad1)" opacity="0.1" rx="10"/>
</svg>