<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG插图库 - 医美消费心理学</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: #f8f9fa;
            color: #2c3e50;
        }
        
        .gallery-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .gallery-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            color: white;
        }
        
        .gallery-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 16px;
        }
        
        .gallery-header p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .search-section {
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .search-box {
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .search-input {
            width: 100%;
            padding: 12px 20px 12px 50px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        
        .search-input:focus {
            border-color: #667eea;
        }
        
        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }
        
        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .chapters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .chapter-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .chapter-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        
        .chapter-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e9ecef;
        }
        
        .chapter-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
        }
        
        .chapter-icon .material-symbols-outlined {
            color: white;
            font-size: 24px;
        }
        
        .chapter-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c3e50;
            margin: 0;
        }
        
        .chapter-count {
            color: #6c757d;
            font-size: 0.9rem;
            margin-top: 2px;
        }
        
        .illustrations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }
        
        .illustration-item {
            aspect-ratio: 1;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .illustration-item:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .illustration-item .material-symbols-outlined {
            color: #6c757d;
            font-size: 32px;
        }
        
        .illustration-item:hover .material-symbols-outlined {
            color: #667eea;
        }
        
        .illustration-tooltip {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px;
            font-size: 0.8rem;
            text-align: center;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        
        .illustration-item:hover .illustration-tooltip {
            transform: translateY(0);
        }
        
        .view-all-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 15px;
        }
        
        .view-all-btn:hover {
            background: #5a6fd8;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
            position: relative;
        }
        
        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        
        .error {
            background: #e74c3c;
            color: white;
            padding: 12px;
            border-radius: 6px;
            margin: 10px 0;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            .gallery-header h1 {
                font-size: 2rem;
            }
            
            .chapters-grid {
                grid-template-columns: 1fr;
            }
            
            .illustrations-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <div class="gallery-header">
            <h1>医美消费心理学 SVG 插图库</h1>
            <p>包含100+专业插图，涵盖10个核心章节，支持交互式查看和下载</p>
        </div>
        
        <div class="search-section">
            <div class="search-box">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" class="search-input" placeholder="搜索插图名称、描述或章节..." id="searchInput">
            </div>
        </div>
        
        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-number" id="totalIllustrations">84</div>
                <div class="stat-label">总插图数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalChapters">8</div>
                <div class="stat-label">核心章节</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalCategories">12</div>
                <div class="stat-label">插图类型</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="fileSize">15MB</div>
                <div class="stat-label">文件大小</div>
            </div>
        </div>
        
        <div class="chapters-grid" id="chaptersGrid">
            <!-- 章节卡片将通过JavaScript动态生成 -->
        </div>
    </div>
    
    <!-- 插图显示模态框 -->
    <div class="modal" id="illustrationModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div id="modalBody">
                <div class="loading">
                    <span class="material-symbols-outlined">hourglass_top</span>
                    <p>加载中...</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 引入依赖 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="assets/js/svg-illustration-manager.js"></script>
    
    <script>
        // 章节数据
        const chaptersData = [
            {
                id: 'chapter-01-perspectives',
                title: '多维视角',
                count: 12,
                icon: 'visibility',
                description: '展示消费者、医生、销售人员、投资者四个视角'
            },
            {
                id: 'chapter-02-research-methods',
                title: '研究方法',
                count: 11,
                icon: 'science',
                description: '定量、定性、混合研究方法'
            },
            {
                id: 'chapter-03-motivation',
                title: '消费动机',
                count: 10,
                icon: 'psychology',
                description: '内在动机、外在动机、社会影响'
            },
            {
                id: 'chapter-04-information',
                title: '信息处理',
                count: 9,
                icon: 'memory',
                description: '认知偏差、风险评估、信息来源'
            },
            {
                id: 'chapter-07-ethics',
                title: '伦理边界',
                count: 9,
                icon: 'balance',
                description: '知情同意、营销伦理、数据隐私'
            },
            {
                id: 'chapter-08-technology',
                title: '技术发展',
                count: 12,
                icon: 'biotech',
                description: '技术发展历程、创新驱动、AI应用'
            },
            {
                id: 'chapter-09-culture',
                title: '文化差异',
                count: 11,
                icon: 'public',
                description: '东西方审美、文化价值观、跨文化沟通'
            },
            {
                id: 'chapter-10-future',
                title: '未来展望',
                count: 10,
                icon: 'trending_up',
                description: '发展趋势、技术预测、市场前景'
            }
        ];
        
        let svgManager;
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            svgManager = new SVGIllustrationManager();
            renderChapters();
            setupSearch();
            updateStats();
        });
        
        // 渲染章节卡片
        function renderChapters() {
            const grid = document.getElementById('chaptersGrid');
            grid.innerHTML = '';
            
            chaptersData.forEach(chapter => {
                const card = createChapterCard(chapter);
                grid.appendChild(card);
            });
        }
        
        // 创建章节卡片
        function createChapterCard(chapter) {
            const card = document.createElement('div');
            card.className = 'chapter-card';
            
            const illustrations = svgManager.getChapterIllustrations(chapter.id) || [];
            const displayIllustrations = illustrations.slice(0, 6);
            
            card.innerHTML = `
                <div class="chapter-header">
                    <div class="chapter-icon">
                        <span class="material-symbols-outlined">${chapter.icon}</span>
                    </div>
                    <div>
                        <h3 class="chapter-title">${chapter.title}</h3>
                        <div class="chapter-count">${chapter.count} 个插图</div>
                    </div>
                </div>
                <div class="illustrations-grid">
                    ${displayIllustrations.map(ill => `
                        <div class="illustration-item" onclick="showIllustration('${chapter.id}', '${ill.id}')">
                            <span class="material-symbols-outlined">image</span>
                            <div class="illustration-tooltip">${ill.name}</div>
                        </div>
                    `).join('')}
                    ${illustrations.length > 6 ? `
                        <div class="illustration-item" onclick="showChapterIllustrations('${chapter.id}')">
                            <span class="material-symbols-outlined">more_horiz</span>
                            <div class="illustration-tooltip">查看更多</div>
                        </div>
                    ` : ''}
                </div>
                <button class="view-all-btn" onclick="showChapterIllustrations('${chapter.id}')">
                    查看全部 ${chapter.count} 个插图
                </button>
            `;
            
            return card;
        }
        
        // 显示插图
        function showIllustration(chapter, illustrationId) {
            if (svgManager) {
                svgManager.showIllustration(chapter, illustrationId);
            }
        }
        
        // 显示章节所有插图
        function showChapterIllustrations(chapterId) {
            const chapter = chaptersData.find(c => c.id === chapterId);
            const illustrations = svgManager.getChapterIllustrations(chapterId) || [];
            
            const modal = document.getElementById('illustrationModal');
            const modalBody = document.getElementById('modalBody');
            
            modalBody.innerHTML = `
                <div style="padding: 20px;">
                    <h2>${chapter.title} - 全部插图</h2>
                    <p style="color: #6c757d; margin-bottom: 20px;">${chapter.description}</p>
                    <div class="illustrations-grid" style="grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));">
                        ${illustrations.map(ill => `
                            <div class="illustration-item" onclick="showIllustration('${chapterId}', '${ill.id}'); closeModal();" style="height: 120px;">
                                <span class="material-symbols-outlined">image</span>
                                <div class="illustration-tooltip">${ill.name}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            
            modal.style.display = 'flex';
        }
        
        // 关闭模态框
        function closeModal() {
            document.getElementById('illustrationModal').style.display = 'none';
        }
        
        // 设置搜索功能
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            let searchTimeout;
            
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                const query = this.value.trim();
                
                searchTimeout = setTimeout(() => {
                    if (query.length > 0) {
                        performSearch(query);
                    } else {
                        renderChapters();
                    }
                }, 300);
            });
        }
        
        // 执行搜索
        function performSearch(query) {
            const results = svgManager.searchIllustrations(query);
            
            const grid = document.getElementById('chaptersGrid');
            grid.innerHTML = '';
            
            if (results.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #6c757d;">
                        <span class="material-symbols-outlined" style="font-size: 48px;">search_off</span>
                        <p>没有找到匹配的插图</p>
                    </div>
                `;
                return;
            }
            
            // 按章节分组显示结果
            const groupedResults = {};
            results.forEach(result => {
                if (!groupedResults[result.chapter]) {
                    groupedResults[result.chapter] = [];
                }
                groupedResults[result.chapter].push(result);
            });
            
            Object.keys(groupedResults).forEach(chapterId => {
                const chapter = chaptersData.find(c => c.id === chapterId);
                const chapterResults = groupedResults[chapterId];
                
                const card = document.createElement('div');
                card.className = 'chapter-card';
                card.innerHTML = `
                    <div class="chapter-header">
                        <div class="chapter-icon">
                            <span class="material-symbols-outlined">${chapter.icon}</span>
                        </div>
                        <div>
                            <h3 class="chapter-title">${chapter.title}</h3>
                            <div class="chapter-count">${chapterResults.length} 个匹配结果</div>
                        </div>
                    </div>
                    <div class="illustrations-grid">
                        ${chapterResults.map(result => `
                            <div class="illustration-item" onclick="showIllustration('${result.chapter}', '${result.id}')">
                                <span class="material-symbols-outlined">image</span>
                                <div class="illustration-tooltip">${result.name}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        // 更新统计数据
        function updateStats() {
            const totalIllustrations = chaptersData.reduce((sum, chapter) => sum + chapter.count, 0);
            document.getElementById('totalIllustrations').textContent = totalIllustrations;
            document.getElementById('totalChapters').textContent = chaptersData.length;
        }
        
        // 点击模态框外部关闭
        document.getElementById('illustrationModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
        
        // ESC键关闭模态框
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
